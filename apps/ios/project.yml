# Generates Verdery.xcodeproj — never edit that file directly, edit this one
# and run `xcodegen generate`.
#
# Package.swift stays the source of truth for module boundaries, per its own
# header comment; this project is a thin deployment shell around it. Its only
# sources are the app entry point (Sources/VerderyApp, shared verbatim with
# the SPM executableTarget of the same name that keeps `swift build`/
# `swift test` working headlessly) plus Info.plist, entitlements, and the
# asset catalog — every feature and every line of business logic still lives
# in the Swift package and is still enforced by its target graph.
#
# An Xcode project became necessary in Phase 2: Firebase Authentication needs
# entitlements (Sign in with Apple), a custom Info.plist (the Google Sign-In
# URL scheme), and a bundled GoogleService-Info.plist, none of which a bare
# `swift build` can express.
#
# Source: implementation-plan.md work packages P2-IOS-01, P2-AUTH-03;
# architecture/ios-application-design.md, section "4. Application Structure".
name: Verdery

options:
  bundleIdPrefix: com.verdery
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  VerderyPackage:
    path: .

targets:
  Verdery:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    # Everything the app bundle contains. Resources belong here, in `sources`,
    # NOT under a `resources:` key: XcodeGen has no such key and silently
    # ignores it, which is exactly how GoogleService-Info.plist went missing
    # from every build between Phase 2 and Phase 8 — `FirebaseApp.configure()`
    # would have trapped on launch. XcodeGen routes each path to the right
    # build phase by file type, so the .plist, the asset catalogue, and the
    # privacy manifest all land in "Copy Bundle Resources" from here.
    sources:
      - path: Sources/VerderyApp
      - path: GoogleService-Info.plist
      # The 1024x1024 App Store icon. Regenerated by Tools/generate-app-icon.py
      # — see that script for why the PNG is committed but not hand-drawn.
      - path: Resources/Assets.xcassets
      # Apple's required privacy manifest for this app's own code. Xcode folds
      # it together with each linked SDK's manifest into the archive's privacy
      # report, which App Store Connect reads on upload.
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: VerderyPackage
        product: AppComposition
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Verdery
        UILaunchScreen: {}
        # Build-setting references, NOT literals. XcodeGen's defaults for these
        # two keys bake the values from `settings` below straight into the
        # generated Info.plist, which silently defeats
        # `xcodebuild CURRENT_PROJECT_VERSION=...`: the archive keeps whatever
        # number was generated. That surfaces as App Store Connect rejecting
        # every upload after the first for reusing a build number, with nothing
        # in the build output hinting why. Referencing the settings keeps the
        # command-line override authoritative.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The app ships an English and a Russian catalogue
        # (Sources/CoreLocalization/Resources/{en,ru}.lproj). Without this key
        # the App Store lists the app as English-only regardless of what the
        # bundle actually contains, because the localizations live in a
        # package resource bundle rather than in the app bundle's own root.
        CFBundleLocalizations:
          - en
          - ru
        # The app uses only HTTPS/TLS through URLSession and Apple's own
        # keychain — no proprietary or non-exempt cryptography. Declaring it
        # here answers the export-compliance question once, at build time,
        # instead of prompting a human on every single TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # NOTE — deliberately absent: NSPhotoLibraryUsageDescription and
        # NSCameraUsageDescription. Photo selection goes exclusively through
        # SwiftUI's `PhotosPicker`, which runs out of process and grants this
        # app no photo-library access at all, and no camera API is used
        # anywhere (verified across Sources/). Declaring a purpose string for
        # access the app never takes would be a false statement to the
        # reviewer, so neither key is present. Add one the day a direct
        # `Photos`/`AVCapture` path is introduced.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # All four, including upside-down. An iPad app that does not set
        # UIRequiresFullScreen must support every orientation or the archive
        # validation step warns ("All interface orientations must be supported
        # unless the app requires full screen") — it is a prerequisite of
        # Split View / Slide Over, which iPadOS offers for any app that does
        # not opt out. The iPhone list above stays portrait-only, which is
        # allowed and is what the map editor is designed for.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required by Google Sign-In's iOS SDK so it can hand the OAuth
        # redirect back to this app. The reversed form of the OAuth client ID
        # Firebase issued for this app — not a secret, matching
        # apps/web/core/auth/firebase-app.ts's identical reasoning about the
        # web apiKey.
        # Source: GoogleService-Info.plist, key REVERSED_CLIENT_ID.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.417008876420-ofvf3en5tk3th23cd0flklqa22vncvt4
        # Which API this build talks to, as a build-setting reference rather
        # than a literal — see Sources/AppComposition/AppEnvironment.swift.
        # The default below is the local development container, which is right
        # for the Simulator and unreachable from a phone: an archive intended
        # for TestFlight MUST override it, e.g.
        # `xcodebuild ... API_ORIGIN=https://api.example.com`.
        VerderyAPIOrigin: "$(API_ORIGIN)"
    entitlements:
      path: Generated/Verdery.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verdery.app
        # The repository owner's real Apple Developer team. Not a secret — it
        # appears in every signed binary Apple distributes. `scripts/
        # archive-and-upload.sh` overrides it from the command line when a
        # different team signs the build, so this value is a default, not a
        # pin.
        DEVELOPMENT_TEAM: 3M68DG8S7N
        MARKETING_VERSION: "1.0"
        # Overridden per archive; see the VerderyAPIOrigin note above.
        API_ORIGIN: "http://localhost:8080"
        # Overridden per upload by scripts/archive-and-upload.sh: App
        # Store Connect rejects a build whose (version, build) pair it has
        # already seen, so this literal is only the local-build default.
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
