# Generates Verdery.xcodeproj — never edit that file directly, edit this one
# and run `xcodegen generate`.
#
# Package.swift stays the source of truth for module boundaries, per its own
# header comment; this project is a thin deployment shell around it. Its only
# sources are the app entry point (Sources/VerderyApp, shared verbatim with
# the SPM executableTarget of the same name that keeps `swift build`/
# `swift test` working headlessly) plus Info.plist, entitlements, and the
# asset catalog — every feature and every line of business logic still lives
# in the Swift package and is still enforced by its target graph.
#
# An Xcode project became necessary in Phase 2: Firebase Authentication needs
# entitlements (Sign in with Apple), a custom Info.plist (the Google Sign-In
# URL scheme), and a bundled GoogleService-Info.plist, none of which a bare
# `swift build` can express.
#
# Source: implementation-plan.md work packages P2-IOS-01, P2-AUTH-03;
# architecture/ios-application-design.md, section "4. Application Structure".
name: Verdery

options:
  bundleIdPrefix: com.verdery
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# The local Swift package, and the only package reference this project needs:
# every third-party SDK — Firebase, GRDB, and (since the native Google sign-in
# flow) GoogleSignIn-iOS — is declared in Package.swift and reaches the app
# target transitively through the AppComposition product below. Declaring one
# here as well would pin the same version in two places. Verified in the
# Release-iphoneos build: GIDSignIn is linked into the binary and
# GoogleSignIn_GoogleSignIn.bundle is copied into Verdery.app.
packages:
  VerderyPackage:
    path: .

targets:
  Verdery:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    # Everything the app bundle contains. Resources belong here, in `sources`,
    # NOT under a `resources:` key: XcodeGen has no such key and silently
    # ignores it, which is exactly how GoogleService-Info.plist went missing
    # from every build between Phase 2 and Phase 8 — `FirebaseApp.configure()`
    # would have trapped on launch. XcodeGen routes each path to the right
    # build phase by file type, so the .plist, the asset catalogue, and the
    # privacy manifest all land in "Copy Bundle Resources" from here.
    sources:
      - path: Sources/VerderyApp
      - path: GoogleService-Info.plist
      # The 1024x1024 App Store icon. Regenerated by Tools/generate-app-icon.py
      # — see that script for why the PNG is committed but not hand-drawn.
      - path: Resources/Assets.xcassets
      # Apple's required privacy manifest for this app's own code. Xcode folds
      # it together with each linked SDK's manifest into the archive's privacy
      # report, which App Store Connect reads on upload.
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: VerderyPackage
        product: AppComposition
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Verdery
        UILaunchScreen: {}
        # Build-setting references, NOT literals. XcodeGen's defaults for these
        # two keys bake the values from `settings` below straight into the
        # generated Info.plist, which silently defeats
        # `xcodebuild CURRENT_PROJECT_VERSION=...`: the archive keeps whatever
        # number was generated. That surfaces as App Store Connect rejecting
        # every upload after the first for reusing a build number, with nothing
        # in the build output hinting why. Referencing the settings keeps the
        # command-line override authoritative.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The app ships an English and a Russian catalogue
        # (Sources/CoreLocalization/Resources/{en,ru}.lproj). Without this key
        # the App Store lists the app as English-only regardless of what the
        # bundle actually contains, because the localizations live in a
        # package resource bundle rather than in the app bundle's own root.
        CFBundleLocalizations:
          - en
          - ru
        # The app uses only HTTPS/TLS through URLSession and Apple's own
        # keychain — no proprietary or non-exempt cryptography. Declaring it
        # here answers the export-compliance question once, at build time,
        # instead of prompting a human on every single TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # NSPhotoLibraryUsageDescription stays absent: library selection goes
        # exclusively through SwiftUI's `PhotosPicker`, which runs out of
        # process and grants this app no photo-library access at all —
        # declaring a purpose string for access the app never takes would be
        # a false statement to the reviewer.
        #
        # NSCameraUsageDescription IS now required: `CoreMediaTransfer
        # .CameraCapturePicker` (`UIImagePickerController(sourceType:
        # .camera)`) lets a user photograph a plant directly instead of only
        # picking an existing library photo, at all three photo-attach
        # points (add-plant-from-photo, plant-detail attach-photo,
        # observation-record photo).
        NSCameraUsageDescription: "Verdery uses the camera so you can photograph a plant to identify it or add it to your garden records."
        # Required by `AppComposition.DeviceLocationProvider`: one fix, on
        # demand, from the "Use my location" button on the georeference screen,
        # and one compass heading for the north dial. Nothing is tracked and
        # nothing is requested at launch — the prompt belongs to the button
        # that needs it, and the other two ways of placing a garden work
        # without ever granting this.
        NSLocationWhenInUseUsageDescription: "Verdery uses your location once, when you ask it to, to place your garden on the map and to point its north dial. It never tracks you."
        # Occasional system-granted time to drain the offline outbox while the
        # app is closed — the third synchronization trigger
        # architecture/ios-application-design.md section 8 names. iOS refuses
        # to register a task identifier that is not declared here, and the
        # refusal is a trap at launch rather than an error a caller can read,
        # so this list and `AppComposition.BackgroundSyncScheduler
        # .taskIdentifier` must stay in step.
        #
        # `processing`, not `fetch`: a bounded push and pull can outlast the
        # few seconds background refresh allows, and this work has no deadline.
        BGTaskSchedulerPermittedIdentifiers:
          - com.verdery.app.sync
        UIBackgroundModes:
          - processing
          # The server sends DATA-ONLY pushes, so iOS displays nothing on its
          # own and this application must wake to render the banner in the
          # reader's language. Without this mode the push is delivered only
          # when the application is already open, which defeats the point.
          - remote-notification
        # Landscape is DECLARED here but allowed at runtime on one screen
        # only. An orientation absent from this list can never be entered, so
        # the map — where a wide canvas is worth real estate — needs it
        # declared app-wide; `AppComposition.OrientationPolicy`, read by
        # `AppDelegate.application(_:supportedInterfaceOrientationsFor:)`, is
        # what keeps every other screen portrait.
        #
        # Upside-down is deliberately absent: a phone held inverted puts the
        # camera at the bottom, and this application's central gesture is
        # photographing a plant.
        #
        # The iPad-specific list this replaced is gone with iPad itself; see
        # TARGETED_DEVICE_FAMILY below.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required by Google Sign-In's iOS SDK so it can hand the OAuth
        # redirect back to this app. The reversed form of the OAuth client ID
        # Firebase issued for this app — not a secret, matching
        # apps/web/core/auth/firebase-app.ts's identical reasoning about the
        # web apiKey.
        # Source: GoogleService-Info.plist, key REVERSED_CLIENT_ID.
        #
        # A second entry, `verdery`, is this app's OWN deep-link scheme
        # (P9A-IOS-01): the entry point for an invitation-accept link
        # (`verdery://invite?token=`) and an ownership-transfer review link
        # (`verdery://ownership-transfer?gardenId=`), both shared out of band
        # through the system share sheet — see `CollaborationSessionState
        # .handleDeepLink(_:)`. Chosen over Associated Domains/universal
        # links because this App ID carries no `com.apple.developer
        # .associated-domains` capability today (only `IN_APP_PURCHASE` and
        # `APPLE_ID_AUTH` — see `AppEnvironment.emailSignInContinueURL`'s own
        # doc comment, which documents the identical gap for the emailed
        # sign-in link) — a custom scheme needs no entitlement, no hosted
        # `apple-app-site-association` document, and no further Apple
        # Developer configuration, at the honestly-scoped cost that the link
        # only resolves into this app when it is already installed.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.417008876420-ofvf3en5tk3th23cd0flklqa22vncvt4
          - CFBundleURLName: com.verdery.app.collaboration
            CFBundleURLSchemes:
              - verdery
        # Which API this build talks to, as a build-setting reference rather
        # than a literal — see Sources/AppComposition/AppEnvironment.swift.
        # The default below is the local development container, which is right
        # for the Simulator and unreachable from a phone: an archive intended
        # for TestFlight MUST override it, e.g.
        # `xcodebuild ... API_ORIGIN=https://api.example.com`.
        VerderyAPIOrigin: "$(API_ORIGIN)"
        # Which deployed web application an emailed sign-in link points at —
        # see Sources/AppComposition/AppEnvironment.swift. Same build-setting
        # reference shape as VerderyAPIOrigin above, but note the fallback
        # differs: an unset API origin degrades to localhost, which is right
        # for a Simulator; an unset web origin degrades to the DEPLOYED web
        # application, because a link mailed to a reader is opened outside
        # this device and localhost could never work for anyone.
        VerderyWebOrigin: "$(WEB_ORIGIN)"
    entitlements:
      path: Generated/Verdery.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Push. `development` is the local-build default; scripts/
        # archive-and-upload.sh rewrites this one key to `production` in the
        # generated entitlements before it archives, because this is a plist
        # entry and not a build setting — an `xcodebuild` override cannot
        # reach it. Getting it wrong fails silently: the app registers a token
        # APNs simply never delivers to.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verdery.app
        # The repository owner's real Apple Developer team. Not a secret — it
        # appears in every signed binary Apple distributes. `scripts/
        # archive-and-upload.sh` overrides it from the command line when a
        # different team signs the build, so this value is a default, not a
        # pin.
        DEVELOPMENT_TEAM: 3M68DG8S7N
        MARKETING_VERSION: "1.0"
        # Overridden per upload by scripts/archive-and-upload.sh: App
        # Store Connect rejects a build whose (version, build) pair it has
        # already seen, so this literal is only the local-build default.
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.2"
        # iPhone only. The redesign is drawn for one hand outdoors — thumb-
        # reachable actions, a bottom chassis, a camera-first capture loop —
        # and none of that is an iPad layout scaled up. Declaring a device we
        # neither design for nor test on buys an audience an unfinished
        # experience, and costs an iPad screenshot set at submission.
        #
        # An iPhone-only binary still installs on iPad in compatibility mode,
        # which App Review does not treat as a defect.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Which API each configuration talks to. Per configuration, not one
      # shared value: `localhost` is correct for a Simulator build talking to
      # a container on the same machine and is meaningless on a phone, where
      # localhost IS the phone. A Release build had that localhost value baked
      # in through build 153, so every server-backed surface — Today, the
      # journal, and the map — failed on device and the app looked broken.
      #
      # The Release origin is the deployed development API
      # (`verdery-api-dev` on Cloud Run, public ingress, verified answering
      # `GET /v1/health/ready` with `{"status":"ready"}`). It is not a secret:
      # the same host appears in tests/load/run.sh and
      # docs/development/infrastructure.md.
      #
      # `scripts/archive-and-upload.sh` can override it per archive via
      # VERDERY_API_ORIGIN once a production origin exists.
      configs:
        Debug:
          API_ORIGIN: "http://localhost:8080"
          # NOT localhost, in either configuration: the sign-in link this
          # value builds is delivered by email and opened wherever the reader
          # reads their mail, which is never this machine.
          WEB_ORIGIN: "https://verdery-web-dev-t6amsr5o6a-uc.a.run.app"
        Release:
          API_ORIGIN: "https://verdery-api-dev-t6amsr5o6a-uc.a.run.app"
          WEB_ORIGIN: "https://verdery-web-dev-t6amsr5o6a-uc.a.run.app"
