          type: integer
          minimum: 0
        vertexIndex:
          type: integer
          minimum: 0
        position:
          $ref: '#/components/schemas/Position'
          description: Required for `insert` and `move`; absent for `remove`.

    SplitLineworkCommand:
      type: object
      additionalProperties: false
      required: [type, objectId, expectedRevision, resultObjectIds, atVertexIndex]
      properties:
        type:
          type: string
          enum: [splitLinework]
        objectId:
          $ref: '#/components/schemas/Uuid'
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        resultObjectIds:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/Uuid'
