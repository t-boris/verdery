        acquisitionDate:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        acquisitionDateType:
          oneOf:
            - $ref: '#/components/schemas/PlantAcquisitionDateType'
            - type: 'null'
        conditionNote:
          type: [string, 'null']
        careGuidanceNote:
          type: [string, 'null']
        quantity:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'

    AttachPlantPhotoRequest:
