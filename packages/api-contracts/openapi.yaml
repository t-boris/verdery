  /gardens/{gardenId}/media:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: listGardenMedia
      tags: [Media]
      summary: List a garden's media records
      description: |
        Lists the garden's ORIGINAL media records — rows a derivative was
        produced FROM, never the derivative rows themselves — most recently
        created first, optionally filtered to one media class. P6-PLAN-01
        added this: the plan-import flow needs to pick from a garden's
        available `imported_plan` documents, and no endpoint could list
        media by garden at all before (`GetMediaStatus` requires already
        knowing the id).

        Derivative (`derived_from_media_id`-bearing) rows are excluded by
        construction rather than reachable through a `derived_preview`
        class filter: a raster plan's tile pyramid alone can run to
        thousands of rows, which would make an unfiltered listing unbounded
        junk for every real caller. A derivative is reached through its
        original's own `derivatives` array (see the `Media` schema), never
        by listing.

        Authorization matches `GetMediaStatus`: any garden role that can
        view the garden (`viewGarden`) — this reads record state, not the
        bytes themselves.

        Source: implementation-plan.md work package P6-PLAN-01;
        architecture/media-storage-and-processing.md, section "12. Download Flow".
      parameters:
        - name: mediaClass
          in: query
          required: false
          description: Restrict to one media class — for example `imported_plan` for the plan-import picker. Omit to list every class (originals only).
          schema:
            $ref: '#/components/schemas/MediaClass'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The garden's media records, most recently created first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaListResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: registerMediaUpload
      tags: [Media]
      summary: Register a media upload and open its upload session
      description: |
        Combines architecture/media-storage-and-processing.md section 7
        ("Upload Flow") steps 2 and 3 in one call: authorizes garden access,
        reserves quota, creates the media record (`registered`), then
        immediately creates a backend-authorized resumable Cloud Storage
        upload session and advances the record to `authorized`. These two
        steps are not split across two endpoints and not left for the client
        to sequence itself — an `authorized` record with no session, or a
        session with no record, is not a usable intermediate state for any
        caller, matching this codebase's "one command, one clear side
        effect" convention applied to the one side effect a caller actually
        needs from registration: an upload it can start.

        The client then uploads directly to `uploadUrl` — never through this
        API (section 2, "Binary media bypasses the interactive API data
        path") — and calls `CompleteMediaUpload` once finished.

        Garden-scoped only this stage: a media row's `gardenId` is nullable
        at the domain layer for a future pre-garden registration case (plan
        import onboarding, P6-PLAN-01), but that endpoint shape does not
        exist yet, so every registration through this contract names its
        garden in the path.

        Source: implementation-plan.md work package P6-API-01;
        architecture/media-storage-and-processing.md, section "7. Upload Flow".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMediaUploadRequest'
      responses:
        '201':
          description: The registered, upload-authorized media record and its upload session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /gardens/{gardenId}/media/{mediaId}:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: mediaId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getMediaStatus
      tags: [Media]
      summary: Read a media record's current status
      description: |
        Any garden role that can view the garden can read a media record's
        status — the section 12 viewer restriction applies to download
        access (`GetMediaAccess`), not to reading state.

        Source: implementation-plan.md work package P6-API-01.
      responses:
        '200':
          description: The media record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/media/{mediaId}/complete:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: mediaId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: completeMediaUpload
      tags: [Media]
      summary: Verify a finished upload and resolve it to available or rejected
      description: |
        Explicit, client-triggered completion verification only — there is
        no event-driven or Pub/Sub-triggered path yet (that is
        P6-ASYNC-01's own scope). Drives the record through
        `uploading` -> `verifying` and then to a terminal outcome: reads
        real object metadata from Cloud Storage and compares it against the
        declared content type and byte size (section 8/20, "Declared versus
        actual type and size mismatch"). A mismatch, or a missing object,
        resolves to `rejected`; an exact match resolves to `available`. Both
        outcomes are a successful `200` response — verification concluding
        with a rejection is not a request failure.

        Full content-hash (SHA-256) verification against the object's real
        bytes is not performed here: that requires downloading and hashing
        the object, which this synchronous interactive endpoint does not do
        (section 2) — it remains P6-WORKER-01's job. When the client
        declared a checksum at registration, that declared value is carried
        through unchanged on success, never independently confirmed at this
        stage.

        Idempotent under a duplicate completion notification: calling this
        again against an already-`available` or already-`rejected` record
        simply returns the record's current state rather than re-verifying
        or erroring.

        Source: implementation-plan.md work package P6-API-01;
        architecture/media-storage-and-processing.md, sections "7. Upload
        Flow", "8. File Validation", "20. Testing".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The resolved media record (`available` or `rejected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /gardens/{gardenId}/media/{mediaId}/access:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: mediaId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getMediaAccess
      tags: [Media]
      summary: Get short-lived authorized download access to a media object
      description: |
        Implements section 12's download flow: authenticates, authorizes
        garden role, and returns a short-lived signed download mechanism —
        never a permanent URL. Only `available` media can be accessed.

        An ORIGINAL additionally requires `processingState: 'processed'`
        (its safety validation concluded clean). A DERIVATIVE row — reached
        via its original's `derivatives` array (P6-PLAN-01) — is servable
        at `available` alone: a derivative row only ever exists because its
        source already validated clean and a worker produced it, and its
        own `processingState` is `null` by design ("not applicable" — a
        derivative is never itself the subject of further processing).

        Enforces section 12's own stricter line for the operational viewer
        role: a viewer may access ordinary accepted photos according to
        garden capability, but not `restricted`-classified media (raw scan
        artifacts) unless explicitly allowed. No "explicitly allowed"
        override mechanism exists anywhere in this codebase's role model yet,
        so this is currently an unconditional denial for viewers against
        `restricted` media, not a configurable one.

        The client-portal-specific rules section 12's last paragraph
        describes (organization/client-engagement/publication entitlement)
        are out of scope: those concepts do not exist anywhere in this
        codebase yet (Phase 9, not started), the same deferral Phase 5
        already applied to the identical gap.

        Source: implementation-plan.md work package P6-API-01;
        architecture/media-storage-and-processing.md, section "12. Download Flow".
      responses:
        '200':
          description: Short-lived signed download access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /gardens/{gardenId}/media/{mediaId}/delete:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: mediaId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: deleteGardenMedia
      tags: [Media]
      summary: Delete a media record and its stored objects
      description: |
        Starts section 16's asynchronous deletion workflow for one ORIGINAL
        media record: revokes new access immediately (a
        `deletion_scheduled` record can no longer be signed by
        `GetMediaAccess`), schedules the record and every derivative row
        produced from it, cancels eligible pending processing jobs, and
        emits the durable event the worker-side deletion job executes the
        actual Cloud Storage object removal through. The record reaches
        `deleted` only after object absence is confirmed — "User-visible
        deletion remains pending until required objects are confirmed
        deleted" (section 16) — so the response's `uploadState` is
        `deletion_scheduled`, not `deleted`.

        `POST`, not HTTP `DELETE`, for exactly `deleteTask`'s own
        documented reason: this is a governed state transition on a row
        that survives (metadata is retained per audit policy until a later
        purge stage), not a hard row delete — using the literal verb would
        misrepresent that.

        Only an ORIGINAL can be named here: a derivative row is deleted
        with its source, never independently (`409`,
        `media.derivative_not_deletable`) — its bytes are rebuildable
        artifacts of the original, and independently deleting one would
        leave the original's `derivatives` array silently self-healing on
        the next regeneration anyway.

        A record still referenced by an attachment row — a plant photo, an
        observation photo, a task attachment, or an imported-background map
        object — is not deletable (`409`, `media.referenced`, with one
        detail entry naming each referencing kind): the referencing record
        must be removed first. This is the same rule the database's own
        RESTRICT-shaped foreign keys and
        `imported_background_details`' migration comment ("deleting a media
        record out from under a background must fail loudly") already
        encode, surfaced as a clean contract error instead of a constraint
        violation.

        Idempotent under replay: a record already `deletion_scheduled` or
        `deleted` returns its current state unchanged, never a second
        workflow.

        Authorization: `editGardenContent` — deleting a photo is editing
        garden content, the same capability that attached it.

        Source: implementation-plan.md work package P6-RET-01;
        architecture/media-storage-and-processing.md, sections
        "15. Retention and Lifecycle", "16. Deletion Workflow".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The media record with deletion scheduled (or its already-terminal state, on replay).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /media/retention-policy:
    get:
      operationId: getMediaRetentionPolicy
      tags: [Media]
      summary: Get the retention policy per media class
      description: |
        The user-visible statement of section 15's retention rules, one
        entry per media class — static policy data, the single source the
        server itself enforces from, so what a client displays and what the
        retention sweep executes can never drift.

        Honesty over completeness: each entry carries an `enforced` flag.
        The raw-capture rule ("30 days after successful extraction",
        architecture/garden-capture-and-scan.md section 17) is DECLARED
        here but reported `enforced: false` — the anchoring event
        (successful extraction) has no producer until Garden Scan lands
        (Phase 10), so no raw-capture deadline is ever set yet, and
        claiming enforcement would be false. The export-package rule
        (7 days from registration, the same figure the exports bucket's own
        live lifecycle rule uses) is both declared and enforced.

        Authenticated but not garden-scoped: policy is product-wide, not
        per-garden.

        Source: implementation-plan.md work package P6-RET-01;
        architecture/media-storage-and-processing.md, section
        "15. Retention and Lifecycle"; architecture/garden-capture-and-scan.md,
        section "17. Privacy and Retention".
      responses:
        '200':
          description: The retention policy for every media class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRetentionPolicyResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /account/deletion:
    post:
      operationId: requestAccountDeletion
      tags: [Account]
      summary: Request deletion of the caller's own account
      description: |
        Starts account deletion for the authenticated caller
        (architecture/data-export-and-deletion.md, section 11). Nothing is
        deleted immediately: the account enters a 30-day recovery window
        during which ordinary access is disabled and only this resource
        remains reachable.

        Requires RECENT authentication: a session whose underlying sign-in is
        older than 30 minutes is rejected with `403` and `error.code`
        `deletion.recent_authentication_required`.

        OWNERSHIP RESOLUTION runs synchronously and is reported in
        `gardens` (section 11, "Resolves owned shared gardens by transfer or
        deletion policy"):

        - A garden the caller owns ALONE enters `deletionRequested` with the
          same recovery deadline as the account, and is purged with it —
          resolution `gardenDeletionRequested`.
        - A garden with another active owner survives; the caller's own
          membership is revoked — resolution `ownershipRetainedByCoOwner`.
        - A garden where the caller is only an editor or viewer survives; the
          membership is revoked — resolution `membershipRevoked`.

        Every revocation surfaces to the caller's other offline clients as an
        ordinary `garden` `delete` change on the next pull.

        Immediate irreversible deletion (section 12) is deliberately not
        offered: the recovery window is unconditional.

        Source: implementation-plan.md work package P8-DELETE-01;
        architecture/data-export-and-deletion.md, section "11. Account Deletion".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The account is now inside its recovery window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      operationId: getAccountDeletion
      tags: [Account]
      summary: Get the caller's own account-deletion state
      description: |
        The caller's pending deletion — state, deadline, and the recorded
        per-garden ownership resolution. Reachable while the account is
        inside its recovery window, which is the whole point: it is how a
        signed-in-but-disabled user sees what will happen and when.

        `404` (`deletion.not_found`) when no deletion is pending.
      responses:
        '200':
          description: The pending account deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: restoreAccount
      tags: [Account]
      summary: Withdraw an account-deletion request within the recovery window
      description: |
        Reverses `requestAccountDeletion` completely: the account returns to
        `active`, every membership revoked by the request is reactivated, and
        every garden the request put into `deletionRequested` returns to
        `active`.

        Requires RECENT authentication, exactly like the request it reverses.

        Once the deletion sweep has claimed the account recovery is
        impossible and the response is `409` with `error.code`
        `deletion.not_recoverable`.

        Source: implementation-plan.md work package P8-DELETE-01;
        architecture/data-export-and-deletion.md, sections "11. Account
        Deletion", "16. Failure and Retry".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The account is active again and no deletion is pending.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /exports:
    post:
      operationId: requestExport
      tags: [Exports]
      summary: Request an asynchronous data export
      description: |
        Records a durable export request and starts asynchronous package
        generation (architecture/data-export-and-deletion.md, sections
        3-6). The response is the request resource in its initial
        `requested` state; the caller polls `getExportRequest` and receives
        an `export_ready` in-app notification when the package completes.

        Scope rules (section 4):

        - `account` — the caller's own personal data (profile, consents,
          notification preferences) plus the full content of every garden
          the caller OWNS. Gardens where the caller is only an editor or
          viewer are named in the package manifest as excluded — per-role
          garden export entitlement beyond ownership is a deferred
          capability. Requires RECENT authentication (section 5): a
          session whose underlying sign-in is older than 30 minutes is
          rejected with `403` and `error.code`
          `export.recent_authentication_required`.
        - `garden` — one garden's full content; requires the `owner` role
          on `gardenId`.

        `includeMedia` selects whether entitled original media files
        (garden photos and imported plans) are packaged; media METADATA
        and checksums are always included. Raw scan artifacts
        (`raw_capture`) are never included — the separate sensitive-media
        permission section 4 names does not exist yet.

        One active export per requester: while a previous request is
        `requested` or `running`, a new one is rejected with `409` and
        `error.code` `export.active_export_exists` — an export is
        expensive, and the durable request row is the rate-limit ledger.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportRequest'
      responses:
        '201':
          description: The export request was recorded and generation scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /exports/{exportRequestId}:
    parameters:
      - name: exportRequestId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getExportRequest
      tags: [Exports]
      summary: Get one export request's state
      description: |
        The caller's own export request — state, boundary, expiry, and
        package facts once completed. Another user's request id, or an
        unknown id, is `404` (`export.not_found`): non-ownership is
        concealed as not-found, the inbox-entry posture.
      responses:
        '200':
          description: The export request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /exports/{exportRequestId}/download:
    parameters:
      - name: exportRequestId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getExportDownload
      tags: [Exports]
      summary: Get a short-lived signed download URL for a completed export
      description: |
        The established signed-access mechanism (`getMediaAccess`'s own
        shape) applied to the export package: a short-lived signed URL,
        never a permanent one, re-requestable until the package expires
        (architecture/data-export-and-deletion.md, section 9: "Repeated
        download requires reauthorization after URL expiration").

        Only the requester can download — the package's media record is
        deliberately NOT reachable through the garden-scoped media routes,
        so garden collaborators can never fetch another member's export.
        Before completion, after the 7-day expiry, or after the package's
        automatic deletion the response is `409` with `error.code`
        `export.not_downloadable`.
      responses:
        '200':
          description: A short-lived signed download URL for the export package.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /sync/clients/{clientInstallationId}:
    parameters:
      - name: clientInstallationId
        in: path
        required: true
        description: Client-generated UUIDv7. Stable for the lifetime of one app installation on one device.
        schema:
          $ref: '#/components/schemas/Uuid'

    put:
      operationId: registerSyncClient
      tags: [Synchronization]
      summary: Register or refresh client installation metadata
      description: |
        Registers a new client installation, or refreshes an already-registered
        one under the same `clientInstallationId` — the "register or refresh"
        step named first in the initial-synchronization sequence. `PUT` at a
        client-known id, not `POST`, because the id is minted by the client
        itself before the first call, not assigned by the server: a second
        call with the same id and current metadata is an ordinary idempotent
        refresh, not an ambiguous re-create.

        `protocolVersion` is the sync protocol version this installation
        currently speaks. A version below the server's supported window is
        rejected with `409` and `error.code`
        `sync.protocol_version.unsupported`, the same code and meaning
        `PushSyncOperations` and `GetSyncChanges` use — registration is the
        earliest point a badly outdated client can learn it must upgrade,
        before it ever attempts a push. The rejection never deletes anything
        client-side; the local outbox is untouched.

        Revocation of a client installation (architecture/offline-synchronization.md,
        section "22. Security": "Device installation identifiers are
        application-scoped and revocable") is a support/administrative
        capability with no endpoint in this contract yet — out of scope for
        this work package.

        Source: architecture/offline-synchronization.md, section
        "12. Initial Synchronization", step 1; section "21. Protocol
        Versioning"; section "22. Security".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncClientRegistrationRequest'
      responses:
        '200':
          description: The refreshed client installation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncClientInstallation'
        '201':
          description: The newly registered client installation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncClientInstallation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            `error.code` `sync.protocol_version.unsupported`: `protocolVersion`
            is outside the server's currently supported window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sync/push:
    post:
      operationId: pushSyncOperations
      tags: [Synchronization]
      summary: Push a bounded batch of client outbox operations
      description: |
        Accepts an ordered batch of client-generated domain commands and
        processes each in dependency-aware order. A batch that is
        structurally valid and correctly authenticated always returns `200`
        with one result per operation — an individual operation conflicting,
        being rejected, or being blocked never fails the whole batch, so
        that independent operations in the same batch can still succeed.
        Only a request-level problem (malformed batch, unsupported protocol
        version, oversized batch) fails before any operation is processed.

        Unlike every other mutation endpoint in this API, this operation
        does **not** take the shared `Idempotency-Key` header. Per
        architecture/offline-synchronization.md, section "9. Server
        Idempotency" ("Operation ID is the idempotency key for
        synchronization commands"), each operation's own client-generated
        `operationId` already is the idempotency key, scoped to that one
        operation rather than the whole batch — a batch retried with a
        different mix of operations (for example, with already-accepted
        operations dropped) is still meaningful, which a single request-level
        key would not allow for.

        Every command payload names its own `expectedRevision` where a
        revision precondition applies, the same convention
        `SubmitMapCommand` already established (not a request-level
        `If-Match`), because some commands target more than one record at
        once and need more than one expected revision.

        `actorProfileId` is never read from any operation payload; the
        server fills it from the authenticated caller for every operation,
        the same rule every other mutation in this API follows. For the same
        reason, an outbox operation's local-only bookkeeping fields — retry
        state and last error category (architecture/offline-synchronization.md,
        section "7. Outbox Operation") — never travel on the wire; they
        describe the client's own retry history, not something the server
        needs to receive.

        Source: architecture/offline-synchronization.md, sections
        "7. Outbox Operation", "8. Push Protocol", "9. Server Idempotency";
        architecture/api-design.md, section "16. Synchronization Endpoints".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: One result per submitted operation, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            `error.code` `sync.protocol_version.unsupported`: `protocolVersion`
            is outside the server's currently supported window. The client's
            local outbox is not implied lost by this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`operations` exceeds the maximum batch size.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /sync/changes:
    get:
      operationId: getSyncChanges
      tags: [Synchronization]
      summary: Pull the server change log since a cursor
      description: |
        Returns changes in deterministic, ordered, bounded, resumable pages.
        `nextCursor` is always present, unlike this API's ordinary list
        endpoints (`ListGardens`, `SearchPlants`), whose `nextCursor` is
        absent once the caller reaches the end: an ordinary list is re-listed
        from the start on the next visit, but a sync cursor is a durable
        position a client resumes from indefinitely, including across an
        empty page, so it always needs a valid position to resume from next
        time, even when caught up.

        Authorization is applied per architecture/offline-synchronization.md,
        section "11. Authorization Changes": a garden the caller has lost
        access to surfaces as an ordinary `record: 'garden'`,
        `operation: 'delete'` change (a tombstone for the whole garden
        partition), not a distinct change shape.

        Source: architecture/offline-synchronization.md, section
        "10. Pull Protocol"; architecture/api-design.md, section
        "16. Synchronization Endpoints".
      parameters:
        - $ref: '#/components/parameters/SyncAfterCursor'
        - $ref: '#/components/parameters/Limit'
        - name: protocolVersion
          in: query
          required: true
          description: The sync protocol version this client currently speaks, checked the same way `PushSyncOperations` checks it.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: A page of changes plus the cursor to resume from.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncChangesResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            One of two stable `error.code` values: `sync.changes.cursor_expired`
            (`after` is older than retained history) or
            `sync.protocol_version.unsupported` (`protocolVersion` is outside
            the server's supported window). Both require a full
            resynchronization per architecture/offline-synchronization.md,
            section "13. Full Resynchronization".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /sync/acknowledge:
    post:
      operationId: acknowledgeSyncOperations
      tags: [Synchronization]
      summary: Re-learn the durable outcome of already-submitted operations
      description: |
        Resolves a genuine gap in architecture/offline-synchronization.md:
        `POST /v1/sync/acknowledge` is named once, in
        architecture/api-design.md section "16. Synchronization Endpoints",
        with no request or response shape and no explanation of what it
        acknowledges, given that push already returns synchronous
        per-operation results (section "8. Push Protocol") and pull's cursor
        advancement is purely client-local with no server round trip
        (section "10. Pull Protocol").

        This endpoint is resolved as a **cheaper alternative to a full push
        retry**, not a second delivery-confirmation mechanism. Support for
        this reading:

        - Section "9. Server Idempotency": "An unknown client response after
          a network failure is resolved by retrying the same operation ID" —
          this already fully recovers a lost push response; `acknowledge`
          cannot be required for correctness on top of that.
        - Section "24. Testing Matrix" lists "Lost response after accepted
          server commit" as a scenario the protocol must handle — exactly
          the case a full idempotent retry already resolves, but only by
          resending the complete canonical payload for every operation whose
          outcome is merely unknown to the client, which is wasteful for a
          large batch after, for example, a process death between receiving
          and durably persisting the push response.
        - Nothing in the document describes any server-side effect an
          "acknowledgement" would itself cause — pull needs none (client-local
          cursor advance), and push already durably persists its outcome the
          moment it decides it (idempotency record, same transaction).

        So: the client submits operation IDs it believes it already pushed,
        with no payload, and receives back each one's stored durable outcome
        — identical in shape to what `PushSyncOperations` would have
        returned — without re-sending the canonical payload. An operation ID
        with no stored outcome (never actually received, or its idempotency
        record has expired) comes back `unknown`; the client's only recourse
        for that one is a real `PushSyncOperations` retry with its full
        payload.

        Performs no new mutation and takes no `Idempotency-Key` — it only
        reports previously decided outcomes.

        Source: architecture/offline-synchronization.md, sections
        "8. Push Protocol", "9. Server Idempotency", "24. Testing Matrix";
        architecture/api-design.md, section "16. Synchronization Endpoints".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncAcknowledgeRequest'
      responses:
        '200':
          description: One result per requested operation ID, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncAcknowledgeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: List the caller's notification inbox
      description: |
        The caller's durable in-app notification inbox, newest first,
        cursor-paginated the same way `ListGardens` paginates. Returns only
        LIVE entries: intents that are still pending, in-app eligible, not
        dismissed, and not past their expiration. Read entries stay listed
        (with `readAt` set) until they expire or are dismissed.

        The inbox is the durable user-facing record for eligible
        notifications and is written when the intent is created, before —
        and independent of — any push delivery attempt, so it remains
        correct even when push delivery fails or never happens.

        Expiration is enforced durably by this read: the caller's own
        pending intents whose expiration has passed are closed (state
        `expired`) in the same transaction that lists the rest — the same
        read-triggers-write posture `GetTodayRecommendations` documents for
        first presentation. Repeating the request is safe: an already
        `expired` intent is simply no longer listed.

        Source: architecture/notifications.md, section "12. In-App Inbox";
        implementation-plan.md work package P7-NOTIF-01.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The caller's live inbox entries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: markNotificationRead
      tags: [Notifications]
      summary: Mark a notification as read
      description: |
        Stamps the caller's own notification with a read time. Naturally
        idempotent and monotonic: the first call sets `readAt`, every later
        call is a no-op returning the same stamped entry — so this
        operation deliberately takes neither `Idempotency-Key` nor
        `If-Match`. A repeated or concurrent call cannot produce a
        different outcome, and a revision precondition would force clients
        to serialize inherently commutative writes (two devices marking
        the same entry read). Legal in any state: reading an entry that
        has since expired or been superseded records the read time without
        resurrecting it.

        Source: architecture/notifications.md, section "12. In-App Inbox"
        ("It supports read state ...").
      responses:
        '200':
          description: The notification with its read time set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/{notificationId}/dismiss:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: dismissNotification
      tags: [Notifications]
      summary: Dismiss a notification from the inbox
      description: |
        Stamps the caller's own notification with a dismissal time,
        removing it from the inbox list without deleting the durable
        record. Same idempotent, monotonic, precondition-free posture as
        `markNotificationRead`, and for the same reasons. Dismissal is an
        inbox-view fact only: it does not transition the intent's delivery
        state.
      responses:
        '200':
          description: The notification with its dismissal time set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [Notifications]
      summary: Get the caller's notification preferences
      description: |
        The caller's whole notification-preference document: quiet hours
        (or `null` when none are set) and the explicit per-type entries.
        A type/garden combination with no entry uses the documented
        default — every channel enabled. `revision` is `0` for a caller
        who has never written preferences; feed it to the update's
        `If-Match` either way.

        Source: architecture/notifications.md, section "7. Preferences".
      responses:
        '200':
          description: The caller's current preference document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      operationId: updateNotificationPreferences
      tags: [Notifications]
      summary: Replace the caller's notification preferences
      description: |
        Replaces the caller's whole preference document — quiet hours and
        every explicit entry — in one transaction. `If-Match` carries the
        document revision from the last read; a document never written
        before has revision `0`, so a first write sends `"0"` (this is the
        one revision-guarded resource whose expected revision may be zero).

        Quiet hours defer PUSH delivery until the window ends, evaluated
        in the named IANA time zone (or the profile's own time zone when
        `timeZone` is `null`); they never delay the in-app inbox entry.
        An entry naming a garden requires current membership on that
        garden and is rejected as not-found otherwise, without revealing
        whether the garden exists. Unknown `notificationType` values are
        rejected: the accepted vocabulary is server-owned and grows with
        the product.

        Source: architecture/notifications.md, sections "7. Preferences",
        "9. Scheduling".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
      responses:
        '200':
          description: The stored preference document with its new revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /notification-devices/{deviceInstallationId}:
    parameters:
      - name: deviceInstallationId
        in: path
        required: true
        description: Client-generated UUIDv7, stable for the lifetime of one app installation on one device — the same convention `registerSyncClient` documents for its own installation id.
        schema:
          $ref: '#/components/schemas/Uuid'

    put:
      operationId: registerNotificationDevice
      tags: [Notifications]
      summary: Register or refresh this installation's push channel
      description: |
        Registers this app installation's FCM registration token for the
        caller, or refreshes an already-registered one under the same
        `deviceInstallationId` — the client calls this after obtaining or
        rotating a token. `PUT` at a client-known id because the id is
        minted by the client before the first call (the `registerSyncClient`
        posture).

        Idempotent BY DESIGN, so this operation deliberately takes no
        `Idempotency-Key`: registration is a last-writer-wins replacement
        of a single-owner record — a retry or concurrent duplicate
        converges on identical stored state and an identical `200`
        response, with no created-versus-refreshed distinction to
        preserve. A registration always reactivates a previously disabled
        record: a fresh token proves the channel works again.

        A token belongs to exactly one installation at the provider, so
        registering a token held by another record (an account switch on
        the same physical device) displaces that record in the same
        transaction.

        The token is a secret: it is stored server-side for delivery only
        and never appears in any response, log, or analytics stream —
        `NotificationDevice` deliberately omits it. The stored record is
        scoped to the environment of the API that accepted it; the server
        stamps that itself.

        Source: architecture/notifications.md, section "6. Device Tokens";
        implementation-plan.md work package P7-NOTIF-02.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterNotificationDeviceRequest'
      responses:
        '200':
          description: The registered or refreshed device record (token omitted — it is a secret).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDevice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      operationId: removeNotificationDevice
      tags: [Notifications]
      summary: Remove this installation's push channel
      description: |
        Deletes the caller's own device record for this installation —
        called on sign-out or when the user disables push for this device
        at the OS level. Idempotent by design and precondition-free:
        removing an absent record is the same end state as removing a
        present one, so the response is `204` either way and no
        `Idempotency-Key` is taken. Removal is per-installation; other
        devices and all notification preferences are untouched.

        Source: architecture/notifications.md, section "6. Device Tokens"
        ("revocable device-channel records").
      responses:
        '204':
          description: The device record is gone (whether or not it existed).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /service-organizations:
    post:
      operationId: createServiceOrganization
      tags: [Organizations]
      summary: Create a service organization
      description: |
        ANY authenticated profile may call this — an organization does not
        exist yet for anyone to hold a role on, so no capability could
        possibly gate its own creation, the same reasoning
        `createGarden` already applies to a brand-new garden. Creates the
        organization AND grants its caller `organizationAdmin` membership in
        one transaction (ADR-0012: "a solo professional may start with an
        organization containing one administrator").

        Source: implementation-plan.md work package P9B-API-01;
        architecture/decisions/ADR-0012-separate-team-and-client-sharing.md,
        section "Service Organizations".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceOrganizationRequest'
      responses:
        '201':
          description: The created organization, with the caller's own `organizationAdmin` role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      operationId: listServiceOrganizations
      tags: [Organizations]
      summary: List the caller's own service organizations
      description: |
        Every organization the caller has ACTIVE membership on, most
        recently created first — the organization-scoped mirror of
        `listGardens`.

        Source: implementation-plan.md work package P9B-API-01.
      responses:
        '200':
          description: The caller's service organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrganizationListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /service-organizations/{organizationId}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getServiceOrganization
      tags: [Organizations]
      summary: Get one service organization
      description: |
        Any ACTIVE member may read this — `organizationAdmin` and
        `professional` alike; there is no capability gate on a plain read of
        the organization's own identity. Existence is concealed as `404` to
        a non-member, the same posture `getGarden` already applies.

        Source: implementation-plan.md work package P9B-API-01.
      responses:
        '200':
          description: The organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrganization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /service-organizations/{organizationId}/members:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: listOrganizationMembers
      tags: [Organizations]
      summary: List an organization's active membership roster
      description: |
        Any ACTIVE member may read this — `organizationAdmin` and
        `professional` alike, the same "any role may see who else can see
        their own resource" reasoning `listGardenMembers` already applies.

        Source: implementation-plan.md work package P9B-API-01.
      responses:
        '200':
          description: The organization's active members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: addOrganizationMember
      tags: [Organizations]
      summary: Add an existing profile as an organization member
      description: |
        `organizationAdmin`-only (`manageOrganizationMembership`). Adds an
        EXISTING profile by id directly — no invitation-with-token flow
        exists for organization membership, deliberately: unlike a garden
        invitation (which must reach someone with no prior relationship to
        the garden, often by unauthenticated email link) or a client
        invitation (P9C-INVITE-01, which must bind and verify an external
        client's email), an organization admin already has an ordinary,
        authenticated relationship with the professional they are adding —
        the same "do not build an invitation system this package does not
        actually need" judgment call implementation-plan.md work package
        P9B-API-01 itself calls for. Fails with `409` if the named profile
        already has ANY membership record (active or removed) on this
        organization — `collaboration.organization_membership`'s own
        one-row-per-pair-forever constraint means a removed member cannot
        currently be re-added.

        Source: implementation-plan.md work package P9B-API-01;
        architecture/collaboration-and-client-sharing.md, section
        "7. Service Organizations and Assignments".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrganizationMemberRequest'
      responses:
        '201':
          description: The new membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /service-organizations/{organizationId}/members/{profileId}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: profileId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    patch:
      operationId: changeOrganizationMemberRole
      tags: [Organizations]
      summary: Change a member's role between organizationAdmin and professional
      description: |
        `organizationAdmin`-only (`manageOrganizationMembership`). Refused
        with `422` when the change would leave the organization with no
        active `organizationAdmin` — the last-admin invariant this package
        protects the same way `changeGardenMemberRole`'s sibling
        `demoteGardenOwner` protects the garden's own last-owner invariant, a
        locking read (`FOR UPDATE`) over every other active admin
        immediately before the write, exactly as the P9B-DATA-01 migration's
        own header prescribes.

        Source: implementation-plan.md work package P9B-API-01;
        migrations/1786600000000_service-organizations-and-client-engagements.sql.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrganizationMemberRoleRequest'
      responses:
        '200':
          description: The member's updated (or already current) role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: removeOrganizationMember
      tags: [Organizations]
      summary: Remove a member, or leave an organization
      description: |
        A caller may always remove THEMSELVES — leaving an organization is
        not organization administration, the same posture
        `removeGardenMember` already takes for leaving a garden. Removing
        anyone else requires `manageOrganizationMembership`. Either way,
        removing the organization's last active `organizationAdmin` is
        refused with `422`, including a sole admin attempting to leave their
        own organization.

        Source: implementation-plan.md work package P9B-API-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The removed membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /service-organizations/{organizationId}/garden-assignments:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: createGardenAssignment
      tags: [Organizations]
      summary: Assign an organization member to a garden
      description: |
        `organizationAdmin`-only (`manageGardenAssignment`) — the ONE place
        organization boundaries and garden boundaries meet. Checks BOTH that
        the caller holds `manageGardenAssignment` on `organizationId` AND
        that `profileId` is genuinely an ACTIVE member of THAT SAME
        organization (`422` `organization.assignment.assignee_not_member`
        otherwise) — an organization can never assign a stranger to
        anything.

        Free-standing, NOT scoped by an active client engagement: this
        endpoint does not require a `client_engagement` naming this
        organization and garden to already exist. Section 3's own domain
        diagram draws `garden_assignment` as a direct edge from
        `organization_membership` to `garden`, with no `client_engagement`
        on that path at all, and `garden_assignment` carries no foreign key
        or other reference to `client_engagement` in the schema — the two
        are genuinely independent records. An organization administrator may
        therefore assign any of their organization's members to any garden
        id that exists, unconditionally; nothing here asks the garden's
        owner to have approved it first. `404` if no garden exists at
        `gardenId`. Fails with `409` if the named profile already holds an
        ACTIVE assignment on this garden (`garden_assignment_active_key`'s
        own invariant — the schema's enforcement of "organization membership
        alone grants no garden access, an active assignment is what does,"
        at most one at a time).

        Source: implementation-plan.md work package P9B-API-01;
        architecture/collaboration-and-client-sharing.md, sections
        "3. Domain Relationships", "7. Service Organizations and Assignments".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGardenAssignmentRequest'
      responses:
        '201':
          description: The created assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      operationId: listOrganizationGardenAssignments
      tags: [Organizations]
      summary: List an organization's active garden assignments
      description: |
        Any ACTIVE member may read this — "which gardens can this
        organization's members reach," the mirror question
        `listGardenAssignments` (tag `Collaboration`) answers from the
        garden's own side.

        Source: implementation-plan.md work package P9B-API-01.
      responses:
        '200':
          description: The organization's active assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenAssignmentListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /service-organizations/{organizationId}/garden-assignments/{assignmentId}/end:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: assignmentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: endGardenAssignment
      tags: [Organizations]
      summary: End a garden assignment
      description: |
        `organizationAdmin`-only (`manageGardenAssignment`). Idempotent:
        ending an assignment already `ended` returns it unchanged; ending one
        that is `revoked` (a different terminal state) is refused with
        `422`.

        Source: implementation-plan.md work package P9B-API-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The ended assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /service-organizations/{organizationId}/garden-assignments/{assignmentId}/revoke:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: assignmentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: revokeGardenAssignment
      tags: [Organizations]
      summary: Revoke a garden assignment
      description: |
        `organizationAdmin`-only (`manageGardenAssignment`). Idempotent:
        revoking an assignment already `revoked` returns it unchanged;
        revoking one that is `ended` (a different terminal state) is refused
        with `422`.

        Source: implementation-plan.md work package P9B-API-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The revoked assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /service-organizations/{organizationId}/client-engagements:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: listOrganizationClientEngagements
      tags: [Organizations]
      summary: List an organization's client engagements
      description: |
        Any ACTIVE member may read this. Returns every engagement in any
        state, newest first.

        Source: implementation-plan.md work package P9B-API-01.
      responses:
        '200':
          description: The organization's client engagements, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientEngagementListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /client-engagements:
    post:
      operationId: createClientEngagement
      tags: [Organizations]
      summary: Create a client engagement for a garden
      description: |
        Draft state only — `activateClientEngagement` is the separate step
        that makes it live. Authorization is dual, decided by whether
        `serviceOrganizationId` is supplied:

        - Supplied: the caller must hold `manageEngagement` on THAT
          organization. The named garden need only EXIST (`404` otherwise);
          nothing requires its owner to have done anything first, the same
          free-standing posture `createGardenAssignment` already takes for
          the identical reason (section 3's domain diagram; no schema
          reference links `client_engagement` to any prerequisite).
        - Omitted: the caller must hold `manageGarden` on the garden itself
          — a garden owner running the service relationship directly, no
          service organization attached (ADR-0012 section 4.4: "For an
          engagement with no service organization, a garden owner grants
          [publisher access]"; creating the engagement itself follows the
          same owner-only posture).

        `stewardshipPolicy` defaults to `residential` (the only value the
        database currently admits) and `clientNotificationsEnabled` defaults
        to `true` when omitted.

        Source: implementation-plan.md work package P9B-API-01;
        architecture/collaboration-and-client-sharing.md, section
        "8. Client Engagement";
        architecture/decisions/ADR-0012-separate-team-and-client-sharing.md,
        section "Client Engagement".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientEngagementRequest'
      responses:
        '201':
