        candidate:
          $ref: '#/components/schemas/PlantCandidate'
        conversion:
          $ref: '#/components/schemas/CandidateConversion'

    SuitabilityAxis:
      type: string
      enum:
        - hardiness
        - sun_exposure
        - soil_ph
        - drainage
        - mature_space
        - growing_context
        - structural_conflict
        - regulatory_status
        - user_preference
      description: |
        Three axes (hardiness, mature_space, user_preference) have no rule
        producing findings yet, each for a recorded reason — see
        plants-inventory/domain/suitability-rules/suitability-rule-catalog-instance.ts.

    SuitabilityEvidence:
      type: object
      additionalProperties: false
      required: [factKey, value, sourceCitation]
      properties:
        factKey:
          type: string
        value: {}
        sourceCitation:
          type: [string, 'null']

    SuitabilityFinding:
      type: object
      additionalProperties: false
      required: [category, axis]
      description: |
        A discriminated union over `category`, encoded as one open object
        so client code branches on `category` before reading the fields
        that apply to it — `explanation`/`evidence` for match/caution/
        blocker, `reason` for unknown, `explanation`/`assumedValue` for
        assumption. "Missing context never becomes a positive match": a
        `category: unknown` finding never carries `explanation`/`evidence`.
      properties:
        category:
          type: string
          enum: [match, caution, blocker, unknown, assumption]
        axis:
          $ref: '#/components/schemas/SuitabilityAxis'
        explanation:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/SuitabilityEvidence'
        reason:
          type: string
          enum: [garden_context_missing, plant_fact_missing, placement_missing]
        assumedValue: {}

    SuitabilityAssessment:
      type: object
      additionalProperties: false
      required: [candidateId, findings]
      properties:
        candidateId:
          $ref: '#/components/schemas/Uuid'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/SuitabilityFinding'

    ResolvedFact:
      type: object
      additionalProperties: false
      required: [factKey, value, unit, geographicScope, providerKey, confidence, sourceCitation]
      properties:
        factKey:
          type: string
        value: {}
        unit:
          type: [string, 'null']
        geographicScope:
          type: [string, 'null']
        providerKey:
          type: string
        confidence:
          oneOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: 'null'
        sourceCitation:
          type: [string, 'null']

    PlantProfileVersion:
      type: object
      additionalProperties: false
      required: [id, taxonomyReferenceId, resolvedFacts, isPartial, createdAt]
      description: |
        The materialized, source-priority-resolved profile
        (plants-inventory/domain/plant-profile-version.ts). Only
        `horticulturally_reviewed` facts ever appear in `resolvedFacts`.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        taxonomyReferenceId:
          $ref: '#/components/schemas/Uuid'
        resolvedFacts:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedFact'
        isPartial:
          type: boolean
          description: True when at least one fact key seen among candidate assertions never resolved (missing, or only unreviewed).
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    ObservationActorType:
      type: string
      enum: [user, system]

    ObservationCorrectionKind:
      type: string
      enum: [amendment, supersede]

    ObservationPhotoPurpose:
      type: string
      enum:
        - whole_plant
        - leaf_front
        - leaf_back
        - stem_or_bark
        - flower
        - fruit
        - symptom_close_up
        - context_or_free_form
      description: |
        Visual Plant Journal purpose label (P11-MEDIA-01).
        Source: architecture/plant-intelligence-and-visual-journal.md §8.2.

    ObservationMeasurementKind:
      type: string
      enum: [height, width, count]

    ObservedSunExposure:
      type: string
      enum: [full_sun, partial_sun, partial_shade, full_shade]
      description: Reuses `GardenContextFact`'s `sun_exposure` vocabulary verbatim.

    ObservedDrainage:
      type: string
      enum: [well_drained, poor_drainage, waterlogged]
      description: Reuses `GardenContextFact`'s `drainage` vocabulary verbatim.

    ObservedGrowingContext:
      type: string
      enum: [open_ground, container, greenhouse]
      description: Reuses `GardenContextFact`'s `growing_context` vocabulary verbatim.

    ImageAnalysisKind:
      type: string
      enum: [stress, disease, pest, other]

    ImageAnalysisResult:
      type: object
      additionalProperties: false
      required:
        [
          id,
          analysisKind,
          suggestedLabel,
          confidenceScore,
          requiresConfirmation,
          requestedAdditionalEvidence,
          createdAt,
        ]
      description: |
        A stubbed, honest placeholder: `requiresConfirmation` is always
        `true` — an automated diagnosis is never presented as a confirmed
        fact without explicit user confirmation.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        analysisKind:
          $ref: '#/components/schemas/ImageAnalysisKind'
        suggestedLabel:
          type: string
        confidenceScore:
          type: number
          minimum: 0
          maximum: 1
        requiresConfirmation:
          type: boolean
        requestedAdditionalEvidence:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    ObservationPhoto:
      type: object
      additionalProperties: false
      required: [id, mediaId, purpose, createdAt, analysisResults]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        mediaId:
          $ref: '#/components/schemas/Uuid'
        purpose:
          oneOf:
            - $ref: '#/components/schemas/ObservationPhotoPurpose'
