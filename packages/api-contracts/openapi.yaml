openapi: 3.1.0

info:
  title: Verdery API
  version: 1.0.0
  summary: Garden mapping, care records, and recommendations
  description: |
    The external contract shared by the native Apple and web applications.

    This document is the machine-readable source of truth for paths, schemas,
    error envelopes, pagination, idempotency, and concurrency headers. Generated
    clients are wrapped by handwritten application gateways and are never edited
    by hand.

    Conventions:

    - Paths use plural lowercase nouns; JSON fields use `camelCase`.
    - Identifiers are opaque UUIDv7 strings.
    - Timestamps are RFC 3339 in UTC.
    - Measurements are SI with explicit unit metadata where ambiguity exists.
    - Geometry always travels inside an envelope naming its coordinate space,
      because GeoJSON alone cannot say whether coordinates are local metres or
      longitude and latitude.

    Source: architecture/api-design.md.
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary

servers:
  - url: /v1
    description: Version 1

tags:
  - name: Operations
    description: Service health and readiness, used by infrastructure rather than by end users.
  - name: Gardens
    description: Garden lifecycle — list, create, view, rename, archive, and request deletion.
  - name: Authentication
    description: Web session exchange for the browser client. Native clients use a Firebase ID token directly and never call these.
  - name: Map
    description: The canonical 2D garden map — objects, their categories and geometry, and the single revision-aware command endpoint that mutates them.
  - name: GardenContext
    description: Reviewed or declared facts about a garden's physical growing environment — sun exposure, soil type, drainage, irrigation method, growing context (open ground / container / greenhouse), and microclimate — each with its own source and quality (FR-22).
  - name: Plants
    description: Plant inventory within a garden — placement on the map, photos, taxonomy identification, lifecycle stage, and status.
  - name: PlantCandidates
    description: Plants being CONSIDERED for a garden — excluded from inventory counts, current-care tasks, and "what grows here" claims by construction. Covers candidate CRUD, explicit revision-aware conversion into an actual plant, and garden-specific suitability assessment (matches, cautions, blockers, unknowns, assumptions — never a positive match from missing context).
  - name: PlantCatalog
    description: Shared, source-attributed plant knowledge — not garden-owned data. Today covers a taxon's materialized knowledge profile (resolved, cited facts); catalog search and filtering land with P11-SEARCH-01.
  - name: Observations
    description: The append-only garden and plant observation history, including per-photo image-analysis results and immutable corrections.
  - name: Tasks
    description: Garden care tasks — manual creation, scheduling, completion, and file attachments.
  - name: Recommendations
    description: The Today view's prioritized, explainable recommendation set and its controls — completion, postponement, dismissal, relevance feedback, and conversion into a task. Candidates are generated exclusively by the server-side rule engine; these operations read and act on them, never create them.
  - name: SeasonalPlan
    description: A garden-wide, forward-looking read of every reviewed seasonal timing fact for the garden's own plants (every configured window, not only whichever one happens to be open right now) plus the continuous bed-rotation status per placed plant with a known family — distinct from the rule-fired Today/Recommendations set above, which only ever surfaces a candidate within its own narrow eligibility window.
  - name: Media
    description: Garden-scoped media upload registration, backend-authorized resumable upload sessions, client-triggered completion verification, status, and short-lived authorized download access.
  - name: Synchronization
    description: The native offline outbox protocol — client installation registration, bounded batched push of client commands, resumable pull of the server change log, and cheap re-acknowledgement of already-submitted operations.
  - name: Notifications
    description: The per-user in-app notification inbox — the durable user-facing record of eligible notifications, with read state, dismissal, expiration, and stable deep links — plus the caller's own notification preferences (per-type and per-channel toggles with optional per-garden overrides, quiet hours, and time zone). Intents are created exclusively by the server-side notification policy from domain events; these operations read and annotate them, never create them.
  - name: Account
    description: The caller's own account lifecycle — requesting deletion of the account and everything it solely owns, inspecting the resulting 30-day recovery window and its per-garden resolution, and withdrawing the request before the deadline. These are the only operations reachable while an account is inside its recovery window; every other endpoint refuses a non-active account.
  - name: Exports
    description: Portable data export — request an asynchronous account-wide or garden-scoped export package (ZIP with JSON, GeoJSON, CSV, entitled media, checksums, and a README), poll its state, and obtain a short-lived signed download URL while the package is within its 7-day expiry window. Generation is asynchronous and checkpointed; completion is announced through the in-app notification inbox.
  - name: Collaboration
    description: Operational garden membership and invitations — issue and revoke editor/viewer invitations, accept one as the invited profile, list a garden's member roster, and change or remove a non-owner member's role. Owner promotion, demotion, and ownership transfer (P9A-OWNER-01) are the same tag's recent-auth-gated operations for the owner set itself — promote an active member to co-owner, demote a co-owner back to editor/viewer while at least one other owner remains, and REQUEST transfer of ownership outright to another active member. A requested transfer stays pending until its named recipient accepts or declines it, or its initiator cancels it — ownership only actually moves on acceptance. This tag also carries the two garden-scoped READS onto the professional-service domain (`GET /gardens/{gardenId}/assignments`, `GET /gardens/{gardenId}/engagements`) — they are garden-scoped resources, authorized the same way every other garden read in this tag is, even though the rows they read belong to the `Organizations` tag's own domain.
  - name: Organizations
    description: |
      The professional-service domain (P9B-API-01) — lightweight service
      organizations, their membership, the explicit garden assignment that is
      the ONLY mechanism through which organization membership becomes garden
      access, and client engagement lifecycle. Distinct from `Collaboration`
      deliberately: these resources are organization- and engagement-scoped,
      not garden-scoped, and the single most important invariant this tag's
      own endpoints protect is ADR-0012's own sentence — "Organization
      membership alone grants no garden access. A professional must also have
      an active garden assignment or operational garden membership." No
      endpoint under this tag ever resolves garden access from
      `organization_membership` alone.

      Source: architecture/decisions/ADR-0012-separate-team-and-client-sharing.md;
      architecture/collaboration-and-client-sharing.md, sections
      "7. Service Organizations and Assignments", "8. Client Engagement".
  - name: Publications
    description: |
      The client-publication domain (P9C-PUBLISH-01) — the separate publisher
      capability, and the `internal_draft -> ready_for_client -> published ->
      withdrawn` `client_update` workflow. Distinct from `Organizations`
      deliberately: publisher access is its own capability, explicitly
      granted per engagement, never implied by `manageEngagement`,
      `manageGarden`, or organization/garden role alone (ADR-0012,
      "Publication Boundary": "Owner, editor, or professional status alone
      does not grant publication access"). Task completion never publishes
      automatically — every operation under this tag is a distinct,
      publisher-initiated step.

      Source: architecture/decisions/ADR-0012-separate-team-and-client-sharing.md,
      section "Publication Boundary";
      architecture/collaboration-and-client-sharing.md, sections
      "4.4 Publisher", "10. Publication Workflow", "11. Publication Contents".
  - name: ClientAccess
    description: |
      Email-bound, expiring client invitations and the resulting client
      access grant (P9C-INVITE-01) — architecture/collaboration-and-client-
      sharing.md section 9's six-step flow, end to end. Distinct from
      `Organizations`/`Publications` deliberately: creating and revoking a
      client invitation is gated by the SAME dual capability that
      administers the engagement record (`manageEngagement`/`manageGarden`,
      unlike publisher access, which ADR-0012 names as a genuinely separate
      capability), while accepting one is the CLIENT's own action, gated by
      nothing but the token itself plus a matching verified email — no
      organization or garden authorization applies to that one operation, the
      same posture the `Collaboration` tag's own `acceptInvitation` already
      takes for the operational case. No anonymous public links: every
      invitation is bound to a specific email address, checked against a real
      verified Firebase claim at acceptance.

      Source: implementation-plan.md work package P9C-INVITE-01;
      architecture/collaboration-and-client-sharing.md, section
      "9. Client Invitation and Session".
  - name: ClientPortal
    description: |
      The publication-only client portal read surface (P9C-API-01) — the
      third access plane collaboration-and-client-sharing.md section 2
      names (operational garden / professional workspace / client
      publication), deliberately separate from `Collaboration`/
      `Organizations`/`Publications`/`ClientAccess`: every operation under
      this tag is reachable ONLY through the caller's own CURRENT client
      profile and ACTIVE `client_access_grant`, never through an
      operational garden, organization, or engagement id supplied as
      ambient authority (section 13's own sentence: "Operational
      identifiers are not accepted as authority by client routes. A
      client-facing garden handle may map internally to an engagement and
      garden, but authorization always starts from the current client
      profile and active access grant").

      `clientGardenId` is, concretely, the same value as the underlying
      `client_engagement.id` — but every operation below re-resolves and
      re-authorizes it fresh, from the caller's own active grant, on every
      call; it is never trusted as a bare lookup key the way an
      operational `engagementId` path parameter is in `Organizations`/
      `Publications`. A request naming a `clientGardenId`/`publicationId`
      the caller holds no active grant for receives the IDENTICAL
      concealed `404` a genuinely nonexistent id would — this tag has no
      operation that distinguishes "wrong" from "nonexistent", the
      completion evidence P9C-API-01 names in its own work-package row:
      "Client cannot enumerate operational records or other engagements."

      Read-only in this initial release (section 14: "deliberately
      read-only in the initial release"). `getClientExportManifest`
      (P9C-EXPORT-01) is the one exception to "publication-only": it also
      discloses the accepted garden model (current map objects and plants),
      because section 18 makes that, alongside published deliverables,
      client-exportable by the default residential stewardship policy. It is
      still a plain synchronous read — no request/poll/download job, unlike
      the operational `Exports` tag — because a client export never carries
      operational history or unentitled media, only the same bounded content
      every other operation under this tag already reads.

      Source: implementation-plan.md work packages P9C-API-01, P9C-EXPORT-01;
      architecture/collaboration-and-client-sharing.md, sections
      "2. Core Boundary", "12. Garden Timeline and Time Machine",
      "13. API Surfaces", "18. Data Stewardship, Export, and Engagement End".

paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Operations]
      summary: Liveness probe
      description: |
        Reports whether the process is running. Never checks dependencies, so a
        degraded database does not cause the platform to restart a healthy
        process.
      security: []
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResult'
        '500':
          $ref: '#/components/responses/InternalError'

  /health/ready:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Readiness probe
      description: |
        Reports whether the service can serve traffic, including its required
        dependencies. Returns `503` when a required dependency is unavailable so
        that the platform stops routing requests to this instance.
      security: []
      responses:
        '200':
          description: The service is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResult'
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResult'

  /auth/session:
    post:
      operationId: createSession
      tags: [Authentication]
      summary: Exchange a Firebase ID token for a web session
      description: |
        The browser signs in with a Firebase provider client-side, then
        submits the resulting ID token here. The server verifies it and
        responds with a `Secure`, `HttpOnly` session cookie plus a
        readable CSRF cookie; the ID token itself never becomes a
        persistent browser credential.

        Source: architecture/identity-and-authorization.md, section
        "5. Web Session Flow".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLoginRequest'
      responses:
        '204':
          description: Session established. Cookies are set on the response.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      operationId: endSession
      tags: [Authentication]
      summary: Log out
      description: |
        Clears the session and CSRF cookies and revokes the underlying
        Firebase refresh tokens. Idempotent: succeeds even when no valid
        session cookie is present, so a client can always clear a broken
        session state.

        Source: architecture/identity-and-authorization.md, section
        "5. Web Session Flow", step 6.
      security: []
      responses:
        '204':
          description: Session cleared.
        '403':
          $ref: '#/components/responses/Forbidden'

  /gardens:
    get:
      operationId: listGardens
      tags: [Gardens]
      summary: List the caller's gardens
      description: |
        Returns every garden the authenticated profile has active membership
        in, regardless of lifecycle state. Most recently created first, or —
        when `nameQuery` is given — ranked by trigram similarity against
        `name` instead, most-similar first.

        Source: implementation-plan.md work packages P2-API-01, P4-SEARCH-01.
      parameters:
        - name: nameQuery
          in: query
          required: false
          description: Trigram-fuzzy match against the garden's name. Omit to list every garden the caller can see, most recently created first.
          schema:
            type: string
            maxLength: 120
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The caller's gardens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenListResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createGarden
      tags: [Gardens]
      summary: Create a garden
      description: |
        Creates a garden and grants the caller the owner role on it in the
        same transaction. Every garden has exactly one owner at creation.

        Source: implementation-plan.md work package P2-API-01;
        architecture/identity-and-authorization.md, section "8. Garden Roles".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGardenRequest'
      responses:
        '201':
          description: The created garden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /gardens/{gardenId}:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getGarden
      tags: [Gardens]
      summary: Get a garden
      description: |
        Returns a garden the caller has active membership in. Existence is
        concealed as `404` for a profile with no membership on this garden.

        Source: implementation-plan.md work packages P2-API-01, P2-SEC-01.
      responses:
        '200':
          description: The requested garden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: renameGarden
      tags: [Gardens]
      summary: Rename a garden
      description: |
        Renaming is an owner-only garden setting, distinct from editing garden
        content. Existence is concealed as `404` for a non-member; an editor
        or viewer member instead receives `403`, since they already know the
        garden exists.

        Source: implementation-plan.md work packages P2-API-01, P2-SEC-01;
        architecture/identity-and-authorization.md, section "8. Garden Roles".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameGardenRequest'
      responses:
        '200':
          description: The renamed garden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /gardens/{gardenId}/archive:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: archiveGarden
      tags: [Gardens]
      summary: Archive a garden
      description: |
        Owner-only lifecycle command. Archiving an already-archived garden
        under a new idempotency key is a domain conflict, not a silent no-op.

        Source: implementation-plan.md work packages P2-API-01, P2-SEC-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The archived garden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /gardens/{gardenId}/delete-request:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: requestGardenDeletion
      tags: [Gardens]
      summary: Request garden deletion
      description: |
        Owner-only lifecycle command. Starts the deletion workflow; it does
        not delete the garden immediately (architecture/data-export-and-
        deletion.md, section 10).

        Requires RECENT authentication (section 10.1): a session whose
        underlying sign-in is older than 30 minutes is rejected with `403`
        and `error.code` `deletion.recent_authentication_required`.

        On acceptance the garden stops accepting edits, every NON-owner
        membership is revoked (each revoked member's next `getSyncChanges`
        pull carries the garden as an ordinary `delete` tombstone so their
        offline clients purge local copies), and `recoveryDeadlineAt` is
        stamped 30 days out. `restoreGarden` fully reverses all of that until
        the deadline passes; afterwards the deletion sweep purges the garden
        irreversibly.

        Source: implementation-plan.md work packages P2-API-01, P2-SEC-01,
        P8-DELETE-01; architecture/data-and-geospatial-design.md, section
        "15. Deletion"; architecture/data-export-and-deletion.md, section
        "10. Garden Deletion".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The garden, now in the deletionRequested lifecycle state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

    delete:
      operationId: restoreGarden
      tags: [Gardens]
      summary: Withdraw a garden deletion request within the recovery window
      description: |
        Owner-only. Reverses `requestGardenDeletion` completely while the
        garden is still inside its recovery window: the lifecycle state
        returns to `active`, `recoveryDeadlineAt` is cleared, and every
        membership revoked by the deletion request is reactivated (each
        restored member's next pull carries the garden as an ordinary
        `upsert`, so their client repopulates).

        Requires RECENT authentication, exactly like the request it reverses.

        Recovery ends when the deletion sweep claims the garden. That claim
        revokes every remaining membership in the same transaction — the
        offline-client revocation of section 10.6 — so a later attempt is
        `404` (`garden.not_found`), the same concealment every garden route
        applies to a caller with no membership. A restore that RACES the
        claim (authorized before it, applied after) instead gets `409` with
        `error.code` `deletion.not_recoverable`. Either way "a deletion
        request cannot return to active accidentally after purge begins"
        (architecture/data-export-and-deletion.md, section 16) holds.

        Source: implementation-plan.md work package P8-DELETE-01;
        architecture/data-export-and-deletion.md, sections "10. Garden
        Deletion", "16. Failure and Retry".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The garden, restored to the active lifecycle state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /gardens/{gardenId}/invitations:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: createInvitation
      tags: [Collaboration]
      summary: Invite a person to a garden
      description: |
        Owner-only. Issues an opaque, single-use, expiring invitation for
        `editor` or `viewer` — never `owner`; a token can never grant
        ownership by construction. At most one PENDING invitation may exist
        per (garden, intended email); issuing a second while the first is
        still pending is rejected with `409`. An invitation with no intended
        email is shareable with anyone who receives the link.

        The raw token is returned exactly once, in this response, and is
        never recoverable afterward — the server stores only its hash.
        Distribute it out of band; this endpoint does not send email.

        Source: implementation-plan.md work package P9A-API-01;
        architecture/identity-and-authorization.md, section
        "10. Invitations".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: The created invitation, including its one-time raw token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvitationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      operationId: listGardenInvitations
      tags: [Collaboration]
      summary: List a garden's invitations
      description: |
        Owner-only, unlike `listGardenMembers` — an invitation carries an
        intended email, which is the enumeration surface
        `garden-capability-matrix.md` reserves to the owner alone. Returns
        every invitation regardless of state (pending, accepted, revoked,
        expired), newest first, so the owner can find a pending invitation
        to revoke without having retained its id from the create response.

        Source: implementation-plan.md work package P9A-API-01;
        docs/development/garden-capability-matrix.md, row H5.
      responses:
        '200':
          description: The garden's invitations, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/invitations/{invitationId}/revoke:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: invitationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: revokeInvitation
      tags: [Collaboration]
      summary: Revoke a garden invitation
      description: |
        Owner-only. Idempotent: revoking an invitation that is already
        revoked, accepted, or expired returns that invitation's current
        state unchanged rather than an error.

        Source: implementation-plan.md work package P9A-API-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The invitation's current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [Collaboration]
      summary: Accept a garden invitation
      description: |
        Grants the AUTHENTICATED caller the invitation's intended role.
        Identified by the raw token plus the caller's own session — not by
        the token alone — so acceptance is always attributable to a real
        account, and an email-bound invitation can be checked against a
        VERIFIED email claim rather than an unauthenticated assertion.

        Idempotent and handles, each distinguishably:

        - The caller already has active membership on the garden: returns
          it unchanged, `200`, no error.
        - The invitation is expired or revoked: `409`.
        - The invitation was already accepted (by this caller outside the
          idempotency-key replay window, or by someone else): `409`.
        - The invitation is bound to an email the caller's own verified
          email does not match: `403`. Existence is never concealed here —
          the caller already holds the token — but this response does not
          disclose what the correct email is.

        Source: implementation-plan.md work package P9A-API-01;
        architecture/identity-and-authorization.md, section
        "10. Invitations".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: The caller's membership on the garden the invitation named.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /gardens/{gardenId}/members:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: listGardenMembers
      tags: [Collaboration]
      summary: List a garden's active members
      description: |
        Every active role may read this — owner, editor, and viewer alike
        (garden-capability-matrix.md, row H2 / decision S1): a household
        member who cannot see who else can see their garden has less
        visibility into their own garden than a stranger would. Entries
        carry `profileId` and `role`, never an email address — email is the
        invitation-binding and enumeration surface, and stays owner-visible
        only on the invitation itself.

        Source: implementation-plan.md work package P9A-API-01;
        docs/development/garden-capability-matrix.md, section "4.8 Membership".
      responses:
        '200':
          description: The garden's active members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenMemberListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/members/{profileId}:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: profileId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    patch:
      operationId: changeGardenMemberRole
      tags: [Collaboration]
      summary: Change a member's role between editor and viewer
      description: |
        Owner-only. Moves a non-owner member between `editor` and `viewer`
        only — the target's current role must already be one of those two,
        and the requested role must be one of those two. Promoting to, or
        demoting from, `owner` is a separate, recent-auth-gated flow and is
        rejected here with `422`.

        Source: implementation-plan.md work package P9A-API-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeGardenMemberRoleRequest'
      responses:
        '200':
          description: The member's updated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: removeGardenMember
      tags: [Collaboration]
      summary: Remove a member, or leave a garden
      description: |
        A caller may always remove THEMSELVES (leaving a garden is not
        membership administration). Removing anyone else requires the
        owner-only membership-administration capability. Either way, removing
        the garden's last active owner is refused with `422` — including a
        sole owner attempting to leave their own garden; they must transfer
        ownership or delete the garden instead.

        Source: implementation-plan.md work package P9A-API-01;
        architecture/identity-and-authorization.md, section
        "11. Ownership Transfer".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The removed membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /gardens/{gardenId}/members/{profileId}/promote:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: profileId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: promoteGardenMember
      tags: [Collaboration]
      summary: Promote an active member to co-owner
      description: |
        Owner-only, and requires RECENT authentication (a session whose
        underlying sign-in is older than 30 minutes is rejected with `403`
        and `error.code`
        `collaboration.membership.recent_authentication_required`) — matrix
        row H8. The target must hold ACTIVE `editor` or `viewer` membership;
        promoting a target who is already `owner` is a no-op, `200`,
        unchanged. Multiple active owners are allowed by design
        (identity-and-authorization.md, section "8. Operational Garden
        Roles": "Equal household partners may both be owners"), so this
        never touches any OTHER member's role.

        This is the ONLY path from an accepted ordinary invitation to
        co-ownership: `createInvitation` can never name `owner` as the
        intended role, by construction.

        Source: implementation-plan.md work package P9A-OWNER-01;
        architecture/identity-and-authorization.md, sections "10. Invitations",
        "11. Ownership Transfer"; docs/development/garden-capability-matrix.md,
        row H8.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The member's updated (or already current) role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller is not an owner, or their session's underlying sign-in
            is older than 30 minutes
            (`collaboration.membership.recent_authentication_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/members/{profileId}/demote:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: profileId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: demoteGardenOwner
      tags: [Collaboration]
      summary: Demote a co-owner to editor or viewer
      description: |
        Owner-only, and requires RECENT authentication exactly like
        `promoteGardenMember` — matrix row H9. The target's CURRENT role must
        already be `owner`; demoting a non-owner is `422`
        (`collaboration.membership.target_not_owner`) — use
        `changeGardenMemberRole` to move between `editor` and `viewer`
        instead. Refused with `422`
        (`collaboration.membership.last_owner_required`) when the target is
        the garden's LAST active owner — including under genuine concurrent
        demotion attempts against two co-owners, where exactly one succeeds.
        Self-targeting is permitted: an owner may step themselves down while
        at least one other active owner remains.

        Source: implementation-plan.md work package P9A-OWNER-01;
        architecture/identity-and-authorization.md, section
        "11. Ownership Transfer"; docs/development/garden-capability-matrix.md,
        rows H9, H10.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeGardenMemberRoleRequest'
      responses:
        '200':
          description: The demoted member's updated role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller is not an owner, or their session's underlying sign-in
            is older than 30 minutes
            (`collaboration.membership.recent_authentication_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /gardens/{gardenId}/ownership-transfer:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getGardenOwnershipTransfer
      tags: [Collaboration]
      summary: Read the garden's currently pending ownership transfer
      description: |
        Closes the one real gap this tag's write-only ownership-transfer
        surface left: before this, the initiating owner could not confirm a
        requested transfer was still pending after a page reload except by
        attempting `cancelGardenOwnershipTransfer` and reading its `404` as
        "nothing was pending".

        Readable by two parties: the current owner
        (`administerOwnership`) — checking a transfer they requested — or the
        named recipient (`toProfileId` equal to the caller) — checking an
        offer addressed to them, without needing `administerOwnership`. `404`
        with `collaboration.ownership_transfer.not_found` both when nothing
        is pending for this garden AND when a transfer is pending but the
        caller is neither party — an editor or viewer with no standing over
        the transfer must not learn one exists, the identical concealment
        `acceptOwnershipTransfer`/`declineOwnershipTransfer` already apply to
        a caller who is not the named recipient.

        Source: implementation-plan.md work package P9A-OWNER-02;
        architecture/identity-and-authorization.md, section
        "11. Ownership Transfer".
      responses:
        '200':
          description: The garden's currently PENDING ownership transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnershipTransfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: transferGardenOwnership
      tags: [Collaboration]
      summary: Request transfer of garden ownership to another active member
      description: |
        Owner-only, and requires RECENT authentication exactly like
        `promoteGardenMember`/`demoteGardenOwner` — matrix row H13. The
        target must hold ACTIVE `editor` or `viewer` membership (`404` when
        it does not; `422` with
        `collaboration.membership.target_already_owner` when the target is
        already an owner — demote the existing owner instead).

        THIS ONLY REQUESTS. Nobody's role changes yet: the caller remains
        owner, with full administration rights, until the request is
        resolved. On success the `ownership_transfer` row is written as
        `pending` and stays there.

        CONFIRMATION POLICY: ownership actually moves only when the named
        recipient calls `acceptOwnershipTransfer`. This is an explicit,
        reviewed product decision: a transfer is a unilateral full handover
        of deletion, export, and membership-administration rights, with no
        recovery path if the initiator names the wrong person, so — unlike
        `promoteGardenMember`, which only ever ADDS a co-owner — it requires
        the recipient's own explicit acceptance, not merely the initiator's
        recent-auth-gated request. The recipient may instead
        `declineOwnershipTransfer` it, or the initiator may
        `cancelGardenOwnershipTransfer` it, either of which also leaves every
        role unchanged.

        At most one PENDING transfer may exist per garden; a second request
        while one is genuinely in flight is rejected with `409`
        (`collaboration.ownership_transfer.already_pending`) rather than a
        raw constraint violation.

        Source: implementation-plan.md work package P9A-OWNER-01;
        architecture/identity-and-authorization.md, section
        "11. Ownership Transfer"; docs/development/garden-capability-matrix.md,
        row H13; migrations/1786500000000_collaboration-operations-and-attribution.sql.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '200':
          description: The newly requested, still-PENDING ownership transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnershipTransfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller is not an owner, or their session's underlying sign-in
            is older than 30 minutes
            (`collaboration.membership.recent_authentication_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: cancelGardenOwnershipTransfer
      tags: [Collaboration]
      summary: Cancel the garden's pending ownership transfer as its initiator
      description: |
        Owner-only. Cancels the garden's currently PENDING ownership
        transfer, if one exists (`404` with
        `collaboration.ownership_transfer.not_found` otherwise) — the
        INITIATOR's own withdrawal of a request they made, reachable any time
        before the recipient acts on it, which under the recipient-acceptance
        policy `transferGardenOwnership` implements is the ordinary in-between
        state, not a rare edge case. Its recipient has a separate, symmetric
        way to refuse the same offer: `declineOwnershipTransfer`.

        Source: implementation-plan.md work package P9A-OWNER-01;
        architecture/identity-and-authorization.md, section
        "11. Ownership Transfer".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The cancelled ownership transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnershipTransfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/ownership-transfer/accept:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: acceptOwnershipTransfer
      tags: [Collaboration]
      summary: Accept a pending ownership transfer addressed to the caller
      description: |
        Called by the TARGET named in the garden's currently PENDING
        transfer's `toProfileId` — the one command that actually moves
        ownership. Identified by garden plus the caller's own identity, no
        token: `404` with `collaboration.ownership_transfer.not_found` when
        no transfer is pending, or one is pending but does not name the
        caller (the two are deliberately indistinguishable — a caller must
        not learn that a transfer exists naming someone else).

        RE-VALIDATES AT ACCEPTANCE TIME, not just at request time: the
        transfer's `fromProfileId` must STILL be an active owner right now
        (`422` with `collaboration.membership.target_not_owner` if they were
        demoted, removed, or transferred ownership elsewhere while this
        stayed pending); the caller must still hold ACTIVE, non-`owner`
        membership (`404` with `collaboration.membership.not_found`, or `422`
        with `collaboration.membership.target_already_owner`, if either
        changed while this stayed pending). Any such failure leaves
        everything exactly as it was — no membership row is touched, and the
        transfer is left in whatever state it was already in.

        On success, atomically: the initiator's own role becomes the
        `fromResultingRole` recorded on the transfer, the caller becomes
        `owner`, and the transfer is marked `completed`.

        NOT recent-auth-gated, unlike every OTHER owner-administration
        operation on this tag: every recent-auth gate here protects a caller
        administering someone ELSE'S access, and accepting is the opposite
        shape — the caller is only disposing of an offer addressed to
        themselves, the same risk category `acceptInvitation` is in.

        Source: implementation-plan.md work package P9A-OWNER-01;
        architecture/identity-and-authorization.md, section
        "11. Ownership Transfer"; docs/development/garden-capability-matrix.md,
        row H13.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The completed ownership transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnershipTransfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /gardens/{gardenId}/ownership-transfer/decline:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: declineOwnershipTransfer
      tags: [Collaboration]
      summary: Decline a pending ownership transfer addressed to the caller
      description: |
        Called by the TARGET named in the garden's currently PENDING
        transfer's `toProfileId` — the symmetric refusal to
        `acceptOwnershipTransfer`, resolved by the recipient rather than the
        initiator (`cancelGardenOwnershipTransfer` is the initiator's own,
        separate withdrawal path). `404` with
        `collaboration.ownership_transfer.not_found` when no transfer is
        pending, or one is pending but does not name the caller.

        Touches no membership row and asserts nothing about the current
        owner: refusing an offer is valid regardless of whether its premise
        still holds. On success the transfer is marked `cancelled` with a
        recipient-attributed reason. Not recent-auth-gated, for the same
        reason `acceptOwnershipTransfer` and `cancelGardenOwnershipTransfer`
        are not.

        Source: implementation-plan.md work package P9A-OWNER-01;
        architecture/identity-and-authorization.md, section
        "11. Ownership Transfer".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The declined (cancelled) ownership transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnershipTransfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /ownership-transfers/incoming:
    get:
      operationId: listIncomingOwnershipTransfers
      tags: [Collaboration]
      summary: List every pending ownership transfer addressed to the caller
      description: |
        Profile-scoped, not garden-scoped — no `gardenId` path segment, and no
        garden membership capability is checked, mirroring `listGardens`:
        "every pending transfer naming me" is inherently scoped to the
        caller's own identity, the same way "every garden I belong to" is.

        This is the read that actually closes the recipient side of the gap
        `getGardenOwnershipTransfer` alone cannot: a recipient who does not
        already know which garden a transfer concerns has no `gardenId` to
        ask that endpoint about. Before this endpoint, the only way a
        recipient could learn a transfer named them was out of band, from the
        initiator.

        Returns every PENDING transfer across every garden where the caller
        is the named recipient (`toProfileId`), most recently requested
        first. Each item carries the destination garden's own current name
        (`gardenName`) so a client can render a real card ("accept ownership
        of Riverside Garden?") rather than an anonymous offer.

        Source: implementation-plan.md work package P9A-OWNER-02;
        architecture/identity-and-authorization.md, section
        "11. Ownership Transfer".
      responses:
        '200':
          description: Every pending ownership transfer addressed to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomingOwnershipTransferListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /gardens/{gardenId}/assignments:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: listGardenAssignments
      tags: [Collaboration]
      summary: List a garden's active professional assignments
      description: |
        Every active role may read this — owner, editor, and viewer alike,
        the same `viewGarden` reasoning `listGardenMembers` already applies:
        a household member who cannot see which outside professional
        currently has access to their own garden has less visibility into
        it than a stranger would. Returns every ACTIVE
        `collaboration.garden_assignment` row naming this garden, across
        every service organization, newest-assigned first.

        This is a read of the SAME rows `listOrganizationGardenAssignments`
        (tag `Organizations`) reads from the opposite direction — "who can
        reach this garden" versus "which gardens can this organization's
        members reach." Neither endpoint's authorization gate is satisfied
        by the other: seeing this list requires garden membership, not
        organization membership, and organization membership alone never
        grants it (ADR-0012).

        Source: implementation-plan.md work package P9B-API-01;
        architecture/collaboration-and-client-sharing.md, section
        "7. Service Organizations and Assignments".
      responses:
        '200':
          description: The garden's active assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenAssignmentListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/engagements:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: listGardenClientEngagements
      tags: [Collaboration]
      summary: List a garden's client engagements
      description: |
        Owner-only (`manageGarden`), unlike `listGardenAssignments` — an
        engagement names a service organization relationship and stewardship
        policy, the same "business-relationship" sensitivity
        `listGardenInvitations` already reserves to the owner alone (an
        invitation carries an intended email; an engagement carries who is
        contracted to serve this garden and under what data policy). Returns
        every engagement in any state (`draft`, `active`, `ended`,
        `revoked`), newest first.

        Source: implementation-plan.md work package P9B-API-01;
        architecture/collaboration-and-client-sharing.md, section
        "8. Client Engagement".
      responses:
        '200':
          description: The garden's client engagements, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientEngagementListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/map:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: minX
        in: query
        required: false
        description: |
          Viewport bounding box in garden-local metres, for large gardens.
          All four bounds are required together or omitted together; a
          partial set is a `400`.
        schema:
          type: number
      - name: minY
        in: query
        required: false
        schema:
          type: number
      - name: maxX
        in: query
        required: false
        schema:
          type: number
      - name: maxY
        in: query
        required: false
        schema:
          type: number

    get:
      operationId: getGardenMap
      tags: [Map]
      summary: Get the canonical garden map
      description: |
        Returns every active object in the garden's local coordinate space,
        its optional georeference, and a validation summary. Omitting the
        bounding box parameters returns the whole garden — appropriate for
        small and ordinary gardens; large gardens should pass a viewport.

        Source: implementation-plan.md work packages P3-BE-01, P3-DATA-02;
        architecture/map-rendering-and-editing.md, section "6. Hybrid Data Model".
      responses:
        '200':
          description: The garden's map document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenMapDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/map/commands:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: submitMapCommand
      tags: [Map]
      summary: Submit one canonical map editor command
      description: |
        A single revision-aware endpoint for every map editing command —
        create, move, replace geometry, edit a vertex, split or join
        linework, change properties, assign a plant, upsert a calibration,
        decide a proposal, delete, restore, or duplicate — rather than one
        REST endpoint per command type. Every command that targets an
        existing object carries its own expected revision in its payload
        (not an `If-Match` header), because some commands, such as joining
        two lines, target more than one object at once and need more than
        one expected revision.

        `actorProfileId` and `actorType` are never read from the request
        body; the server fills them from the authenticated caller, the same
        rule every other mutation in this API follows.

        Source: implementation-plan.md work package P3-BE-01;
        architecture/map-rendering-and-editing.md, section
        "7. Editor Command Model".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapCommandRequest'
      responses:
        '200':
          description: The object or objects the command affected, at their new revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapCommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /gardens/{gardenId}/context:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: listGardenContextFacts
      tags: [GardenContext]
      summary: List a garden's context facts
      description: |
        Every context fact currently recorded for this garden — sun
        exposure, soil type, drainage, irrigation method, growing context,
        and microclimate, whichever have been declared or reviewed so far.
        Available to any member with garden read access (`viewGarden`),
        the same posture `getGardenMap` already applies.

        Source: implementation-plan.md §18.2, work package P9D-CONTEXT-01;
        technical-specification.md FR-22 ("Garden Context").
      responses:
        '200':
          description: The garden's currently recorded context facts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenContextFactListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/context/{contextKind}:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: contextKind
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GardenContextKind'

    put:
      operationId: recordGardenContextFact
      tags: [GardenContext]
      summary: Declare or update one garden context fact
      description: |
        Creates the fact at `contextKind` for this garden, or updates it in
        place if one is already recorded — one row per
        `(gardenId, contextKind)`. Requires the same capability as editing
        garden map content (`editGardenContent`, the same capability
        `submitMapCommand` requires) — a sun-exposure or drainage
        declaration is exactly the kind of garden-content edit that
        capability already governs.

        Idempotent BY DESIGN, so this operation deliberately takes neither
        `Idempotency-Key` nor `If-Match` — the same posture
        `registerNotificationDevice` documents for itself: a last-writer-
        wins upsert on a single natural key, where a retry or concurrent
        duplicate submitting the same body converges on identical stored
        state and an identical response, so a separate idempotency record
        would duplicate what the upsert already guarantees.

        Source: implementation-plan.md §18.2, work package P9D-CONTEXT-01;
        technical-specification.md FR-22 ("Garden Context").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordGardenContextFactRequest'
      responses:
        '200':
          description: The recorded context fact, at its new revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenContextFact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/plants:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: addPlant
      tags: [Plants]
      summary: Add a plant
      description: |
        Adds a plant instance, row, or group to the garden's inventory.
        `taxonomyReferenceId` may be set directly here when the caller already
        knows the species; otherwise leave it unset and identify the plant
        later via a photo or `SearchTaxonomyReferences`.

        Source: implementation-plan.md work packages P4-BE-01, P4-CONTRACT-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPlantRequest'
      responses:
        '201':
          description: The created plant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      operationId: searchPlants
      tags: [Plants]
      summary: Search a garden's plants
      description: |
        Trigram-fuzzy match against `displayName` when `query` is given,
        combined with optional structured filters (`lifecycleStage`,
        `status`, `groupingKind`, each combinable and each accepting more
        than one value), cursor-paginated the same way `ListGardens`
        paginates. Ranked most-similar first when `query` is given, most
        recently created first otherwise.

        Closes a real, already-documented gap: before P4-SEARCH-01 this tag
        had no list operation at all, only single-plant `GetPlant` — the web
        and iOS Phase 4 clients each had to fall back to a
        create-then-navigate / open-by-id flow instead of a real inventory
        list.

        Source: implementation-plan.md work package P4-SEARCH-01.
      parameters:
        - name: query
          in: query
          required: false
          description: Trigram-fuzzy match against displayName. Omit to list every plant matching the other filters.
          schema:
            type: string
            maxLength: 200
        - name: lifecycleStage
          in: query
          required: false
          description: Comma-separated lifecycle stages to include. Omit to include every stage.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PlantLifecycleStage'
        - name: status
          in: query
          required: false
          description: Comma-separated statuses to include. Omit to include every status.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PlantStatus'
        - name: groupingKind
          in: query
          required: false
          description: Comma-separated grouping kinds to include. Omit to include every kind.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PlantGroupingKind'
        - name: identified
          in: query
          required: false
          description: |
            `true` restricts to plants with a resolved `taxonomyReferenceId`;
            `false` restricts to those without one. Omit for no restriction
            (P11-SEARCH-01).
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching plants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantListResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/plants/from-photo:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: addPlantFromPhoto
      tags: [Plants]
      summary: Add a plant identified from a photo
      description: |
        Creates an `'individual'` plant prefilled from a photo-identification
        pass, and inserts the photo and the identification suggestion in the
        same transaction. `taxonomyReferenceId` on the created plant stays
        unset until the suggestion is confirmed via `ConfirmPlantIdentification`
        — identification never auto-confirms.

        Source: implementation-plan.md work packages P4-BE-01, P4-CONTRACT-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPlantFromPhotoRequest'
      responses:
        '201':
          description: The created plant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /gardens/{gardenId}/plants/{plantId}:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: plantId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getPlant
      tags: [Plants]
      summary: Get a plant
      description: |
        Returns a plant in a garden the caller has active membership in.
        Existence — including a plant id that belongs to a different garden
        than the one named in the path — is concealed as `404`.

        Source: implementation-plan.md work package P4-CONTRACT-01.
      responses:
        '200':
          description: The requested plant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updatePlantDetails
      tags: [Plants]
      summary: Update plant details
      description: |
        Revision-guarded edit of identity, acquisition, and care-note fields.
        Every property is optional; an omitted property leaves the current
        value unchanged, while an explicit `null` on a nullable property
        clears it. `groupingKind` is immutable and not editable here.

        Source: implementation-plan.md work packages P4-BE-01, P4-CONTRACT-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlantDetailsRequest'
      responses:
        '200':
          description: The updated plant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /gardens/{gardenId}/plants/{plantId}/photos:
