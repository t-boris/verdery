          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        varietyLabel:
          type: [string, 'null']
        acquisitionDate:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        acquisitionDateType:
          oneOf:
            - $ref: '#/components/schemas/PlantAcquisitionDateType'
            - type: 'null'
        groupingKind:
          $ref: '#/components/schemas/PlantGroupingKind'
