      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The submitted update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientUpdate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /client-engagements/{engagementId}/updates/{clientUpdateId}/publish:
    parameters:
      - name: engagementId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: clientUpdateId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: publishClientUpdate
      tags: [Publications]
      summary: Publish a ready-for-client update (ready_for_client -> published)
      description: |
        The six-step publish transaction (collaboration-and-client-sharing.md
        section 10): (1) revalidates the caller's publisher grant, the
        engagement's `active` state, and the garden every selected item must
        belong to; (2) re-validates every staged work-log/media item plus any
        inline garden-snapshot/timeline-entry/staff-attribution content
        supplied in this request; (3) creates an immutable
        `publication_version` and its per-kind item snapshots; (4) creates
        explicit `media_entitlement` records for every media item; (5)
        appends an audit record and an outbox event atomically with the same
        write; (6) the outbox event is what a notification worker consumes
        strictly after this transaction commits — nothing here sends a
        notification synchronously.

        `gardenSnapshot`, `timelineEntries`, and `staffAttributions` are
        supplied directly in this request (not staged in advance): they are
        narrative content the publisher composes for the publication itself,
        unlike work-log/media items, which are selected from existing
        operational records and staged beforehand via `addClientUpdateItem`.
        All three are optional; a publication with zero items is valid.

        Revision-guarded by `If-Match` against `client_update.revision` —
        the mechanism that resolves two publishers racing to publish the SAME
        update: exactly one revision-guarded write succeeds, the other
        receives `412`. Only the `ready_for_client -> published` edge
        applies; refused with `422` from any other state, including an
        already-`published` update (this state machine has no `published ->
        published` edge), so a retried publish that reuses the same
        `Idempotency-Key` replays the same result, while one that does not
        receives a clean `422` rather than a raw constraint violation —
        `publication_version.client_update_id` is `UNIQUE`, so a genuine
        double-insert is additionally caught and translated, never surfaced
        as a raw `500`.

        Source: implementation-plan.md work package P9C-PUBLISH-01;
        architecture/collaboration-and-client-sharing.md, sections
        "10. Publication Workflow", "11. Publication Contents".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishClientUpdateRequest'
      responses:
        '200':
          description: The immutable publication version just created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /client-engagements/{engagementId}/updates/{clientUpdateId}/withdraw:
    parameters:
      - name: engagementId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: clientUpdateId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: withdrawClientUpdate
      tags: [Publications]
      summary: Withdraw a published update (published -> withdrawn)
      description: |
        Only the `published -> withdrawn` edge applies; a true terminal, and
        idempotent when already `withdrawn`. Never deletes the publication
        version, its items, or its media entitlements — withdrawal removes
        the update from ordinary client queries and revokes portal
        visibility, but preserves the audit/dispute record
        (collaboration-and-client-sharing.md section 10). Revision-guarded by
        `If-Match`.

        Source: implementation-plan.md work package P9C-PUBLISH-01;
        architecture/collaboration-and-client-sharing.md, section
        "10. Publication Workflow".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawClientUpdateRequest'
      responses:
        '200':
          description: The withdrawn (or already withdrawn) update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientUpdate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # --- Client portal (P9C-API-01, tag ClientPortal) ---

  /client/gardens:
    get:
      operationId: listClientGardens
      tags: [ClientPortal]
      summary: List the caller's own client-portal gardens
      description: |
        Every engagement the AUTHENTICATED caller currently holds an
        ACTIVE `client_access_grant` on, resolved entirely from the
        caller's own profile — no path or query parameter names an
        engagement, organization, or garden, so there is nothing here for
        a caller to guess or enumerate. Each item's `id` IS the
        `clientGardenId` every other `ClientPortal` operation takes.

        Source: implementation-plan.md work package P9C-API-01.
      responses:
        '200':
          description: The caller's own client-portal gardens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientGardenListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /client/gardens/{clientGardenId}/overview:
    parameters:
      - name: clientGardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getClientGardenOverview
      tags: [ClientPortal]
      summary: Get a client garden's accepted-garden overview
      description: |
        Re-resolves the caller's own ACTIVE `client_access_grant` for
        `clientGardenId` first — never trusts the path parameter alone
        (this tag's own description) — then returns the accepted-garden-
        snapshot content (`kind: garden_snapshot`) from the latest
        published version that included one, if any. Snapshot fields are
        entirely absent, with `200` and no error, when no such publication
        has ever gone out — an honest absence, not a client-portal
        precondition failure.

        Source: implementation-plan.md work package P9C-API-01;
        architecture/collaboration-and-client-sharing.md, section
        "11. Publication Contents".
      responses:
        '200':
          description: The garden's current overview, possibly with no snapshot yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientGardenOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /client/gardens/{clientGardenId}/publications:
    parameters:
      - name: clientGardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: listClientPublications
      tags: [ClientPortal]
      summary: List a client garden's published updates
      description: |
        Every `published`-state `client_update`'s resulting
        `publication_version` for this engagement, newest-published first,
        each with its client-safe title, summary, and item snapshots
        grouped under that one version. A `withdrawn` update's version
        never appears — the identical `client_update.state = 'published'`
        join `getClientMediaAccess` already uses to decide publication
        visibility.

        Source: implementation-plan.md work package P9C-API-01;
        architecture/collaboration-and-client-sharing.md, sections
        "10. Publication Workflow", "11. Publication Contents".
      responses:
        '200':
          description: The garden's visible publications, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPublicationListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /client/gardens/{clientGardenId}/timeline:
    parameters:
      - name: clientGardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getClientTimeline
      tags: [ClientPortal]
      summary: Get a client garden's factual timeline
      description: |
        The SAME visible (`published`, never `withdrawn`) publication
        items `listClientPublications` reads, reshaped: every item of
        every kind (`work_log`, `media`, `garden_snapshot`,
        `timeline_entry`) across every visible publication version,
        flattened into ONE chronological sequence ordered by its own
        `occurredAt`, oldest first — a factual narrative of what happened
        and when, not a log of publisher batches. Genuinely distinct from
        `listClientPublications`: that operation groups by publication
        version (title, summary, and a bounded item list per publish
        event); this one has no version grouping or title/summary at all,
        only the flattened facts in time order, per
        collaboration-and-client-sharing.md section 12.1 ("Garden Timeline
        is factual. It is composed from immutable published updates,
        completed-work snapshots, selected media, and accepted garden
        snapshots with real timestamps").

        Source: implementation-plan.md work package P9C-API-01;
        architecture/collaboration-and-client-sharing.md, section
        "12. Garden Timeline and Time Machine".
      responses:
        '200':
          description: The garden's factual timeline, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientTimelineResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /client/publications/{publicationId}/media/{mediaId}/access:
    parameters:
      - name: publicationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: mediaId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getClientMediaAccess
      tags: [ClientPortal]
      summary: Get short-lived client access to one entitled media object
      description: |
        A thin transport wrapper around the existing `GetClientMediaAccess`
        command (P9C-MEDIA-01) — this operation adds no authorization
        logic of its own. `mediaId` is the sole authority parameter beyond
        the caller's own authenticated profile: access is decided entirely
        from the `media_entitlement` row naming this exact media object
        (which, in turn, already names its own engagement and publication
        version), re-verifying at issuance time that the engagement is
        `active`, the caller's own `client_access_grant` on it is
        `active`, and the entitling publication is genuinely `published`
        (collaboration-and-client-sharing.md section 16's six-condition
        list). `publicationId` is validated as a well-formed identifier
        but is NOT itself an authorization input — it exists purely so
        this route's URL mirrors architecture section 13's own path shape;
        a mismatched, stale, or unrelated `publicationId` alongside a
        genuinely entitled `mediaId` still succeeds, the same way none of
        this tag's other operations accept an operational id as authority.
        State is rechecked fresh on every call; nothing here caches a
        prior verdict.

        Source: implementation-plan.md work packages P9C-MEDIA-01,
        P9C-API-01; architecture/collaboration-and-client-sharing.md,
        section "16. Media Access".
      responses:
        '200':
          description: Short-lived, authorized access to the entitled media object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /client/gardens/{clientGardenId}/exports:
    parameters:
      - name: clientGardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getClientExportManifest
      tags: [ClientPortal]
      summary: Get the client-entitled export/handoff manifest for a garden
      description: |
        The default residential stewardship policy's export/handoff package
        (architecture/collaboration-and-client-sharing.md section 18): the
        accepted garden model (current map objects and plants — never
        operational history, drafts, or provider-internal notes) plus every
        CURRENTLY published deliverable this engagement has, plus every
        media item this client is genuinely entitled to.

        Synchronous, unlike the operational `Exports` tag's request/poll/
        download shape: a client export is categorically bounded (current
        state, not history; a handful of published summaries; media served
        as signed URLs, never a ZIP), so no durable job or worker round trip
        is needed. Every media item is re-verified through the identical
        entitlement check `getClientMediaAccess` enforces, one at a time,
        before it is included — an item this caller is not entitled to is
        silently absent from `media`, never a distinguishable error.

        AUTHORIZATION admits an engagement that is `active` OR `ended` (never
        `draft` or `revoked`) — the one deliberate widening beyond every
        other `ClientPortal` read, so that ending an engagement does not
        itself delete the client's ability to obtain their handoff package
        (section 18, step 2). The caller's own `client_access_grant` must
        still be genuinely active. A withdrawn publication never appears —
        "published deliverables" means currently published, matching every
        other `ClientPortal` read exactly, so this route cannot become a
        side channel around withdrawal.

        Source: implementation-plan.md work package P9C-EXPORT-01;
        architecture/collaboration-and-client-sharing.md, section
        "18. Data Stewardship, Export, and Engagement End";
        architecture/data-export-and-deletion.md.
      responses:
        '200':
          description: The garden's current export/handoff manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientExportManifest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Firebase ID token presented by the native client.

        Source: architecture/identity-and-authorization.md, section
        "4. Native Authentication Flow".
    sessionCookie:
      type: apiKey
      in: cookie
      name: __session
      description: |
        HTTP-only Firebase session cookie used by the web client. Cookie
        authenticated mutations additionally require CSRF protection.

        Source: architecture/identity-and-authorization.md, section
        "5. Web Session Flow".

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUIDv7. The same key with a semantically identical
        request returns the original result. The same key with a different
        command is rejected with `request.idempotency.key_reused`.
      schema:
        $ref: '#/components/schemas/Uuid'

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Expected revision of the target resource, quoted. A stale value is
        rejected rather than silently overwriting a newer state.
      schema:
        type: string
        examples: ['"7"']

    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation token from a previous page. Clients must not parse it.
      schema:
        type: string
        maxLength: 512

    Limit:
      name: limit
      in: query
      required: false
      description: Maximum items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

    SyncAfterCursor:
      name: after
      in: query
      required: false
      description: |
        Opaque continuation token from a previous `GetSyncChanges` page.
        Omit only for a first-ever pull. Clients must not parse it. Named
        `after`, not `cursor`, matching the exact query parameter name
        architecture/api-design.md section "16. Synchronization Endpoints"
        and architecture/offline-synchronization.md section "10. Pull
        Protocol" both specify for this one endpoint.
      schema:
        type: string
        maxLength: 512

  headers:
    ETag:
      description: Current revision of the returned resource, quoted.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0

  schemas:
    Uuid:
      type: string
      format: uuid
      description: Opaque UUIDv7 identifier. Time ordering is an index property, not an authoritative creation time.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      examples: ['019827ab-4c1d-7e3f-9a2b-5c6d7e8f9a0b']

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp in UTC.
      examples: ['2026-07-22T09:15:00Z']

    Revision:
      type: integer
      format: int64
      minimum: 1
      description: Monotonically increasing server revision within one object's identity.

    GardenLifecycleState:
      type: string
      enum: [active, archived, deletionRequested, purging]
      description: |
        `deletionRequested` starts the deletion workflow; it is not immediate
        deletion. The garden stays recoverable through `restoreGarden` until
        `recoveryDeadlineAt` passes.

        `purging` is the point of no return (P8-DELETE-01): the deletion sweep
        has claimed the garden and is executing the irreversible purge.
        `restoreGarden` refuses it, and the garden row itself disappears when
        the purge completes — no `deleted` value exists because no readable
        garden survives to carry one.

        Source: architecture/data-and-geospatial-design.md, section "15. Deletion";
        architecture/data-export-and-deletion.md, section "10. Garden Deletion".

    GardenRole:
      type: string
      enum: [owner, editor, viewer]
      description: |
        The authenticated caller's own role on this garden. Informational for
        client UI only — the server re-evaluates authorization on every
        request and never trusts a client-submitted role.

        Source: architecture/identity-and-authorization.md, section "8. Garden Roles".

    Garden:
      type: object
      additionalProperties: false
      required: [id, name, lifecycleState, callerRole, revision, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 120
        lifecycleState:
          $ref: '#/components/schemas/GardenLifecycleState'
        callerRole:
          $ref: '#/components/schemas/GardenRole'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        recoveryDeadlineAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: |
            When the 30-day recovery window closes and the irreversible purge
            becomes eligible (P8-DELETE-01). Present only while
            `lifecycleState` is `deletionRequested` or `purging`; absent
            otherwise.

            Source: architecture/data-export-and-deletion.md, section "10. Garden Deletion".

    GardenListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Garden'
        nextCursor:
          type: string
          description: Opaque continuation token. Absent when no further page exists.

    CreateGardenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    RenameGardenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    # --- Collaboration (P9A-API-01) -----------------------------------

    GardenMemberState:
      type: string
      enum: [active, removed]
      description: |
        Mirrors `collaboration.membership.state`. A member roster
        (`listGardenMembers`) only ever returns `active` entries; this value
        is carried on every `GardenMember` regardless, so the shape stays
        stable if a later endpoint returns non-active history.

    GardenMember:
      type: object
      additionalProperties: false
      required: [id, gardenId, profileId, role, state, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          $ref: '#/components/schemas/Uuid'
        profileId:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/GardenRole'
        state:
          $ref: '#/components/schemas/GardenMemberState'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    GardenMemberListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GardenMember'

    InvitationListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'

    ChangeGardenMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/InvitationIntendedRole'

    # --- Ownership administration (P9A-OWNER-01) ----------------------

    OwnershipTransferState:
      type: string
      enum: [pending, completed, cancelled]
      description: |
        Mirrors `collaboration.ownership_transfer.state`. `transferGardenOwnership`
        only ever creates a `pending` row; it reaches `completed` when the
        named recipient calls `acceptOwnershipTransfer`, or `cancelled` when
        either the recipient calls `declineOwnershipTransfer` or the
        initiator calls `cancelGardenOwnershipTransfer`. `pending` is the
        ordinary, externally observable in-between state for as long as
        neither has happened yet.

    OwnershipTransfer:
      type: object
      additionalProperties: false
      required:
        - id
        - gardenId
        - fromProfileId
        - toProfileId
        - fromResultingRole
        - state
        - authenticatedAt
        - requestedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          $ref: '#/components/schemas/Uuid'
        fromProfileId:
          $ref: '#/components/schemas/Uuid'
        toProfileId:
          $ref: '#/components/schemas/Uuid'
        fromResultingRole:
          allOf:
            - $ref: '#/components/schemas/InvitationIntendedRole'
          description: The role the outgoing owner holds once this transfer completes.
        state:
          $ref: '#/components/schemas/OwnershipTransferState'
        authenticatedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: The recent-authentication instant that satisfied section 11's sensitive-action precondition.
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
        cancelledAt:
          $ref: '#/components/schemas/Timestamp'
        cancellationReason:
          type: string
          description: Present only on a cancelled transfer, and only when one was given.

    TransferOwnershipRequest:
      type: object
      additionalProperties: false
      required: [toProfileId, resultingRole]
      properties:
        toProfileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Must name a profile holding ACTIVE `editor` or `viewer` membership on this garden.
        resultingRole:
          allOf:
            - $ref: '#/components/schemas/InvitationIntendedRole'
          description: The role the caller (the outgoing owner) holds once the transfer completes.

    IncomingOwnershipTransfer:
      description: |
        An `OwnershipTransfer` plus the destination garden's own current
        name (P9A-OWNER-02) — `listIncomingOwnershipTransfers`'s own item
        shape. The name is joined in so a recipient deciding whether to
        accept ownership of a garden can see which one, rather than only its
        opaque id.
      allOf:
        - $ref: '#/components/schemas/OwnershipTransfer'
        - type: object
          additionalProperties: false
          required: [gardenName]
          properties:
            gardenName:
              type: string
              description: The destination garden's current name, as of when this list was read.

    IncomingOwnershipTransferListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IncomingOwnershipTransfer'

    InvitationIntendedRole:
      type: string
      enum: [editor, viewer]
      description: |
        The role vocabulary an invitation, or a role change under this same
        module, may name. Never `owner` — ownership moves only through the
        dedicated transfer flow (`invitation_intended_role_check`).

    InvitationState:
      type: string
      enum: [pending, accepted, revoked, expired]
      description: Mirrors `collaboration.invitation.state`.

    Invitation:
      type: object
      additionalProperties: false
      required: [id, gardenId, inviterProfileId, intendedRole, state, createdAt, expiresAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          $ref: '#/components/schemas/Uuid'
        inviterProfileId:
          $ref: '#/components/schemas/Uuid'
        intendedRole:
          $ref: '#/components/schemas/InvitationIntendedRole'
        intendedEmail:
          type: string
          format: email
          description: Absent for an unbound invitation, shareable with anyone who receives the link.
        state:
          $ref: '#/components/schemas/InvitationState'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        acceptedAt:
          $ref: '#/components/schemas/Timestamp'
        revokedAt:
          $ref: '#/components/schemas/Timestamp'
        resultingMembershipId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Present only once the invitation has been accepted.

    CreateInvitationResult:
      description: |
        An `Invitation` plus the raw token — present ONLY in this one
        response. The server stores only the token's hash; there is no
        endpoint that can ever return it again.
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          additionalProperties: false
          required: [token]
          properties:
            token:
              type: string
              minLength: 32
              maxLength: 128
              description: Opaque single-use secret. Distribute out of band; excluded from logs and analytics.

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [intendedRole]
      properties:
        intendedRole:
          $ref: '#/components/schemas/InvitationIntendedRole'
        intendedEmail:
          type: string
          format: email
          description: Omit for an unbound invitation shareable with anyone who receives the link.

    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128

    # --- Organizations, garden assignment, and client engagement (P9B-API-01) ---

    OrganizationRole:
      type: string
      enum: [organizationAdmin, professional]
      description: |
        Mirrors `collaboration.organization_membership.role`
        (`organization_membership_role_check`), camelCased on the wire the
        same way `GardenLifecycleState` camelCases `deletion_requested`.
        `organizationAdmin` holds every organization capability
        (`manageOrganizationMembership`, `manageGardenAssignment`,
        `manageEngagement`); `professional` holds none of its own — a
        professional's rights come entirely from an explicit
        `GardenAssignment`, never from organization membership itself
        (ADR-0012: "Organization membership alone grants no garden access").

        Source: architecture/collaboration-and-client-sharing.md, section
        "7. Service Organizations and Assignments".

    ServiceOrganization:
      type: object
      additionalProperties: false
      required: [id, name, callerRole, revision, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 120
        callerRole:
          allOf:
            - $ref: '#/components/schemas/OrganizationRole'
          description: The authenticated caller's own role on this organization. Informational for client UI only.
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    ServiceOrganizationListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOrganization'

    CreateServiceOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    OrganizationMemberState:
      type: string
      enum: [active, removed]
      description: Mirrors `collaboration.organization_membership.state`.

    OrganizationMember:
      type: object
      additionalProperties: false
      required: [id, organizationId, profileId, role, state, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organizationId:
          $ref: '#/components/schemas/Uuid'
        profileId:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/OrganizationRole'
        state:
          $ref: '#/components/schemas/OrganizationMemberState'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    OrganizationMemberListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMember'

    AddOrganizationMemberRequest:
      type: object
      additionalProperties: false
      required: [profileId, role]
      properties:
        profileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: An existing profile's id. No invitation flow exists for organization membership — see `addOrganizationMember`'s own description.
        role:
          $ref: '#/components/schemas/OrganizationRole'

    ChangeOrganizationMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/OrganizationRole'

    GardenAssignmentRole:
      type: string
      enum: [editor, viewer]
      description: |
        The role vocabulary a garden assignment may name — identical to
        `InvitationIntendedRole` and for the identical reason: `owner`
        is excluded (`garden_assignment_role_check`), because the garden's
        owner is the CLIENT; ownership never travels through an assignment.

    GardenAssignmentState:
      type: string
      enum: [active, ended, revoked]
      description: |
        Mirrors `collaboration.garden_assignment.state`. Both `ended` and
        `revoked` are terminal — see `garden-assignment-state.ts`'s own
        state diagram.

    GardenAssignment:
      type: object
      additionalProperties: false
      required:
        - id
        - organizationId
        - profileId
        - gardenId
        - role
        - state
        - validFrom
        - createdByProfileId
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organizationId:
          $ref: '#/components/schemas/Uuid'
        profileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: The assigned professional — an ACTIVE member of `organizationId` at the time this assignment was created.
        gardenId:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/GardenAssignmentRole'
        state:
          $ref: '#/components/schemas/GardenAssignmentState'
        validFrom:
          $ref: '#/components/schemas/Timestamp'
        validUntil:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Present only once `state` is `ended` or `revoked`.
        createdByProfileId:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    GardenAssignmentListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GardenAssignment'

    CreateGardenAssignmentRequest:
      type: object
      additionalProperties: false
      required: [profileId, gardenId, role]
      properties:
        profileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Must name a profile holding ACTIVE membership on the organization named in the path.
        gardenId:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/GardenAssignmentRole'

    ClientEngagementState:
      type: string
      enum: [draft, active, ended, revoked]
      description: |
        Mirrors `collaboration.client_engagement.state`. Both `ended` and
        `revoked` are terminal — see `client-engagement-state.ts`'s own
        state diagram.

    StewardshipPolicy:
      type: string
      enum: [residential]
      description: |
        Mirrors `collaboration.client_engagement.stewardship_policy`. Only
        one value is admitted today — the default residential-service
        policy (collaboration-and-client-sharing.md section 18) making the
        accepted garden model and published deliverables client-exportable,
        while provider-internal notes, drafts, assignments, diagnostics, and
        estimates are not. A second, contractually different policy
        requires explicit product and legal approval.

    ClientEngagement:
      type: object
      additionalProperties: false
      required:
        - id
        - gardenId
        - state
        - stewardshipPolicy
        - clientNotificationsEnabled
        - createdByProfileId
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          $ref: '#/components/schemas/Uuid'
        serviceOrganizationId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Absent when the garden's own owner runs the engagement directly, with no service organization attached.
        state:
          $ref: '#/components/schemas/ClientEngagementState'
        stewardshipPolicy:
          $ref: '#/components/schemas/StewardshipPolicy'
        clientNotificationsEnabled:
          type: boolean
        createdByProfileId:
          $ref: '#/components/schemas/Uuid'
        activatedAt:
          $ref: '#/components/schemas/Timestamp'
        endedAt:
          $ref: '#/components/schemas/Timestamp'
        revokedAt:
          $ref: '#/components/schemas/Timestamp'
        revokedReason:
          type: string
          description: Present only on a revoked engagement, and only when one was given.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    ClientEngagementListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientEngagement'

    CreateClientEngagementRequest:
      type: object
      additionalProperties: false
      required: [gardenId]
      properties:
        gardenId:
          $ref: '#/components/schemas/Uuid'
        serviceOrganizationId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Omit for a garden owner running the engagement directly, with no service organization attached.
        stewardshipPolicy:
          allOf:
            - $ref: '#/components/schemas/StewardshipPolicy'
          description: Defaults to `residential` when omitted.
        clientNotificationsEnabled:
          type: boolean
          description: Defaults to `true` when omitted.

    RevokeClientEngagementRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: Optional free-text reason, stored as `revoked_reason`.

    PublisherGrantState:
      type: string
      enum: [active, revoked]
      description: Mirrors `collaboration.publisher_grant.state`. A two-state machine with one edge (`active -> revoked`); `revoked` is a true terminal.

    PublisherGrant:
      type: object
      additionalProperties: false
      required: [id, engagementId, profileId, state, grantedByProfileId, grantedAt, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        engagementId:
          $ref: '#/components/schemas/Uuid'
        profileId:
          $ref: '#/components/schemas/Uuid'
        state:
          $ref: '#/components/schemas/PublisherGrantState'
        grantedByProfileId:
          $ref: '#/components/schemas/Uuid'
        grantedAt:
          $ref: '#/components/schemas/Timestamp'
        revokedAt:
          $ref: '#/components/schemas/Timestamp'
        revokedByProfileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Present only once `state` is `revoked`.
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    PublisherGrantListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublisherGrant'

    GrantPublisherAccessRequest:
      type: object
      additionalProperties: false
      required: [profileId]
      properties:
        profileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: |
            For an organization-backed engagement, must be an ACTIVE member of
            that same organization. Otherwise, must hold ACTIVE garden
            membership (any role) on the engagement's own garden.

    # --- Client invitation and access grant (P9C-INVITE-01) ---

    ClientAccessGrantState:
      type: string
      enum: [pending, active, revoked, expired]
      description: |
        Mirrors `collaboration.client_access_grant.state`. Unlike
        `InvitationState`, this machine has an `active -> revoked` edge: this
        one row is both the invitation and the client's ongoing portal-access
        grant, so revoking an accepted client's access is the same
        transition as revoking a still-pending invite.

    ClientAccessGrant:
      type: object
      additionalProperties: false
      required: [id, engagementId, state, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        engagementId:
          $ref: '#/components/schemas/Uuid'
        clientProfileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Absent until a real invitation is accepted and binds a profile.
        invitedEmail:
          type: string
          format: email
          description: The email this invitation was bound to. Stays present even after acceptance.
        state:
          $ref: '#/components/schemas/ClientAccessGrantState'
        grantedAt:
          $ref: '#/components/schemas/Timestamp'
        revokedAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    ClientAccessGrantListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientAccessGrant'

    CreateClientInvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: |
            Required — client invitations are always email-bound; no
            anonymous, unbound link exists for this resource.

    AcceptClientInvitationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128

    ClientUpdateState:
      type: string
      enum: [internal_draft, ready_for_client, published, withdrawn]
      description: |
        Mirrors `collaboration.client_update.state`. Strictly linear
        (`publication-state.ts`): `internal_draft -> ready_for_client ->
        published -> withdrawn`, with no edge skipping a step or reaching
        `internal_draft` twice.

    ClientUpdateItemKind:
      type: string
      enum: [work_log, media]
      description: The two kinds a staged `client_update_item` may be — see `addClientUpdateItem`'s own description for why the other two publication-item kinds are not staged.

    PublicationMediaRole:
      type: string
      enum: [before, after, general]
      description: Shared by staged and published media items. `general` is a plain finished-work photo with no before/after counterpart.

    ClientUpdateItem:
      type: object
      additionalProperties: false
      required: [id, clientUpdateId, kind, occurredAt, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        clientUpdateId:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/ClientUpdateItemKind'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        sourceWorkLogId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Present only when `kind` is `work_log`.
        description:
          type: string
          description: Present only when `kind` is `work_log` — curated, client-safe text, independent of the source work log's own words.
        mediaRecordId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Present only when `kind` is `media`.
        mediaRole:
          allOf:
            - $ref: '#/components/schemas/PublicationMediaRole'
          description: Present only when `kind` is `media`.
        caption:
          type: string
          description: Optional, `kind media` only.
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    ClientUpdate:
      type: object
      additionalProperties: false
      required:
        - id
        - engagementId
        - gardenId
        - state
        - title
        - revision
        - createdByProfileId
        - createdAt
        - updatedAt
        - items
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        engagementId:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          $ref: '#/components/schemas/Uuid'
        state:
          $ref: '#/components/schemas/ClientUpdateState'
        title:
          type: string
          minLength: 1
        summary:
          type: string
          description: Required from `ready_for_client` onward (`client_update_summary_required_check`); unset while `internal_draft`.
        revision:
          $ref: '#/components/schemas/Revision'
        createdByProfileId:
          $ref: '#/components/schemas/Uuid'
        submittedAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        publishedByProfileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Present only once `state` is `published` or `withdrawn`. Not necessarily `createdByProfileId` — the publisher is not guaranteed to be the update's own creator.
        withdrawnAt:
          $ref: '#/components/schemas/Timestamp'
        withdrawnByProfileId:
          $ref: '#/components/schemas/Uuid'
        withdrawnReason:
          type: string
          description: Present only on a withdrawn update, and only when one was given.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientUpdateItem'
          description: Currently staged items. Always present, possibly empty.

    ClientUpdateListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientUpdate'

    CreateClientUpdateRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1

    UpdateClientUpdateContentRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
      description: At least one of `title`/`summary` must be supplied.

    AddClientUpdateItemRequest:
      type: object
      additionalProperties: false
      required: [kind, occurredAt]
      properties:
        kind:
          $ref: '#/components/schemas/ClientUpdateItemKind'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        sourceWorkLogId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Required when `kind` is `work_log`.
        description:
          type: string
          minLength: 1
          description: Required when `kind` is `work_log`.
        mediaRecordId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Required when `kind` is `media`.
        mediaRole:
          allOf:
            - $ref: '#/components/schemas/PublicationMediaRole'
          description: Required when `kind` is `media`.
        caption:
          type: string
          minLength: 1
          description: Optional, `kind media` only.

    WithdrawClientUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: Optional free-text reason, stored as `withdrawn_reason`.

    WorkLog:
      type: object
      additionalProperties: false
      required: [id, gardenId, actorProfileId, description, occurredAt, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          $ref: '#/components/schemas/Uuid'
        assignmentId:
          $ref: '#/components/schemas/Uuid'
        taskId:
          $ref: '#/components/schemas/Uuid'
        actorProfileId:
          $ref: '#/components/schemas/Uuid'
        description:
          type: string
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    WorkLogListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkLog'

    PublicationItemKind:
      type: string
      enum: [work_log, media, garden_snapshot, timeline_entry]
      description: Mirrors `collaboration.publication_item.kind` — every published item kind, a strict superset of `ClientUpdateItemKind`.

    PublicationItem:
      type: object
      additionalProperties: false
      required: [id, publicationVersionId, kind, occurredAt, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        publicationVersionId:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/PublicationItemKind'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        description:
          type: string
          description: Present only when `kind` is `work_log`.
        sourceWorkLogId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Present only when `kind` is `work_log`. Provenance only — never re-read to render client content.
        mediaRecordId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Present only when `kind` is `media`.
        mediaRole:
          allOf:
            - $ref: '#/components/schemas/PublicationMediaRole'
          description: Present only when `kind` is `media`.
        caption:
          type: string
          description: Optional, `kind media` only.
        overviewText:
          type: string
          description: Present only when `kind` is `garden_snapshot`.
        snapshotData:
          type: object
          additionalProperties: true
          description: Optional structured supplement, `kind garden_snapshot` only. No fixed shape.
        entryText:
          type: string
          description: Present only when `kind` is `timeline_entry`.
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    PublicationStaffAttribution:
      type: object
      additionalProperties: false
      required: [id, publicationVersionId, staffProfileId, displayName, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        publicationVersionId:
          $ref: '#/components/schemas/Uuid'
        staffProfileId:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          description: A snapshot at publication time — never a live join to the profile's current display name.
        roleLabel:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    PublicationVersion:
      type: object
      additionalProperties: false
      required:
        - id
        - clientUpdateId
        - engagementId
        - gardenId
        - versionNumber
        - title
        - summary
        - clientUpdateRevisionAtPublish
        - publishedAt
        - publishedByProfileId
        - createdAt
        - items
        - staffAttributions
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        clientUpdateId:
          $ref: '#/components/schemas/Uuid'
        engagementId:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          $ref: '#/components/schemas/Uuid'
        versionNumber:
          type: integer
          minimum: 1
        title:
          type: string
        summary:
          type: string
        clientUpdateRevisionAtPublish:
          $ref: '#/components/schemas/Revision'
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        publishedByProfileId:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicationItem'
        staffAttributions:
          type: array
          items:
            $ref: '#/components/schemas/PublicationStaffAttribution'

    PublishGardenSnapshotInput:
      type: object
      additionalProperties: false
      required: [overviewText]
      properties:
        overviewText:
          type: string
          minLength: 1
        snapshotData:
          type: object
          additionalProperties: true

    PublishTimelineEntryInput:
      type: object
      additionalProperties: false
      required: [entryText, occurredAt]
      properties:
        entryText:
          type: string
          minLength: 1
        occurredAt:
          $ref: '#/components/schemas/Timestamp'

    PublishStaffAttributionInput:
      type: object
      additionalProperties: false
      required: [staffProfileId, displayName]
      properties:
        staffProfileId:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          minLength: 1
        roleLabel:
          type: string
          minLength: 1

    PublishClientUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        gardenSnapshot:
          $ref: '#/components/schemas/PublishGardenSnapshotInput'
        timelineEntries:
          type: array
          items:
            $ref: '#/components/schemas/PublishTimelineEntryInput'
        staffAttributions:
          type: array
          items:
            $ref: '#/components/schemas/PublishStaffAttributionInput'
      description: All fields optional — a publication with zero items is valid. Composed directly here, not staged in advance; see `publishClientUpdate`'s own description.

    # --- Client portal (P9C-API-01, tag ClientPortal) ---
    #
    # Every schema below is a DELIBERATELY separate, more restricted shape
    # than its operational counterpart (`PublicationItem`/
    # `PublicationStaffAttribution`/`PublicationVersion`) — never a reuse of
    # the same DTO. Specifically omitted, on purpose, from every shape here:
    # `sourceWorkLogId` (the operational schema's own words: "Provenance
    # only — never re-read to render client content"), `staffProfileId` (an
    # internal profile id; `displayName` is the client-facing snapshot),
    # and `engagementId`/`gardenId`/`clientUpdateId`/`clientUpdateRevisionAtPublish`/
    # `publishedByProfileId` (all operational bookkeeping the caller already
    # implicitly knows from `clientGardenId`, or has no legitimate use for).
    # `mediaRecordId` is kept, renamed `mediaId`, because it is the exact
    # value `getClientMediaAccess`'s own `{mediaId}` path parameter expects —
    # not a secret, since access to it is independently re-verified from the
    # caller's own entitlement on every access request.

    ClientGarden:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: The `clientGardenId` every other `ClientPortal` operation takes.
        name:
          type: string
          description: The garden's current display name, read live (not a publication snapshot) — this is portal navigation, not published content.

    ClientGardenListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientGarden'

    ClientGardenOverview:
      type: object
      additionalProperties: false
      required: [clientGardenId]
      properties:
        clientGardenId:
          $ref: '#/components/schemas/Uuid'
        publicationId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Present only once a `garden_snapshot` has ever been published for this garden.
        overviewText:
          type: string
          description: Present only once a `garden_snapshot` has ever been published for this garden.
        snapshotData:
          type: object
          additionalProperties: true
          description: Optional structured supplement, present only alongside `overviewText`, and only when the publisher supplied one.
        occurredAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Present only alongside `overviewText`.
        publishedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: When the containing publication itself was published. Present only alongside `overviewText`.
      description: All snapshot fields are absent, with `200` and no error, when no `garden_snapshot` has ever been published for this garden — an honest absence, not a failure.

    ClientPublicationItem:
      type: object
      additionalProperties: false
      required: [id, kind, occurredAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/PublicationItemKind'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        description:
          type: string
          description: Present only when `kind` is `work_log` — curated, client-safe text.
        mediaId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Present only when `kind` is `media`. The exact id `getClientMediaAccess`'s own `{mediaId}` path parameter expects.
        mediaRole:
          allOf:
            - $ref: '#/components/schemas/PublicationMediaRole'
          description: Present only when `kind` is `media`.
        caption:
          type: string
          description: Optional, `kind media` only.
        overviewText:
          type: string
          description: Present only when `kind` is `garden_snapshot`.
        snapshotData:
          type: object
          additionalProperties: true
          description: Optional structured supplement, `kind garden_snapshot` only.
        entryText:
          type: string
          description: Present only when `kind` is `timeline_entry`.

    ClientPublicationStaffAttribution:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          description: A snapshot at publication time — never a live join to a profile's current display name.
        roleLabel:
          type: string

    ClientPublicationSummary:
      type: object
      additionalProperties: false
      required: [id, versionNumber, title, summary, publishedAt, items, staffAttributions]
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: The `publicationId` `getClientMediaAccess`'s own path takes.
        versionNumber:
          type: integer
          minimum: 1
        title:
          type: string
        summary:
          type: string
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientPublicationItem'
        staffAttributions:
          type: array
          items:
            $ref: '#/components/schemas/ClientPublicationStaffAttribution'

    ClientPublicationListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientPublicationSummary'

    ClientTimelineEntry:
      type: object
      additionalProperties: false
      required: [publicationId, kind, occurredAt]
      properties:
        publicationId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Which visible publication this fact came from — the same id `listClientPublications` returns as each summary's own `id`.
        kind:
          $ref: '#/components/schemas/PublicationItemKind'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        description:
          type: string
          description: Present only when `kind` is `work_log`.
        mediaId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Present only when `kind` is `media`.
        mediaRole:
          allOf:
            - $ref: '#/components/schemas/PublicationMediaRole'
          description: Present only when `kind` is `media`.
        caption:
          type: string
          description: Optional, `kind media` only.
        overviewText:
          type: string
          description: Present only when `kind` is `garden_snapshot`.
        snapshotData:
          type: object
          additionalProperties: true
          description: Optional structured supplement, `kind garden_snapshot` only.
        entryText:
          type: string
          description: Present only when `kind` is `timeline_entry`.
      description: No version grouping and no title/summary, deliberately — see `getClientTimeline`'s own description for why this differs from `ClientPublicationSummary`.

    ClientTimelineResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientTimelineEntry'
          description: Oldest first — a factual narrative read from the beginning, not a publisher's own newest-first update log.

    # --- Client export/handoff manifest (P9C-EXPORT-01, tag ClientPortal) ---
    #
    # `gardenModel.mapObjects`/`gardenModel.plants` reuse `GardenObject`/`Plant`
    # UNCHANGED — the identical shapes `getGardenMap`/`searchPlants` already
    # return operationally — rather than a second, parallel export-specific
    # shape for the same current-state facts. `georeference` reuses
    # `Georeference` the same way `GardenMapDocument.georeference` does.
    # Deliberately absent from `gardenModel`: garden memberships (operational
    # collaborator identities, not the "garden model" section 18 names) and
    # calibrations (capture-processing diagnostics, explicitly excluded by
    # section 18).

    ClientExportGardenModel:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          lifecycleState,
          revision,
          createdAt,
          updatedAt,
          coordinateSpaceId,
          mapObjects,
          plants,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        lifecycleState:
          $ref: '#/components/schemas/GardenLifecycleState'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        coordinateSpaceId:
          $ref: '#/components/schemas/Uuid'
        georeference:
          $ref: '#/components/schemas/Georeference'
        mapObjects:
          type: array
          items:
            $ref: '#/components/schemas/GardenObject'
          description: Every currently active (non-deleted) map object — the accepted CURRENT state, never soft-deleted history.
        plants:
          type: array
          items:
            $ref: '#/components/schemas/Plant'
      description: |
        The accepted garden model (section 18): current map objects and
        plants, exactly as the operational map/plant reads already expose
        them. Never operational history, drafts, capture proposals, or
        provider-internal notes.

    ClientExportMediaEntry:
      type: object
      additionalProperties: false
      required: [mediaId, access]
      properties:
        mediaId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: The exact id `getClientMediaAccess`'s own `{mediaId}` path parameter expects.
        access:
          $ref: '#/components/schemas/MediaAccess'
      description: One media item this client is genuinely entitled to, re-verified through the identical check `getClientMediaAccess` enforces.

    ClientExportManifest:
      type: object
      additionalProperties: false
      required: [clientGardenId, generatedAt, gardenModel, publications, media]
      properties:
        clientGardenId:
          $ref: '#/components/schemas/Uuid'
        generatedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: When this manifest was read — a fresh read boundary, not a stored package's creation time.
        gardenModel:
          $ref: '#/components/schemas/ClientExportGardenModel'
        publications:
          type: array
          items:
            $ref: '#/components/schemas/ClientPublicationSummary'
          description: Every CURRENTLY published (never withdrawn) update, identical to `listClientPublications`.
        media:
          type: array
          items:
            $ref: '#/components/schemas/ClientExportMediaEntry'
          description: Only media this client is currently entitled to. An item referenced by `publications` but absent here failed the same entitlement check `getClientMediaAccess` would apply — never a distinguishable error.

    SessionLoginRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Freshly obtained Firebase ID token, verified server-side before any cookie is issued.

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: Stable machine-readable detail code.
        pointer:
          type: string
          description: JSON Pointer to the offending member, where the error is structural.
        parameters:
          type: object
          additionalProperties: true
          description: Values interpolated into the localized message. Never free-form prose.

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlationId, retryable]
          properties:
            code:
              type: string
              description: |
                Stable dotted code. Clients localize known errors by this value
                rather than by displaying `message`.
              examples: ['garden.geometry.stale_revision']
            message:
              type: string
              description: Safe fallback text in English. Not a localization source.
            correlationId:
              type: string
              description: Identifier for correlating this response with server telemetry.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            retryable:
              type: boolean
              description: Whether repeating the identical request may succeed later.

    LivenessResult:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [alive]
        version:
          type: string
          description: Build version of the running artifact.

    DependencyStatus:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          examples: ['database']
        status:
          type: string
          enum: [available, unavailable]
        detail:
          type: string
          description: Non-sensitive summary. Never contains connection strings or credentials.

    ReadinessResult:
      type: object
      additionalProperties: false
      required: [status, version, dependencies]
      properties:
        status:
          type: string
          enum: [ready, notReady]
        version:
          type: string
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyStatus'

    CoordinateSpaceKind:
      type: string
      enum: [localPlanarMetres, geographicWgs84]
      description: |
        Which space a geometry's coordinates belong to. Local planar coordinates
        are metres from a garden-specific origin and are never EPSG:4326.

        Source: ADR-0010.

    Position:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
      description: |
        Coordinate pair. In local planar space this is metres east and metres
        north of the garden origin, rounded to 1 mm.

    Geometry:
      oneOf:
        - $ref: '#/components/schemas/PointGeometry'
        - $ref: '#/components/schemas/LineStringGeometry'
        - $ref: '#/components/schemas/PolygonGeometry'
        - $ref: '#/components/schemas/MultiLineStringGeometry'
        - $ref: '#/components/schemas/MultiPolygonGeometry'
      discriminator:
        propertyName: type
        # Without explicit mapping, openapi-typescript sets each branch's
        # discriminator literal to the referenced schema's *name*
        # ("PointGeometry") instead of the actual wire value ("Point"),
        # making the generated type unusable for narrowing real JSON.
        # Confirmed directly: this surfaced building the map module's
        # generated-client consumers.
        mapping:
          Point: '#/components/schemas/PointGeometry'
          LineString: '#/components/schemas/LineStringGeometry'
          Polygon: '#/components/schemas/PolygonGeometry'
          MultiLineString: '#/components/schemas/MultiLineStringGeometry'
          MultiPolygon: '#/components/schemas/MultiPolygonGeometry'

    PointGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          $ref: '#/components/schemas/Position'

    LineStringGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [LineString]
        coordinates:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Position'

    PolygonGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          minItems: 1
          description: First ring is the exterior ring; any further rings are holes.
          items:
            type: array
            minItems: 4
            items:
              $ref: '#/components/schemas/Position'

    MultiLineStringGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [MultiLineString]
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 2
            items:
              $ref: '#/components/schemas/Position'

    MultiPolygonGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [MultiPolygon]
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items:
              type: array
              minItems: 4
              items:
                $ref: '#/components/schemas/Position'

    ProvenanceKind:
      type: string
      enum:
        - manualDrawing
        - userMeasurement
        - importedPlan
        - importedMapImagery
        - arMeasurement
        - imageExtraction
        - depthCapture
        - externalProvider
        - processor
      description: |
        How a piece of geometry came to exist. Generated results additionally
        reference processor and model versions elsewhere in the record.

        Source: architecture/data-and-geospatial-design.md, section "12. Provenance".

    CurveMetadata:
      type: object
      additionalProperties: false
      required: [kind, controlPoints, chordDeviationMetres]
      description: |
        Advisory. Consumers that ignore this still receive correct geometry from
        the densified `geometry` member.
      properties:
        kind:
          type: string
          enum: [cubicBezier]
        controlPoints:
          type: array
          minItems: 4
          items:
            $ref: '#/components/schemas/Position'
        chordDeviationMetres:
          type: number
          exclusiveMinimum: 0

    GeometryEnvelope:
      type: object
      additionalProperties: false
      required: [geometry, coordinateSpaceId, coordinateSpaceKind, provenance]
      description: |
        The only form in which geometry crosses this API. A bare GeoJSON object
        is never sufficient, because it cannot state its coordinate space.
      properties:
        geometry:
          $ref: '#/components/schemas/Geometry'
        coordinateSpaceId:
          $ref: '#/components/schemas/Uuid'
        coordinateSpaceKind:
          $ref: '#/components/schemas/CoordinateSpaceKind'
        provenance:
          $ref: '#/components/schemas/ProvenanceKind'
        curve:
          $ref: '#/components/schemas/CurveMetadata'
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Absent means "not expressed", not "certain".

    GardenObjectCategory:
      type: string
      enum:
        - lot
        - structure
        - fence
        - gate
        - path
        - zone
        - bed
        - waterFeature
        - utilityExclusion
        - tree
        - plant
        - annotation
        - importedBackground
      description: |
        Source: architecture/map-rendering-and-editing.md, section
        "4. Canonical Object Categories".

    MeasurementUnit:
      type: string
      enum: [metres, squareMetres, degrees]

    MeasurementAcquisitionMethod:
      type: string
      enum:
        - userEntered
        - derivedFromGeometry
        - arMeasurement
        - imageExtraction
        - depthCapture
        - importedPlan

    Measurement:
      type: object
      additionalProperties: false
      required: [value, unit, acquisitionMethod]
      description: |
        The schema must not imply survey accuracy merely because a value
        uses a precise numeric type — every measurement carries how it was
        acquired.

        Source: architecture/data-and-geospatial-design.md, section
        "11. Measurements and Uncertainty".
      properties:
        value:
          type: number
          description: Canonical SI value in `unit`.
        unit:
          $ref: '#/components/schemas/MeasurementUnit'
        acquisitionMethod:
          $ref: '#/components/schemas/MeasurementAcquisitionMethod'
        originalEntry:
          type: string
          description: As the user typed it, before conversion — for example "40 ft".
        uncertainty:
          type: number
          description: Absolute uncertainty in the same unit as `value`.
        referenceObjectId:
          $ref: '#/components/schemas/Uuid'
        calibrationRevision:
          $ref: '#/components/schemas/Revision'

    StructureDetails:
      type: object
      additionalProperties: false
      required: [category, structureKind]
      properties:
        category:
          type: string
          enum: [structure]
        structureKind:
          type: string
          enum: [house, shed, greenhouse, deck, garage, other]
        heightMetres:
          type: number
          exclusiveMinimum: 0

    FenceDetails:
      type: object
      additionalProperties: false
      required: [category, fenceKind]
      properties:
        category:
          type: string
          enum: [fence]
        fenceKind:
          type: string
          enum: [wood, chainLink, vinyl, metal, hedge, other]
        heightMetres:
          type: number
          exclusiveMinimum: 0

    GateDetails:
      type: object
      additionalProperties: false
      required: [category, fenceObjectId]
      description: A gate is always positioned along exactly one fence.
      properties:
        category:
          type: string
          enum: [gate]
        fenceObjectId:
          $ref: '#/components/schemas/Uuid'
        widthMetres:
          type: number
          exclusiveMinimum: 0

    ZoneDetails:
      type: object
      additionalProperties: false
      required: [category, zoneKind]
      properties:
        category:
          type: string
          enum: [zone]
        zoneKind:
          type: string
          enum: [lawn, garden, mulch, gravel, groundCover, other]

    BedDetails:
      type: object
      additionalProperties: false
      required: [category, bedKind]
      properties:
        category:
          type: string
          enum: [bed]
        bedKind:
          type: string
          enum: [inGround, raised, container]
        soilNotes:
          type: string
          maxLength: 2000

    TreeDetails:
      type: object
      additionalProperties: false
      required: [category]
      description: |
        The canopy is a second, optional geometry — distinct from the trunk
        position carried by the object's own `geometryEnvelope`.
      properties:
        category:
          type: string
          enum: [tree]
        canopyGeometry:
          $ref: '#/components/schemas/Geometry'
        commonName:
          type: string
          maxLength: 200
        estimatedHeightMetres:
          type: number
          exclusiveMinimum: 0
        estimatedSpreadMetres:
          type: number
          exclusiveMinimum: 0

    PlantPlacementDetails:
      type: object
      additionalProperties: false
      required: [category, commonName, quantity]
      description: |
        Deliberately without a plant-catalog reference: the species and care
        catalog is Phase 4 scope.
      properties:
        category:
          type: string
          enum: [plant]
        commonName:
          type: string
          minLength: 1
          maxLength: 200
        quantity:
          type: integer
          minimum: 1
        spacingMetres:
          type: number
          exclusiveMinimum: 0
        assignedToObjectId:
          $ref: '#/components/schemas/Uuid'

    UtilityExclusionDetails:
      type: object
      additionalProperties: false
      required: [category, utilityExclusionKind]
      properties:
        category:
          type: string
          enum: [utilityExclusion]
        utilityExclusionKind:
          type: string
          enum: [undergroundUtility, septicField, wellRadius, setback, other]
        notes:
          type: string
          maxLength: 2000

    AnnotationDetails:
      type: object
      additionalProperties: false
      required: [category]
      description: Where a `Measurement` attaches — the "Annotation and measurement reference" category.
      properties:
        category:
          type: string
          enum: [annotation]
        measurement:
          $ref: '#/components/schemas/Measurement'

    ImportedBackgroundCalibration:
      type: object
      additionalProperties: false
      required:
        [
          transformRevision,
          pageAspectRatio,
          knownDistance,
          referencePoints,
          transform,
          rmsErrorMetres,
        ]
      description: |
        The server-owned calibration block a CALIBRATED background's
        details carry (P6-PLAN-02): the full inputs (so recalibration can
        re-derive and re-display them), the derived transform, and the
        honest error report. Sourced from the background's latest
        `gardens_mapping.calibration` revision — the single storage of
        transforms; the details table stores only the state flag.
      properties:
        transformRevision:
          allOf:
            - $ref: '#/components/schemas/Revision'
          description: |
            Monotonically increasing per background — "recalibration
            creates a new background transform revision" (section 16).
            Distinct from the object's own optimistic-concurrency
            `revision`, which bumps on EVERY edit: a consumer that cached
            traced geometry can tell "the background moved under me" (this
            changed) apart from ordinary edits.
        pageAspectRatio:
          type: number
          exclusiveMinimum: 0
        knownDistance:
          $ref: '#/components/schemas/PlanKnownDistance'
        referencePoints:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [planPoint, localMetres, residualMetres]
            properties:
              planPoint:
                $ref: '#/components/schemas/PlanPoint'
              localMetres:
                $ref: '#/components/schemas/Position'
              residualMetres:
                type: number
                minimum: 0
                description: Distance in metres between this control point's mapped plan point and its stated local point, under the stored transform.
        manualAdjustment:
          $ref: '#/components/schemas/ManualCalibrationAdjustment'
        transform:
          $ref: '#/components/schemas/PlanTransform'
        rmsErrorMetres:
          type: [number, 'null']
          description: |
            Aggregate root-mean-square of the per-point residuals. `null`
            ("not expressed") below two control points — a one-point fit
            is exact by construction, and reporting zero for it would be
            false precision (section 16).

    ImportedBackgroundDetails:
      type: object
      additionalProperties: false
      required: [category, planMediaId, isBackgroundVisible, calibrationState]
      description: |
        The non-authoritative background asset a plan import produces
        (architecture/map-rendering-and-editing.md, section "16. Plan Import
        and Calibration"). Added by P6-PLAN-01: before it, this category
        carried no `details` member at all. The object's own Polygon geometry
        is its placeholder placement in garden-local space until calibration
        exists (P6-PLAN-02).
      properties:
        category:
          type: string
          enum: [importedBackground]
        planMediaId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: |
            The `imported_plan` media record (the original document) this
            background displays. Validated server-side to reference an
            `available` + `processed` media record of class `imported_plan`
            in the same garden.
        sourcePageNumber:
          type: integer
          minimum: 1
          description: |
            1-based page of a multi-page (PDF) source. Absent — equivalent
            to 1 — for a raster plan. A value above 1 is only accepted for a
            PDF-classed source. PDF pages cannot render yet (P6-WORKER-02's
            documented deferral), so this models the plan-import flow's
            page-selection step honestly rather than driving rendering.
        isBackgroundVisible:
          type: boolean
          description: |
            Per-background persisted visibility — "Plan backgrounds are ...
            independently hideable" (Phase 6 exit criterion). Distinct from
            the client-local layer-visibility preference, which hides every
            imported background at once and resets on reload.
        calibrationState:
          type: string
          enum: [uncalibrated, calibrated]
          description: |
            Server-owned. `createObject` requires `uncalibrated`;
            `changeProperties` must echo the current stored state — only
            the `upsertCalibration` command changes it. There is
            deliberately no intermediate or quality-graded state: quality
            is the continuous `calibration.rmsErrorMetres` (including its
            honest absence below two control points), not a threshold
            bucket ("displays calibration quality and prevents false
            precision" — section 16).
        calibration:
          allOf:
            - $ref: '#/components/schemas/ImportedBackgroundCalibration'
          description: |
            Present exactly when `calibrationState` is `calibrated`.
            READ-ONLY: server-populated from the background's latest
            calibration revision. A `createObject`/`changeProperties`
            payload that echoes it back is ignored — the server always
            preserves its own stored block; only the `upsertCalibration`
            command produces a new revision.

    GardenObjectDetails:
      oneOf:
        - $ref: '#/components/schemas/StructureDetails'
        - $ref: '#/components/schemas/FenceDetails'
        - $ref: '#/components/schemas/GateDetails'
        - $ref: '#/components/schemas/ZoneDetails'
        - $ref: '#/components/schemas/BedDetails'
        - $ref: '#/components/schemas/TreeDetails'
        - $ref: '#/components/schemas/PlantPlacementDetails'
        - $ref: '#/components/schemas/UtilityExclusionDetails'
        - $ref: '#/components/schemas/AnnotationDetails'
        - $ref: '#/components/schemas/ImportedBackgroundDetails'
      discriminator:
        propertyName: category
        # See Geometry's discriminator comment: mapping to the actual wire
        # values, not schema names, is required for the generated type to
        # narrow real JSON correctly.
        mapping:
          structure: '#/components/schemas/StructureDetails'
          fence: '#/components/schemas/FenceDetails'
          gate: '#/components/schemas/GateDetails'
          zone: '#/components/schemas/ZoneDetails'
          bed: '#/components/schemas/BedDetails'
          tree: '#/components/schemas/TreeDetails'
          plant: '#/components/schemas/PlantPlacementDetails'
          utilityExclusion: '#/components/schemas/UtilityExclusionDetails'
          annotation: '#/components/schemas/AnnotationDetails'
          importedBackground: '#/components/schemas/ImportedBackgroundDetails'
      description: |
        Present only for categories that have specialized fields. `lot`,
        `path`, and `waterFeature` carry no `details` member.
        `importedBackground` gained its `ImportedBackgroundDetails` member
        in P6-PLAN-01.

    GardenObjectLifecycleState:
      type: string
      enum: [active, deleted]

    GardenObject:
      type: object
      additionalProperties: false
      required:
        [id, gardenId, category, geometryEnvelope, lifecycleState, revision, createdAt, updatedAt]
