    JoinLineworkCommand:
      type: object
      additionalProperties: false
      required:
        [
          type,
          firstObjectId,
          firstExpectedRevision,
          secondObjectId,
          secondExpectedRevision,
          resultObjectId,
        ]
      properties:
        type:
          type: string
          enum: [joinLinework]
        firstObjectId:
          $ref: '#/components/schemas/Uuid'
        firstExpectedRevision:
          $ref: '#/components/schemas/Revision'
        secondObjectId:
          $ref: '#/components/schemas/Uuid'
        secondExpectedRevision:
          $ref: '#/components/schemas/Revision'
        resultObjectId:
          $ref: '#/components/schemas/Uuid'

    ChangePropertiesCommand:
      type: object
      additionalProperties: false
      required: [type, objectId, expectedRevision]
      properties:
        type:
          type: string
          enum: [changeProperties]
        objectId:
          $ref: '#/components/schemas/Uuid'
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        label:
          type: string
          maxLength: 200
        categoryDetails:
          $ref: '#/components/schemas/GardenObjectDetails'

    AssignPlantCommand:
      type: object
      additionalProperties: false
      required: [type, plantObjectId, expectedRevision, targetObjectId]
      properties:
        type:
          type: string
          enum: [assignPlant]
        plantObjectId:
          $ref: '#/components/schemas/Uuid'
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        targetObjectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: '`null` unassigns the plant from any zone or bed.'

    PlanPoint:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
      description: |
        A point on an imported plan page in plan-fraction units: pixel x
        AND pixel y each divided by the displayed rendition's WIDTH (y
        down, image convention). Resolution-independent, because every
        derivative preserves the page's aspect ratio — the same `[u, v]`
        names the same ink on the screen preview, the high-resolution
        image, or the original. `u` runs 0..1; `v` runs 0..pageAspectRatio.
        See `calibration.ts` in `@verdery/geometry-contracts` for the full
        convention.

    PlanKnownDistance:
      type: object
      additionalProperties: false
      required: [pointA, pointB, distanceMetres]
      description: Two plan points and the real-world distance between them — the uniform-scale source (section 16, "one known-distance segment").
      properties:
        pointA:
          $ref: '#/components/schemas/PlanPoint'
        pointB:
          $ref: '#/components/schemas/PlanPoint'
        distanceMetres:
          type: number
          exclusiveMinimum: 0

    ManualCalibrationAdjustment:
      type: object
      additionalProperties: false
      required: [rotationRadians, translationMetres]
      description: |
        The section-16 "manual origin and orientation adjustment", stored
        as INPUT (rotate about the local origin, then translate — composed
        on top of the fitted transform) so recalibration re-derives it
        instead of overwriting a transform.
      properties:
        rotationRadians:
          type: number
        translationMetres:
          type: object
          additionalProperties: false
          required: [dx, dy]
          properties:
            dx:
              type: number
            dy:
              type: number

    PlanTransform:
      type: object
      additionalProperties: false
      required: [metresPerPlanUnit, rotationRadians, translationMetres]
      description: |
        The derived plan-space → local-space SIMILARITY transform (uniform
        scale + rotation + translation):
        `local = translationMetres + metresPerPlanUnit · R(rotationRadians) · (u, −v)`.
        Deliberately not a 6-DOF affine — shear would absorb input noise
        and manufacture precision (section 16, "prevents false
        precision"). Always server-derived, never client-authored.
      properties:
        metresPerPlanUnit:
          type: number
          exclusiveMinimum: 0
          description: Metres per plan-fraction unit, i.e. the page's full width in metres.
        rotationRadians:
          type: number
          description: Counter-clockwise rotation in local space, normalized to (−π, π].
        translationMetres:
          type: object
          additionalProperties: false
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number

    CalibrationReferencePoint:
      type: object
      additionalProperties: false
      required: [planPoint, localMetres]
      description: One control point — a plan point paired with the local-space point it must land on.
      properties:
        planPoint:
          $ref: '#/components/schemas/PlanPoint'
        localMetres:
          $ref: '#/components/schemas/Position'

    UpsertCalibrationCommand:
      type: object
      additionalProperties: false
      required:
        [
          type,
          backgroundObjectId,
          expectedRevision,
          pageAspectRatio,
          knownDistance,
          referencePoints,
        ]
      description: |
        Calibrates (or recalibrates) an imported background from the full
        section-16 input set. The server derives the transform, per-point
        residuals, aggregate RMS, and the background's page-footprint
        geometry — a client never submits a transform. Revision-guarded
        like every object-mutating command, because applying a calibration
        rewrites the background object's details and geometry. Reshaped by
        P6-PLAN-02 from its P3 reference-points-only scaffold (which no
        client ever submitted).
      properties:
        type:
          type: string
          enum: [upsertCalibration]
        backgroundObjectId:
          $ref: '#/components/schemas/Uuid'
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        pageAspectRatio:
          type: number
          exclusiveMinimum: 0
          description: Page height / width, measured by the client from the displayed raster (the API exposes no raster dimensions).
        knownDistance:
          $ref: '#/components/schemas/PlanKnownDistance'
        referencePoints:
          type: array
          maxItems: 32
          description: Optional control points — may be empty; a known distance plus manual placement is a legitimate calibration.
          items:
            $ref: '#/components/schemas/CalibrationReferencePoint'
        manualAdjustment:
          $ref: '#/components/schemas/ManualCalibrationAdjustment'

    DecideProposalCommand:
      type: object
      additionalProperties: false
      required: [type, proposalId, decision]
      properties:
        type:
          type: string
          enum: [decideProposal]
        proposalId:
          $ref: '#/components/schemas/Uuid'
        decision:
          $ref: '#/components/schemas/ProposalDecision'
        editedGeometry:
          $ref: '#/components/schemas/Geometry'
          description: Required only for `modifyAndAccept`.

    DeleteObjectCommand:
      type: object
      additionalProperties: false
      required: [type, objectId, expectedRevision]
      properties:
        type:
          type: string
          enum: [deleteObject]
        objectId:
          $ref: '#/components/schemas/Uuid'
        expectedRevision:
          $ref: '#/components/schemas/Revision'

    RestoreObjectCommand:
      type: object
      additionalProperties: false
      required: [type, objectId, expectedRevision]
      properties:
        type:
          type: string
          enum: [restoreObject]
        objectId:
          $ref: '#/components/schemas/Uuid'
        expectedRevision:
          $ref: '#/components/schemas/Revision'

    DuplicateObjectCommand:
      type: object
      additionalProperties: false
      required: [type, sourceObjectId, newObjectId, offsetMetres]
      properties:
        type:
          type: string
          enum: [duplicateObject]
        sourceObjectId:
          $ref: '#/components/schemas/Uuid'
        newObjectId:
          $ref: '#/components/schemas/Uuid'
        offsetMetres:
          type: object
          additionalProperties: false
          required: [dx, dy]
          properties:
            dx:
              type: number
            dy:
              type: number

    MapCommandPayload:
      oneOf:
        - $ref: '#/components/schemas/CreateMapObjectCommand'
        - $ref: '#/components/schemas/MoveObjectCommand'
        - $ref: '#/components/schemas/ReplaceGeometryCommand'
        - $ref: '#/components/schemas/EditVertexCommand'
        - $ref: '#/components/schemas/SplitLineworkCommand'
        - $ref: '#/components/schemas/JoinLineworkCommand'
        - $ref: '#/components/schemas/ChangePropertiesCommand'
        - $ref: '#/components/schemas/AssignPlantCommand'
        - $ref: '#/components/schemas/UpsertCalibrationCommand'
        - $ref: '#/components/schemas/DecideProposalCommand'
        - $ref: '#/components/schemas/DeleteObjectCommand'
        - $ref: '#/components/schemas/RestoreObjectCommand'
        - $ref: '#/components/schemas/DuplicateObjectCommand'
      discriminator:
        propertyName: type
        # See Geometry's discriminator comment: mapping to the actual wire
        # values, not schema names, is required for the generated type to
        # narrow real JSON correctly.
        mapping:
          createObject: '#/components/schemas/CreateMapObjectCommand'
          moveObject: '#/components/schemas/MoveObjectCommand'
          replaceGeometry: '#/components/schemas/ReplaceGeometryCommand'
          editVertex: '#/components/schemas/EditVertexCommand'
          splitLinework: '#/components/schemas/SplitLineworkCommand'
          joinLinework: '#/components/schemas/JoinLineworkCommand'
          changeProperties: '#/components/schemas/ChangePropertiesCommand'
          assignPlant: '#/components/schemas/AssignPlantCommand'
          upsertCalibration: '#/components/schemas/UpsertCalibrationCommand'
          decideProposal: '#/components/schemas/DecideProposalCommand'
          deleteObject: '#/components/schemas/DeleteObjectCommand'
          restoreObject: '#/components/schemas/RestoreObjectCommand'
          duplicateObject: '#/components/schemas/DuplicateObjectCommand'

    MapCommandRequest:
      type: object
      additionalProperties: false
      required: [commandId, clientTimestamp, payload]
      properties:
        commandId:
          $ref: '#/components/schemas/Uuid'
        clientTimestamp:
          $ref: '#/components/schemas/Timestamp'
        payload:
          $ref: '#/components/schemas/MapCommandPayload'

    MapCommandResult:
      type: object
      additionalProperties: false
      required: [affectedObjects]
      properties:
        affectedObjects:
          type: array
          items:
            $ref: '#/components/schemas/GardenObject'

    # --- Garden context facts (P9D-CONTEXT-01, tag GardenContext) -----

    GardenContextKind:
      type: string
      enum: [sun_exposure, soil_type, drainage, irrigation_method, growing_context, microclimate]
      description: |
        Which aspect of the garden's physical growing environment this fact
        describes. Matches `context_kind` in
        migrations/1787000000000_garden-context-facts.sql exactly — enum
        values are the same snake_case string this service uses internally,
        not translated to camelCase (unlike the older `GardenLifecycleState`
        precedent; this contract's more recent additions, such as
        `ClientUpdateState`, already expose snake_case enum values directly).

    GardenContextSource:
      type: string
      enum: [user_declared, horticulturally_reviewed_default, imported]
      description: |
        How a context fact's value was obtained. `horticulturally_reviewed_default`
        additionally requires `reviewedBy`/`reviewedOn` on the same fact —
        FR-22: "The source and quality of each context type must be
        understood before it influences high-impact guidance."

    GardenContextFact:
      type: object
      additionalProperties: false
      required:
        [
          id,
          gardenId,
          contextKind,
          value,
          source,
          recordedByProfileId,
          recordedAt,
          revision,
          createdAt,
          updatedAt,
        ]
      description: |
        One reviewed or declared fact about a garden's physical growing
        environment. One row per `(gardenId, contextKind)`; recording the
        same `contextKind` again updates this same fact in place rather
        than creating a second one.

        Source: implementation-plan.md §18.2, work package P9D-CONTEXT-01;
        technical-specification.md FR-22 ("Garden Context").
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          $ref: '#/components/schemas/Uuid'
        contextKind:
          $ref: '#/components/schemas/GardenContextKind'
        value:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            The declared value. For `sun_exposure`: `full_sun` |
            `partial_sun` | `partial_shade` | `full_shade`. For `drainage`:
            `well_drained` | `poor_drainage` | `waterlogged`. For
            `irrigation_method`: `manual` | `drip` | `sprinkler` | `none`.
            For `growing_context`: `open_ground` | `container` |
            `greenhouse`. For `soil_type`/`microclimate`: free text, the
            same latitude `BedDetails.soilNotes` already takes.
        source:
          $ref: '#/components/schemas/GardenContextSource'
        reviewedBy:
          type: string
          description: Human reviewer name or identifier. Present only when `source` is `horticulturally_reviewed_default`.
        reviewedOn:
          type: string
          format: date
          description: Calendar date of horticultural sign-off. Present only when `source` is `horticulturally_reviewed_default`.
        recordedByProfileId:
          $ref: '#/components/schemas/Uuid'
          description: Who declared or imported this fact. Always present, distinct from `reviewedBy`, a human reviewer name not necessarily tied to a profile.
        recordedAt:
          $ref: '#/components/schemas/Timestamp'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    GardenContextFactListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GardenContextFact'

    RecordGardenContextFactRequest:
      type: object
      additionalProperties: false
      required: [value, source]
      description: '`contextKind` travels in the path (`PUT /gardens/{gardenId}/context/{contextKind}`), not in this body.'
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 2000
        source:
          $ref: '#/components/schemas/GardenContextSource'
        reviewedBy:
          type: string
          minLength: 1
          maxLength: 200
        reviewedOn:
          type: string
          format: date

    PlantGroupingKind:
      type: string
      enum: [individual, row, group]
      description: Whether `Plant` tracks a single instance, a row, or a group as one record.

    PlantAcquisitionDateType:
      type: string
      enum: [planted, sown, acquired]

    PlantLifecycleStage:
      type: string
      enum:
        - planned
        - seed
        - seedling
        - transplanted
        - growing
        - flowering
        - fruiting
        - ready_to_harvest
      description: |
        No ordering is enforced: any stage is reachable from any other, and
        transitioning to the stage already held is accepted as a legitimate,
        if inert, command.

    PlantStatus:
      type: string
      enum: [active, dormant, archived, removed, dead]
      description: |
        The axis orthogonal to `PlantLifecycleStage`. There is no hard-delete
        command for a plant — removing one from active inventory is a
        transition to `removed` or `dead` here.

    TaxonomySource:
      type: string
      enum: [system_catalog, user_defined]
      description: Whether a taxonomy reference was seeded independently of any profile, or defined by one.

    TaxonomyNameKind:
      type: string
      enum: [accepted_scientific, synonym_scientific, common, cultivar]
      description: |
        Which name form matched a search query (P11-SEARCH-01). `accepted_scientific`/
        `common` represent a match against the taxonomy reference's own
        `scientificName`/`commonName`; `synonym_scientific`/`cultivar` represent a
        match against a `plants_inventory.taxonomy_name` row.

    TaxonomyNameMatch:
      type: object
      additionalProperties: false
      required: [nameKind, nameText, locale]
      description: Which name form a search query actually matched, and its own text — never fabricated for a plain (query-less) listing, where `matchedName` is `null` instead.
      properties:
        nameKind:
          $ref: '#/components/schemas/TaxonomyNameKind'
        nameText:
          type: string
        locale:
          type: [string, 'null']

    Plant:
      type: object
      additionalProperties: false
      required:
        [
          id,
          gardenId,
          gardenAreaMapObjectId,
          placementMapObjectId,
          displayName,
          taxonomyReferenceId,
          varietyLabel,
          acceptedIdentificationId,
          acquisitionDate,
          acquisitionDateType,
          groupingKind,
          quantity,
          lifecycleStage,
          status,
          conditionNote,
          careGuidanceNote,
          coverMediaId,
          revision,
          createdByProfileId,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          $ref: '#/components/schemas/Uuid'
        gardenAreaMapObjectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        placementMapObjectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        taxonomyReferenceId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        varietyLabel:
          type: [string, 'null']
        acceptedIdentificationId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        acquisitionDate:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        acquisitionDateType:
          oneOf:
            - $ref: '#/components/schemas/PlantAcquisitionDateType'
            - type: 'null'
        groupingKind:
          $ref: '#/components/schemas/PlantGroupingKind'
        quantity:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        lifecycleStage:
          $ref: '#/components/schemas/PlantLifecycleStage'
        status:
          $ref: '#/components/schemas/PlantStatus'
        conditionNote:
          type: [string, 'null']
        careGuidanceNote:
          type: [string, 'null']
        coverMediaId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: >
            The plant's cover photo for list/summary display: its primary
            photo's media id if one is set, else its oldest photo's, else
            null when it has none. Only `searchPlants` populates this
            (a bulk lookup done for the whole result page); every other
            operation returning a Plant leaves it null, matching that
            operation's `toPlantResource` call with no cover-lookup argument
            — resolve the full gallery via `listPlantPhotos` instead.
        revision:
          $ref: '#/components/schemas/Revision'
        createdByProfileId:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    PlantListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plant'
        nextCursor:
          type: string
          description: Opaque continuation token. Absent when no further page exists.

    PlantPhoto:
      type: object
      additionalProperties: false
      required: [id, plantId, mediaId, isPrimary, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        plantId:
          $ref: '#/components/schemas/Uuid'
        mediaId:
          $ref: '#/components/schemas/Uuid'
        isPrimary:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    PlantIdentification:
      type: object
      additionalProperties: false
      required:
        [
          id,
          plantId,
          plantPhotoId,
          confidenceScore,
          createdAt,
          suggestedTaxonomy,
          suggestedCommonName,
          suggestedScientificName,
          suggestedVarietyLabel,
          suggestedLifecycleStage,
          suggestedConditionNote,
          suggestedCareGuidanceNote,
          suggestedAcquisitionDate,
        ]
      description: >
        A photo-identification suggestion `AddPlantFromPhoto` created, as long
        as it is still pending (not yet accepted via
        `ConfirmPlantIdentification`). Source: plants-inventory/application/
        get-plant-identification.ts, ADR-0015.

        `suggestedTaxonomy`, and the `(suggestedCommonName,
        suggestedScientificName)` pair, are mutually exclusive: never both
        non-null. Either the AI's name matched this application's own
        taxonomy catalog (`suggestedTaxonomy` set, the raw pair null), or it
        didn't (`suggestedTaxonomy` null, the raw pair carries the AI's own
        name guess so it is not silently discarded), or the AI was not
        confident/available at all (everything null).

        `suggestedVarietyLabel`/`suggestedLifecycleStage` come from the same
        species-identification pass; `suggestedConditionNote`/
        `suggestedCareGuidanceNote` come from a separate condition-analysis
        pass over the same photo. All four are independent of the
        taxonomy/name mutual-exclusivity above and of each other — any
        subset may be non-null. `ConfirmPlantIdentification` only applies
        each one to the plant when the plant's own corresponding field is
        still at its creation default, never overwriting a manual edit.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        plantId:
          $ref: '#/components/schemas/Uuid'
        plantPhotoId:
          $ref: '#/components/schemas/Uuid'
        confidenceScore:
          type: number
          minimum: 0
          maximum: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        suggestedTaxonomy:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, scientificName, commonName]
              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
                scientificName:
                  type: string
                commonName:
                  type: [string, 'null']
            - type: 'null'
          description: 'Null when the identification pass found no confident candidate, or a confident candidate had no catalog match (see suggestedCommonName in that case).'
        suggestedCommonName:
          type: [string, 'null']
          description: >
            The AI's own raw common-name guess, when it was confident but
            `suggestedTaxonomy` is null because the catalog has no matching
            entry. `ConfirmPlantIdentification` uses this to name the plant
            directly when there is no taxonomy row to link.
        suggestedScientificName:
          type: [string, 'null']
          description: "The AI's own raw scientific-name guess, alongside suggestedCommonName under the same condition."
        suggestedVarietyLabel:
          type: [string, 'null']
          description: "The AI's own variety guess (e.g. 'Roma' for a tomato), when visually confident."
        suggestedLifecycleStage:
          oneOf:
            - $ref: '#/components/schemas/PlantLifecycleStage'
            - type: 'null'
          description: "The AI's own growth-stage guess, when visually confident. Never `planned` — that stage describes a plant not yet started, which a photo cannot show."
        suggestedConditionNote:
          type: [string, 'null']
          description: 'A stress/disease/pest observation from a separate condition-analysis pass over the same photo, or null when unavailable.'
        suggestedCareGuidanceNote:
          type: [string, 'null']
          description: 'A general care suggestion (watering, light, pruning) from the same condition-analysis pass, or null when it had nothing specific to add. Never chemicals, pesticides, fertilizers, or dosages.'
        suggestedAcquisitionDate:
          type: [string, 'null']
          format: date
          description: "The AI's own approximate acquisition-date guess, estimated from visible maturity, when confident. `ConfirmPlantIdentification` only applies it when the plant's own acquisitionDate is still null, defaulting acquisitionDateType to 'acquired' when that is also still unset."

    TaxonomyReference:
      type: object
      additionalProperties: false
      required:
        [
          id,
          scientificName,
          commonName,
          varietyName,
          source,
          createdByProfileId,
          createdAt,
          matchedName,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        scientificName:
          type: string
        commonName:
          type: [string, 'null']
        varietyName:
          type: [string, 'null']
        source:
          $ref: '#/components/schemas/TaxonomySource'
        createdByProfileId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        matchedName:
          description: |
            Which name form a text search query matched (P11-SEARCH-01) — a
            synonym, cultivar, or localized common name from
            `plants_inventory.taxonomy_name`, or the reference's own
            `scientificName`/`commonName`. `null` for a plain (query-less)
            listing, and for every OTHER caller of this schema (e.g.
            `PlantIdentification.suggestedTaxonomy`), which is not itself a
            search result.
          oneOf:
            - $ref: '#/components/schemas/TaxonomyNameMatch'
            - type: 'null'

    TaxonomyReferenceListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyReference'

    PlantPhotoListResult:
      type: object
      additionalProperties: false
      required: [items]
      description: "Every photo attached to a plant, primary first, then oldest first. No pagination — a plant's photo count is always small, matching TaxonomyReferenceListResult's own unpaginated shape."
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlantPhoto'

    AddPlantRequest:
