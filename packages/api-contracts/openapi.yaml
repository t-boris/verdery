  /gardens/{gardenId}/plant-candidates/{candidateId}/convert:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: candidateId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: convertCandidate
      tags: [PlantCandidates]
      summary: Convert a candidate into an actual plant
      description: |
        An explicit, idempotent, revision-aware command — never a status
        flag flip. `candidate_conversion`'s `UNIQUE (candidateId)` is the
        authoritative at-most-once guard structurally, beneath this
        command's own revision check. Preserves the original candidate,
        linked as converted, never deleted.

        Source: implementation-plan.md work package P11-API-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertCandidateRequest'
      responses:
        '201':
          description: The new plant, the converted candidate, and the conversion record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertCandidateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
