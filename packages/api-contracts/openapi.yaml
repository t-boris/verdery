        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: plantId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: plantPhotoId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: setPrimaryPlantPhoto
      tags: [Plants]
      summary: Set a plant's primary photo
      description: |
        Clears any existing primary photo for this plant, then marks this one
        primary, in the same transaction. Does not change the plant's own
        revision, so this command carries no `If-Match` precondition, the
        same as `AttachPlantPhoto`.

        Source: implementation-plan.md work packages P4-BE-01, P4-CONTRACT-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The now-primary photo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantPhoto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /gardens/{gardenId}/plants/{plantId}/identification:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: plantId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getPlantIdentification
      tags: [Plants]
      summary: Get a plant's pending photo-identification suggestion
      description: |
        Returns the plant's most recent `AddPlantFromPhoto` suggestion —
        name and confidence, resolved from `suggestedTaxonomyId` when it
        matched this application's own taxonomy catalog, or carried raw as
        `suggestedCommonName`/`suggestedScientificName` when the AI was
        confident but the catalog had no match — as long as it is still
        pending. Once confirmed via `ConfirmPlantIdentification`, or when
        the plant has no identification at all, this is `404`: there is
        nothing left to review.

        Source: ADR-0015.
      responses:
        '200':
          description: The pending identification suggestion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantIdentification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/plants/{plantId}/identification/{identificationId}/confirm:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: plantId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: identificationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: confirmPlantIdentification
      tags: [Plants]
      summary: Confirm a photo-identification suggestion
      description: |
        Accepts a prior `plant_identification` suggestion, setting the
        plant's `taxonomyReferenceId` and `acceptedIdentificationId`. When
        the suggestion has no catalog row to link (a confident AI guess with
        no taxonomy match), this also sets the plant's own `displayName`
        from that raw name guess — the only meaningful action confirming
        can take without a taxonomy row to point to. The named
        identification must belong to the named plant, or the request is
        rejected.

        Source: implementation-plan.md work packages P4-BE-01, P4-CONTRACT-01; ADR-0015.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The plant with its identification confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /gardens/{gardenId}/plants/{plantId}/identification/{identificationId}/record-observation:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: plantId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: identificationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: recordObservationFromIdentification
      tags: [Plants]
      summary: Record an identification's condition analysis as a real observation
      description: |
        Turns a pending `plant_identification` row's already-computed
        `suggestedConditionNote`/`suggestedCareGuidanceNote` into a real,
        dated `Observation` — independent of, and separately callable from,
        `ConfirmPlantIdentification` over the same row. Rejects with `409`
        when the identification carries no condition analysis to record.

        Source: ADR-0015.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The recorded observation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /gardens/{gardenId}/plants/{plantId}/lifecycle-stage:
    parameters:
