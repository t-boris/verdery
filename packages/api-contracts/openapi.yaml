        Transitions the task to `'skipped'` — "not doing this occurrence,"
        distinct in intent from `dismiss`'s "not doing this at all," though
        both are plain terminal transitions with no further data attached.
        Terminal: only legal while `'planned'` or `'suggested'`.

        Source: implementation-plan.md work packages P4-BE-03, P4-CONTRACT-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The skipped task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /gardens/{gardenId}/tasks/{taskId}/delete:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: taskId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: deleteTask
      tags: [Tasks]
      summary: Delete a task
      description: |
        Transitions the task to `'deleted'`. `POST`, not HTTP `DELETE`: this
        module has no hard-delete anywhere — deleting a task is a status
        transition, the exact same shape as `SetPlantStatus('removed')` and
        the map's own `deleteObject` command — and every other terminal
        transition on this resource (`complete`, `dismiss`, `skip`) is
        already a `POST` sub-resource action for the same reason. Using
        HTTP `DELETE` for only this one transition, while its four siblings
        stay `POST`, would read as this task alone supporting a hard delete
        it does not have; consistency with its siblings was chosen over the
        more literal HTTP verb. Terminal: only legal while `'planned'` or
        `'suggested'`.

        Source: implementation-plan.md work packages P4-BE-03, P4-CONTRACT-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The deleted (soft) task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /gardens/{gardenId}/tasks/{taskId}/assign:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: taskId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: assignTask
      tags: [Tasks]
      summary: Assign, reassign, or unassign a task
      description: |
        Assigns a task to an active member of its own garden, reassigns it
        to a different one, or unassigns it (`assigneeProfileId: null`) —
        one operation for all three (P9A-TASK-01). The caller must hold
        `editGardenContent` on the garden (owner or editor); the named
        `assigneeProfileId` must independently hold `editGardenContent` too
        — assigning to a viewer, or to a profile with no active membership
        on this garden, is rejected with `400`. Only legal while the task is
        `'planned'` or `'suggested'`, the same precondition every other task
        mutation on this tag shares. Concurrent assignment resolves through
        the task's own `revision` precondition: the losing request receives
        `412`, never a corrupted task.

        Source: implementation-plan.md work package P9A-TASK-01;
        docs/development/garden-capability-matrix.md, rows B14, B15.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskRequest'
      responses:
        '200':
          description: The task with its new assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /gardens/{gardenId}/tasks/{taskId}/activity:
