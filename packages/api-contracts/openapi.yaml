        createdAt:
          $ref: '#/components/schemas/Timestamp'
        analysisResults:
          type: array
          items:
            $ref: '#/components/schemas/ImageAnalysisResult'

    ObservationMeasurement:
      type: object
      additionalProperties: false
      required: [id, kind, value, unit, createdAt]
      description: One typed measurement (height, width, or count) attached to an observation.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/ObservationMeasurementKind'
        value:
          type: number
          minimum: 0
        unit:
          type: string
          minLength: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    Observation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          gardenId,
          plantId,
          gardenObjectId,
          actorType,
          createdByProfileId,
          noteText,
          conditionSummary,
          correctionKind,
          correctsObservationId,
          isCorrected,
          observedPhenologicalStage,
          observedSunExposure,
          observedDrainage,
          observedGrowingContext,
          observedAt,
          recordedAt,
          photos,
          measurements,
        ]
      description: |
        Immutable and append-only — no revision, no update path. A
        correction is a separate row (see `correctionKind`/
        `correctsObservationId`), never an edit of this one.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          $ref: '#/components/schemas/Uuid'
        plantId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        gardenObjectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        actorType:
          $ref: '#/components/schemas/ObservationActorType'
        createdByProfileId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        noteText:
          type: [string, 'null']
        conditionSummary:
          type: [string, 'null']
        correctionKind:
          oneOf:
            - $ref: '#/components/schemas/ObservationCorrectionKind'
            - type: 'null'
        correctsObservationId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        isCorrected:
          type: boolean
          description: Whether a later observation names this one in its own `correctsObservationId`.
        observedPhenologicalStage:
          oneOf:
            - $ref: '#/components/schemas/PlantLifecycleStage'
            - type: 'null'
          description: |
            What the observer reported seeing, independent of the plant's own
            current `lifecycleStage` (which only advances via
            `transitionLifecycleStage`). Null when not reported.
        observedSunExposure:
          oneOf:
            - $ref: '#/components/schemas/ObservedSunExposure'
            - type: 'null'
          description: Ambient snapshot of the garden's declared context at record time. Null when the garden has not declared this context kind.
        observedDrainage:
          oneOf:
            - $ref: '#/components/schemas/ObservedDrainage'
            - type: 'null'
        observedGrowingContext:
          oneOf:
            - $ref: '#/components/schemas/ObservedGrowingContext'
            - type: 'null'
        observedAt:
          $ref: '#/components/schemas/Timestamp'
        recordedAt:
          $ref: '#/components/schemas/Timestamp'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ObservationPhoto'
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/ObservationMeasurement'

    ObservationListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Observation'

    ObservationPhotoAttachmentRequest:
      type: object
      additionalProperties: false
      required: [mediaId, purpose]
      properties:
        mediaId:
          $ref: '#/components/schemas/Uuid'
        purpose:
          $ref: '#/components/schemas/ObservationPhotoPurpose'

    ObservationMeasurementInput:
      type: object
      additionalProperties: false
      required: [kind, value, unit]
      properties:
        kind:
          $ref: '#/components/schemas/ObservationMeasurementKind'
        value:
          type: number
          minimum: 0
        unit:
          type: string
          minLength: 1

    RecordObservationRequest:
      type: object
      additionalProperties: false
      description: |
        Mirrors `RecordObservationInput`. At least one of `noteText`,
        `conditionSummary`, or a `photos` entry is required, enforced
        server-side. Source: observations-history/application/record-observation.ts.
      properties:
        plantId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        gardenObjectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        noteText:
          type: [string, 'null']
        conditionSummary:
          type: [string, 'null']
        observedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: '`null` or omitted means "use the server''s own timestamp."'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ObservationPhotoAttachmentRequest'
          default: []
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/ObservationMeasurementInput'
          default: []
        observedPhenologicalStage:
          oneOf:
            - $ref: '#/components/schemas/PlantLifecycleStage'
            - type: 'null'
          description: '`null` or omitted means the observer did not report a stage.'

    CorrectObservationRequest:
      type: object
      additionalProperties: false
      required: [correctionKind]
      description: 'Mirrors `CorrectObservationInput`. Source: observations-history/application/correct-observation.ts.'
      properties:
        correctionKind:
          $ref: '#/components/schemas/ObservationCorrectionKind'
        noteText:
          type: [string, 'null']
        conditionSummary:
          type: [string, 'null']
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ObservationPhotoAttachmentRequest'
          default: []
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/ObservationMeasurementInput'
          default: []
        observedPhenologicalStage:
          oneOf:
            - $ref: '#/components/schemas/PlantLifecycleStage'
            - type: 'null'

    TaskTargetKind:
      type: string
      enum: [garden, garden_area, plant]

    TaskStatus:
      type: string
      enum: [planned, suggested, completed, skipped, dismissed, deleted]
      description: |
        `planned` and `suggested` are the only two statuses a task's status
        or details may still be changed from; the other four are terminal.

    TaskUrgency:
      type: string
      enum: [low, normal, high, urgent]

    TaskSource:
      type: string
      enum: [manual, suggested]
      description: This API only ever creates `manual` tasks; `suggested` would originate from a recommendation entity this phase does not build.

    Task:
      type: object
      additionalProperties: false
      required:
        [
          id,
          gardenId,
          targetKind,
          targetGardenAreaMapObjectId,
          targetPlantId,
          title,
          notes,
          status,
          dueDate,
          timeWindowStart,
          timeWindowEnd,
          recurrenceRule,
          urgency,
          source,
          originObservationId,
          originRecommendationId,
          revision,
          createdByProfileId,
          createdAt,
          updatedAt,
          completedAt,
          assignedProfileId,
          assignedAt,
          completedByProfileId,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          $ref: '#/components/schemas/Uuid'
        targetKind:
          $ref: '#/components/schemas/TaskTargetKind'
        targetGardenAreaMapObjectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        targetPlantId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        title:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/TaskStatus'
        dueDate:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        timeWindowStart:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        timeWindowEnd:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        recurrenceRule:
          type: [string, 'null']
          description: Stored only; never parsed, expanded, or validated this pass.
        urgency:
          $ref: '#/components/schemas/TaskUrgency'
        source:
          $ref: '#/components/schemas/TaskSource'
        originObservationId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        originRecommendationId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            The recommendation candidate this task was converted from
            (P7-BE-01) — set exactly when `source` is `'suggested'`, the
            outcome-history linkage FR-24's explainability chain requires.
            Always `null` for manual tasks.
        revision:
          $ref: '#/components/schemas/Revision'
        createdByProfileId:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        assignedProfileId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            The garden member responsible for this task (P9A-TASK-01) —
            `null` when unassigned. Set only by `AssignTask`; the assignee
            must be an active member holding `editGardenContent` (owner or
            editor) on this task's own garden.
        assignedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Present exactly when `assignedProfileId` is.
        completedByProfileId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            The actual caller who completed this task (P9A-TASK-01) — not
            necessarily `assignedProfileId`. Stays readable after that
            profile loses access to this garden, because it references the
            profile directly rather than the membership. `null` until
            completed.

    TaskAttachment:
      type: object
      additionalProperties: false
      required: [id, taskId, mediaId, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        taskId:
          $ref: '#/components/schemas/Uuid'
        mediaId:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    TaskListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    TaskTimeWindowInput:
      type: object
      additionalProperties: false
      description: Shared by `CreateManualTaskRequest`, `EditTaskRequest`, and `RescheduleTaskRequest`.
      properties:
        start:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        end:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    CreateManualTaskRequest:
      type: object
      additionalProperties: false
      required: [target, title]
      description: 'Mirrors `CreateManualTaskInput`. Source: tasks-recommendations/application/create-manual-task.ts.'
      properties:
        target:
          type: object
          additionalProperties: false
          required: [kind]
          description: |
            Mirrors the migration's `task_target_consistency_check`: `kind:
            garden` sets neither id; `kind: garden_area` sets only
            `gardenAreaMapObjectId`; `kind: plant` sets only `plantId`.
          properties:
            kind:
              $ref: '#/components/schemas/TaskTargetKind'
            gardenAreaMapObjectId:
              $ref: '#/components/schemas/Uuid'
            plantId:
              $ref: '#/components/schemas/Uuid'
        title:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: [string, 'null']
        dueDate:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        timeWindow:
          $ref: '#/components/schemas/TaskTimeWindowInput'
        urgency:
          $ref: '#/components/schemas/TaskUrgency'
        originObservationId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Must name an observation belonging to this same garden.

    EditTaskRequest:
      type: object
      additionalProperties: false
      description: |
        Mirrors `EditTaskChanges`. Every property is optional; an omitted
        property leaves the current value unchanged, and an explicit `null`
        on a nullable property clears it. Source
        tasks-recommendations/application/edit-task.ts.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: [string, 'null']
        dueDate:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        timeWindow:
          $ref: '#/components/schemas/TaskTimeWindowInput'
        urgency:
          $ref: '#/components/schemas/TaskUrgency'
        recurrenceRule:
          type: [string, 'null']

    RescheduleTaskRequest:
      type: object
      additionalProperties: false
      description: 'Mirrors `RescheduleTaskInput`. Source: tasks-recommendations/application/reschedule-task.ts.'
      properties:
        dueDate:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        timeWindow:
          $ref: '#/components/schemas/TaskTimeWindowInput'

    CompleteTaskRequest:
      type: object
      additionalProperties: false
      description: '`completionNote` is accepted for interface completeness but has no storage target this pass — it still binds the idempotency fingerprint.'
      properties:
        completionNote:
          type: [string, 'null']

    DismissTaskRequest:
      type: object
      additionalProperties: false
      description: '`reason` is accepted for interface completeness but has no storage target this pass, the same carve-out `CompleteTaskRequest.completionNote` documents.'
      properties:
        reason:
          type: [string, 'null']

    AttachTaskFileRequest:
      type: object
      additionalProperties: false
      required: [mediaId]
      properties:
        mediaId:
          $ref: '#/components/schemas/Uuid'

    AssignTaskRequest:
      type: object
      additionalProperties: false
      required: [assigneeProfileId]
      description: |
        Assigns, reassigns, or unassigns (`assigneeProfileId: null`) a task
        (P9A-TASK-01). `assigneeProfileId` is required, unlike this tag's
        other request bodies: `null` is how a caller explicitly unassigns,
        not a shorthand for "no change." The named profile must be an
        active member of this task's own garden holding `editGardenContent`
        (owner or editor) — assigning to a viewer, or to a non-member, is
        rejected as a bad request. Source:
        tasks-recommendations/application/assign-task.ts.
      properties:
        assigneeProfileId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'

    TaskActivityEntry:
      type: object
      additionalProperties: false
      required:
        [revision, commandType, actorProfileId, status, dueDate, assignedProfileId, recordedAt]
      description: |
        One row of a task's shared activity history (P9A-TASK-01, row B17) —
        the application-layer projection of one `tasks_recommendations.
        task_revision` row: every accepted command against this task,
        oldest first, naming who performed it and what it changed.
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        commandType:
          type: string
          enum:
            [
              createManualTask,
              editTask,
              rescheduleTask,
              completeTask,
              dismissTask,
              skipTask,
              deleteTask,
              convertRecommendationToTask,
              assignTask,
            ]
        actorProfileId:
          $ref: '#/components/schemas/Uuid'
        status:
          oneOf:
            - $ref: '#/components/schemas/TaskStatus'
            - type: 'null'
          description: Populated only for the entries that changed status.
        dueDate:
          oneOf:
            - type: string
              format: date
            - type: 'null'
          description: Populated only for the entries that changed the due date.
        assignedProfileId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Populated only for `assignTask` entries — the assignee that command settled on, or `null` for an unassignment.
        recordedAt:
          $ref: '#/components/schemas/Timestamp'

    TaskActivityListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskActivityEntry'

    # ------------------------------------------------------------------
    # Recommendations and the Today view (P7-BE-01).
    #
    # Candidates are generated exclusively by the server-side rule engine
    # (P7-RULE-01/P7-ASYNC-01); this tag reads and acts on them. Target
    # kind and urgency deliberately reuse the Task vocabularies
    # (`TaskTargetKind`, `TaskUrgency`): the underlying columns share one
    # P0-PROD-03 glossary by design — a recommendation a user acts on may
    # become a suggested task — so the contract shares the schemas rather
    # than translating between identical enums.
    #
    # Source: architecture/recommendations-and-ai.md;
    # technical-specification.md FR-3, FR-24, FR-25.
    # ------------------------------------------------------------------

    RecommendationState:
      type: string
      enum: [generated, eligible, presented, completed, postponed, rejected, expired, superseded]
      description: |
        Section 6's candidate lifecycle. Responses here only ever carry
        `presented` (Today items are marked presented on first inclusion)
        or the state a command produced (`completed`, `postponed`,
        `rejected`); the full vocabulary is declared so clients can render
        any candidate a future surface exposes.

    RecommendationSafetyTier:
      type: string
      enum: [ordinary_care, elevated_risk]
      description: |
        Section 13's tiers, minus `restricted`: a restricted-tier candidate
        is physically impossible (database CHECK + engine type), so the
        contract does not pretend one could appear.

    RecommendationEvidenceKind:
      type: string
      enum:
        [
          plant_identity,
          garden_context,
          weather,
          soil_moisture,
          observation,
          task,
          lifecycle_stage,
          geometry_exposure,
          user_preference,
        ]
      description: Section 4's structured-input list as the closed evidence vocabulary.

    RecommendationPriorityFactorKind:
      type: string
      enum:
        [
          urgency_window,
          plant_impact,
          confidence,
          weather_opportunity_or_risk,
          user_effort_and_availability,
          task_overlap,
          safety_constraint,
          seasonal_constraint,
        ]
      description: Section 7's priority-input list as the closed factor vocabulary.

    RecommendationPriorityFactor:
      type: object
      additionalProperties: false
      required: [kind, contribution, basis]
      description: |
        One stored, explainable priority input: the candidate's score is
        the clamped-to-[0,100] sum of these integer contributions — the
        factors alone reproduce the rank. `basis` names the facts the
        contribution derives from (uncertainty signals such as low
        confidence or a stale-weather label live here and in the evidence
        values).
      properties:
        kind:
          $ref: '#/components/schemas/RecommendationPriorityFactorKind'
        contribution:
          type: integer
          minimum: -100
          maximum: 100
        basis:
          type: object
          additionalProperties: true

    RecommendationEvidence:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          sourceObservationId,
          sourceTaskId,
          sourcePlantId,
          sourceWeatherRecordId,
          factKey,
          factValue,
        ]
      description: |
        One structured fact the recommendation rests on — FR-24's
        "Evidence used". Reference kinds carry exactly their own source id;
        context kinds carry none. `factValue` is the generation-time value
        snapshot, `null` when the referenced row itself is the value.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/RecommendationEvidenceKind'
        sourceObservationId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        sourceTaskId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        sourcePlantId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        sourceWeatherRecordId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        factKey:
          type: string
          minLength: 1
          maxLength: 200
        factValue: {}

    Recommendation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          gardenId,
          ruleKey,
          ruleVersion,
          careCategory,
          safetyTier,
          state,
          urgency,
          targetKind,
          targetGardenAreaMapObjectId,
          targetPlantId,
          windowStart,
          windowEnd,
          explanation,
          supersedesCandidateId,
          presentedAt,
          revision,
          createdAt,
          updatedAt,
        ]
      description: |
        The command-response summary of one recommendation candidate.
        `explanation` is the deterministic reason rendered and stored at
        generation time — never re-rendered against current facts.
        `revision` feeds the next command's `If-Match`.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          $ref: '#/components/schemas/Uuid'
        ruleKey:
          type: string
          minLength: 1
        ruleVersion:
          type: integer
          minimum: 1
        careCategory:
          type: string
          minLength: 1
          maxLength: 100
        safetyTier:
          $ref: '#/components/schemas/RecommendationSafetyTier'
        state:
          $ref: '#/components/schemas/RecommendationState'
        urgency:
          $ref: '#/components/schemas/TaskUrgency'
        targetKind:
          $ref: '#/components/schemas/TaskTargetKind'
        targetGardenAreaMapObjectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        targetPlantId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        windowStart:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        windowEnd:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        explanation:
          type: string
          minLength: 1
        supersedesCandidateId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The prior candidate this one replaced or re-surfaced, when any — the walkable supersession/re-surfacing chain.
        presentedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    TodayRecommendation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          gardenId,
          ruleKey,
          ruleVersion,
          careCategory,
          safetyTier,
          state,
          urgency,
          targetKind,
          targetGardenAreaMapObjectId,
          targetPlantId,
          windowStart,
          windowEnd,
          explanation,
          supersedesCandidateId,
          presentedAt,
          revision,
          createdAt,
          updatedAt,
          actionTitle,
          explanationSource,
          embellishedExplanation,
          priorityScore,
          priorityFactors,
          evidence,
          targetDisplayName,
        ]
      description: |
        One Today item: every `Recommendation` field (declared flat, not
        via `allOf`, because both schemas forbid additional properties)
        plus everything the view alone renders — FR-24's proposed action,
        the explanation source with any served AI embellishment, the
        re-derived priority score with its stored factors, the
        structured evidence, and the target's current display name.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          $ref: '#/components/schemas/Uuid'
        ruleKey:
          type: string
          minLength: 1
        ruleVersion:
          type: integer
          minimum: 1
        careCategory:
          type: string
          minLength: 1
          maxLength: 100
        safetyTier:
          $ref: '#/components/schemas/RecommendationSafetyTier'
        state:
          $ref: '#/components/schemas/RecommendationState'
        urgency:
          $ref: '#/components/schemas/TaskUrgency'
        targetKind:
          $ref: '#/components/schemas/TaskTargetKind'
        targetGardenAreaMapObjectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        targetPlantId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        windowStart:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        windowEnd:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        explanation:
          type: string
          minLength: 1
        supersedesCandidateId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        presentedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        actionTitle:
          type: string
          minLength: 1
          description: The rule version's suggested action — also the title a conversion gives the task.
        explanationSource:
          type: string
          enum: [deterministic, ai_embellished]
          description: |
            Which text explains this item: `ai_embellished` exactly when
            `embellishedExplanation` is present, `deterministic`
            otherwise — including whenever the server-side AI explanation
            switch is off, which restores the pure deterministic response
            wholesale. `explanation` is ALWAYS the deterministic reason
            regardless of this flag; a served embellishment is an
            additional rendering that only rephrases it against the same
            stored evidence, never a replacement and never new advice.
        embellishedExplanation:
          type: [string, 'null']
          description: |
            The validated AI rephrasing of `explanation`, when one exists
            and serving is enabled; `null` otherwise. Clients may show it
            in place of `explanation` for readability but must keep the
            deterministic text available — it is the authoritative
            reason.
        priorityScore:
          type: integer
          minimum: 0
          maximum: 100
        priorityFactors:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationPriorityFactor'
        evidence:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecommendationEvidence'
        targetDisplayName:
          type: [string, 'null']
          description: |
            The plant's current display name for plant targets; `null`
            for garden targets (the client knows its garden) and for
            garden-area targets, which no launch rule produces.

    TodayResult:
      type: object
      additionalProperties: false
      required: [gardenId, generatedAt, items]
      properties:
        gardenId:
          $ref: '#/components/schemas/Uuid'
        generatedAt:
          $ref: '#/components/schemas/Timestamp'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodayRecommendation'

    PostponeRecommendationRequest:
      type: object
      additionalProperties: false
      description: |
        `postponedUntil` is the user's optional re-surfacing horizon. No
        default is applied when absent or `null` — the engine falls back
        to the rule's own recurrence interval.
      properties:
        postponedUntil:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    ConvertRecommendationToTaskResult:
      type: object
      additionalProperties: false
      required: [recommendation, task]
      properties:
        recommendation:
          $ref: '#/components/schemas/Recommendation'
        task:
          $ref: '#/components/schemas/Task'

    # ------------------------------------------------------------------
    # Seasonal plan (P9D-SEASON-API-01).
    #
    # A garden-wide, forward-looking structured read, independent of the
    # rule-fired Today/Recommendations pipeline above — see the
    # `SeasonalPlan` tag description and `getGardenSeasonalPlan`'s own
    # operation description for what this returns and why.
    # ------------------------------------------------------------------

    Hemisphere:
      type: string
      enum: [northern, southern]
      description: |
        Derived from a garden's current georeference latitude sign
        (`deriveHemisphere`, tasks-recommendations/domain/garden-facts.ts) —
        never guessed. Absent from `SeasonalPlanResult.hemisphere` (`null`
        instead) exactly when the garden has never been georeferenced.

    SeasonalPlanTaxonomyTiming:
      type: object
      additionalProperties: false
      required:
        [
          sowIndoorsStartMonth,
          sowIndoorsEndMonth,
          sowOutdoorsStartMonth,
          sowOutdoorsEndMonth,
          transplantStartMonth,
          transplantEndMonth,
          harvestStartMonth,
          harvestEndMonth,
          daysToMaturityMin,
          daysToMaturityMax,
          successionIntervalDays,
          rotationRestSeasons,
        ]
      description: |
        Every timing/duration column a reviewed `taxonomy_seasonal_fact` row
        carries. Every field is independently nullable — a crop with no
        transplant stage, or no known succession benefit, is a fully
        legitimate fact with those fields `null`; never a fabricated window.
      properties:
        sowIndoorsStartMonth:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 12
            - type: 'null'
        sowIndoorsEndMonth:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 12
            - type: 'null'
        sowOutdoorsStartMonth:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 12
            - type: 'null'
        sowOutdoorsEndMonth:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 12
            - type: 'null'
        transplantStartMonth:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 12
            - type: 'null'
        transplantEndMonth:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 12
            - type: 'null'
        harvestStartMonth:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 12
            - type: 'null'
        harvestEndMonth:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 12
            - type: 'null'
        daysToMaturityMin:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        daysToMaturityMax:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        successionIntervalDays:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: 'Null = no succession benefit for this crop.'
        rotationRestSeasons:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: 'Null = no known family-conflict rest period.'

    SeasonalPlanTaxonomyStatusReviewed:
      type: object
      additionalProperties: false
      required: [status, timing]
      properties:
        status:
          type: string
          enum: [reviewed]
        timing:
          $ref: '#/components/schemas/SeasonalPlanTaxonomyTiming'

    SeasonalPlanTaxonomyStatusMissing:
      type: object
      additionalProperties: false
      required: [status]
      description: |
        The explicit "no seasonal data" marker — present whether the
        plant's taxon is entirely unknown or simply has no
        `horticulturally_reviewed` fact for this garden's hemisphere; both
        collapse to this one honest outcome rather than a silently omitted
        plant.
      properties:
        status:
          type: string
          enum: [noSeasonalData]

    SeasonalPlanTaxonomyStatus:
      oneOf:
        - $ref: '#/components/schemas/SeasonalPlanTaxonomyStatusReviewed'
        - $ref: '#/components/schemas/SeasonalPlanTaxonomyStatusMissing'
      discriminator:
        propertyName: status
        # Without explicit mapping, openapi-typescript sets each branch's
        # discriminator literal to the referenced schema's own *name*
        # instead of the real wire value — see `Geometry`'s identical note
        # above.
        mapping:
          reviewed: '#/components/schemas/SeasonalPlanTaxonomyStatusReviewed'
          noSeasonalData: '#/components/schemas/SeasonalPlanTaxonomyStatusMissing'

    SeasonalPlanPlantEntry:
      type: object
      additionalProperties: false
      required: [plantId, taxonomyReferenceId, seasonalFact]
      properties:
        plantId:
          $ref: '#/components/schemas/Uuid'
        taxonomyReferenceId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        seasonalFact:
          $ref: '#/components/schemas/SeasonalPlanTaxonomyStatus'

    SeasonalPlanRotationStatusEntry:
      type: object
      additionalProperties: false
      required:
        [
          plantId,
          gardenAreaMapObjectId,
          family,
          priorFamily,
          priorOccupancyEndedAt,
          elapsedDays,
          rotationRestSeasons,
          restPeriodThresholdDays,
          withinRestPeriod,
        ]
      description: |
        One placed plant's continuous bed-rotation state — computed
        independently of `rotation.crop-rotation-caution`'s own re-fire
        cadence. Present for every plant with a known bed placement AND a
        known own family, including "no known conflict" (`priorFamily`
        `null`) and "no configured rest period" (`rotationRestSeasons`
        `null`) outcomes — never limited to plants that would currently
        justify a fired recommendation.
      properties:
        plantId:
          $ref: '#/components/schemas/Uuid'
        gardenAreaMapObjectId:
          $ref: '#/components/schemas/Uuid'
        family:
          type: string
          minLength: 1
        priorFamily:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
          description: "Null = no departed occupant is known within the lookback window, or the departed occupant's own family is unknown."
        priorOccupancyEndedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        elapsedDays:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
          description: 'Null exactly when priorOccupancyEndedAt is null.'
        rotationRestSeasons:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: 'Null = this taxon has no reviewed seasonal fact for this hemisphere, or the fact configures no rest period.'
        restPeriodThresholdDays:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: 'rotationRestSeasons converted to elapsed days. Null exactly when rotationRestSeasons is null.'
        withinRestPeriod:
          type: boolean
          description: 'True only when priorFamily matches family AND a threshold is configured AND elapsedDays is still below it.'

    SeasonalPlanResult:
      type: object
      additionalProperties: false
      required: [gardenId, hemisphere, plants, rotationStatus]
      properties:
        gardenId:
          $ref: '#/components/schemas/Uuid'
        hemisphere:
          oneOf:
            - $ref: '#/components/schemas/Hemisphere'
            - type: 'null'
          description: 'Null exactly when the garden has never been georeferenced — the explicit "we don''t know your season" signal.'
        plants:
          type: array
          items:
            $ref: '#/components/schemas/SeasonalPlanPlantEntry'
        rotationStatus:
          type: array
          items:
            $ref: '#/components/schemas/SeasonalPlanRotationStatusEntry'

    # ------------------------------------------------------------------
    # Media (P6-API-01).
    #
    # Registration, authorized resumable upload sessions, client-triggered
    # completion verification, status, and short-lived authorized access.
    # `bucketName`/`objectKey` are deliberately never exposed on `Media`:
    # section 2, "Cloud Storage object names are opaque infrastructure
    # identifiers," and section 5, "Signed URLs and resumable session URLs
    # are not persisted as identity" — a client's only ways to reach the
    # underlying object are `uploadUrl` (from `MediaUploadSession`, at
    # registration) and the signed `url` (from `MediaAccess`, at download
    # time), never a bucket/key pair it could construct its own URL from.
    #
    # Source: architecture/media-storage-and-processing.md.
    # ------------------------------------------------------------------

    MediaClass:
      type: string
      enum:
        [
          garden_photo,
          imported_plan,
          raw_capture,
          derived_preview,
          processing_output,
          export_package,
        ]
      description: |
        Matches section 3's class table exactly. No separate "purpose" field
        exists: see `media.media_record.media_class`'s own migration comment
        for why "purpose" resolves to this field alone.

    MediaUploadState:
      type: string
      enum:
        [
          registered,
          authorized,
          uploading,
          verifying,
          rejected,
          available,
          deletion_scheduled,
          deleted,
        ]
      description: |
        Section 6's upload state machine, one column, server-owned and
        revisioned. `uploading` and `verifying` are transient from this
        contract's own point of view: `CompleteMediaUpload` drives a record
        through both in one call, so neither state is normally observed by a
        `GetMediaStatus` read between them.

    MediaProcessingState:
      type: string
      enum: [processing, processed, processing_failed]
      description: |
        Orthogonal to `uploadState` — see `domain/media-lifecycle.ts`'s own
        header comment for why this is a second, independent column rather
        than a continuation of the same state machine. `null` means
        processing has not started (or does not apply to this media class).
        No P6-API-01 endpoint transitions this column; it is surfaced here
        read-only, populated once P6-WORKER-02 exists.

    MediaSensitivityClassification:
      type: string
      enum: [standard, sensitive, restricted]
      description: |
        Derived from `mediaClass` at registration, never client-supplied.
        `restricted` (raw capture) is the classification `GetMediaAccess`
        denies to the operational viewer role per section 12.

    Media:
      type: object
      additionalProperties: false
      required:
        [
          id,
          gardenId,
          uploadedByProfileId,
          mediaClass,
          displayFilename,
          declaredContentType,
          verifiedContentType,
          declaredByteSize,
          verifiedByteSize,
          checksumSha256,
          uploadState,
          processingState,
          sensitivityClassification,
          revision,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        gardenId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: |
            The domain record's own `gardenId` is nullable (a pre-garden
            registration case P6-PLAN-01 will use), but every endpoint this
            contract exposes is garden-scoped, so every `Media` reachable
            through it always has one.
        uploadedByProfileId:
          $ref: '#/components/schemas/Uuid'
        mediaClass:
          $ref: '#/components/schemas/MediaClass'
        displayFilename:
          type: string
          minLength: 1
          maxLength: 255
        declaredContentType:
          type: string
          minLength: 1
        verifiedContentType:
          type: [string, 'null']
          description: Set once `CompleteMediaUpload` reads real object metadata. `null` until then.
        declaredByteSize:
          type: integer
          minimum: 1
        verifiedByteSize:
          type: [integer, 'null']
          minimum: 1
          description: Set once `CompleteMediaUpload` reads real object metadata. `null` until then.
        checksumSha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: |
            The client's own declared checksum, when supplied at
            registration; `null` otherwise. Never independently confirmed
            against the object's real bytes by this stage — see
            `CompleteMediaUpload`'s own description.
        uploadState:
          $ref: '#/components/schemas/MediaUploadState'
        processingState:
          oneOf:
            - $ref: '#/components/schemas/MediaProcessingState'
            - type: 'null'
        sensitivityClassification:
          $ref: '#/components/schemas/MediaSensitivityClassification'
        retentionDeadlineAt:
          type: [string, 'null']
          format: date-time
          description: |
            When this record's retention deadline passes and the retention
            sweep schedules its deletion (P6-RET-01). `null` for every
            class with no computable deadline yet — see
            `GetMediaRetentionPolicy` for the per-class rules and which
            are actually enforced. Set at registration only for
            `export_package` today; the raw-capture rule is anchored to a
            successful-extraction event that has no producer until Garden
            Scan (Phase 10).
        derivatives:
          type: array
          items:
            $ref: '#/components/schemas/MediaDerivativeSummary'
          description: |
            The record's own available display derivatives (P6-PLAN-01).
            Populated by the read operations a client displays media
            through — `GetMediaStatus` and `ListGardenMedia` — and absent
            from write-path responses (`RegisterMediaUpload`,
            `CompleteMediaUpload`), where no derivative can exist yet.
            Tile derivatives are deliberately NOT listed here: a plan's
            tile pyramid is unbounded (thousands of rows), and tile
            CONSUMPTION is deferred — see `docs/development/
            deferred-capabilities.md`. Empty (or absent) when processing
            has not produced any, including for every PDF-classed
            `imported_plan` (P6-WORKER-02's documented deferral).
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    MediaDerivativeKindSummary:
      type: string
      enum: [thumbnail, screen_preview, high_resolution]
      description: |
        The non-tile derivative kinds a `Media.derivatives` entry can name —
        `MediaDerivativeKind` (services/api's domain vocabulary) minus
        `tile`, which is never listed per `Media.derivatives`' own
        description.

    MediaDerivativeSummary:
      type: object
      additionalProperties: false
      required: [derivativeKind, mediaId]
      description: |
        One available display derivative of an original media record: which
        kind it is, and the derivative's OWN media id — the id a client
        passes to `GetMediaAccess` to display it. Closes the P6-WORKER-02
        gap where derivative rows existed server-side but no endpoint
        exposed a derivative's id to a client holding only the original's.
      properties:
        derivativeKind:
          $ref: '#/components/schemas/MediaDerivativeKindSummary'
        mediaId:
          $ref: '#/components/schemas/Uuid'

    MediaListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        nextCursor:
          type: string
          description: Opaque continuation token. Absent when no further page exists.

    RegisterMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [mediaClass, displayFilename, declaredContentType, declaredByteSize]
      properties:
        mediaClass:
          $ref: '#/components/schemas/MediaClass'
        displayFilename:
          type: string
          minLength: 1
          maxLength: 255
        declaredContentType:
          type: string
          minLength: 1
        declaredByteSize:
          type: integer
          minimum: 1
        checksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Supplied "when available" (section 7, step 1). Omit when not yet computed.

    MediaUploadSession:
      type: object
      additionalProperties: false
      required: [media, uploadUrl, uploadUrlExpiresAt]
      description: |
        `RegisterMediaUpload`'s response: the newly `authorized` media record
        plus the backend-authorized resumable upload session the client
        uploads directly to.
      properties:
        media:
          $ref: '#/components/schemas/Media'
        uploadUrl:
          type: string
          format: uri
          description: Resumable upload session URI. The client issues its own PUT requests here directly — never through this API.
        uploadUrlExpiresAt:
          $ref: '#/components/schemas/Timestamp'

    MediaAccess:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      description: "`GetMediaAccess`'s response: a short-lived signed download URL. Never a permanent one."
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          $ref: '#/components/schemas/Timestamp'

    MediaRetentionAnchor:
      type: string
      enum: [none, registration, successful_extraction]
      description: |
        What a class's retention period counts FROM (P6-RET-01). `none`:
        no duration-based rule — the class is retained until user, garden,
        or account deletion (section 15). `registration`: the deadline is
        computed when the upload is registered (`export_package`'s 7-day
        expiry — the deadline is known up front). `successful_extraction`:
        the deadline anchors to a raw capture's successful extraction
        event (section 3's "30 days after successful extraction") — an
        event with no producer until Garden Scan (Phase 10), which is why
        that entry reports `enforced: false`.

    MediaClassRetentionPolicy:
      type: object
      additionalProperties: false
      required: [mediaClass, retentionDays, anchor, enforced, summary]
      description: One media class's retention rule — see `GetMediaRetentionPolicy`.
      properties:
        mediaClass:
          $ref: '#/components/schemas/MediaClass'
        retentionDays:
          type: [integer, 'null']
          minimum: 1
          description: Days from the anchor to the retention deadline. `null` when `anchor` is `none`.
        anchor:
          $ref: '#/components/schemas/MediaRetentionAnchor'
        enforced:
          type: boolean
          description: |
            Whether the server actually computes and enforces this rule
            today. `false` declares intent honestly rather than claiming
            an enforcement that does not run — the raw-capture rule stays
            `false` until its anchoring extraction event exists (Phase 10).
        summary:
          type: string
          description: One-sentence human-readable statement of the rule, mirroring section 3's own class table.

    MediaRetentionPolicyResult:
      type: object
      additionalProperties: false
      required: [policies]
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/MediaClassRetentionPolicy'

    # ------------------------------------------------------------------
    # Synchronization (P5-API-01).
    #
    # Wire shapes for the native offline outbox protocol: client
    # installation registration, batched push, resumable pull of the
    # server change log, and cheap re-acknowledgement of already-pushed
    # operations. Source: architecture/offline-synchronization.md;
    # architecture/api-design.md, section "16. Synchronization Endpoints".
    # ------------------------------------------------------------------

    SyncRecordType:
      type: string
      enum: [garden, gardenObject, calibration, plant, observation, task]
      description: |
        Every record type this service's sync change log writes today.
        Matches `SyncRecordType` in
        services/api/src/platform/sync/sync-record-type.ts exactly — grow
        that union first when a module starts writing a new type, then add
        the matching value here.

        `calibration` has no direct branch in `SyncOperationPayload` below:
        a calibration is written only as a side effect of `map.upsertCalibration`,
        submitted the same way every other map command is, under
        `recordType: 'gardenObject'`.

    SyncRecordReference:
      type: object
      additionalProperties: false
      required: [recordId, recordType, revision]
      description: |
        The minimum a client needs to know a record changed and at what
        revision, without the full record body — what an `accepted` or
        `duplicate` push result carries.
      properties:
        recordId:
          $ref: '#/components/schemas/Uuid'
        recordType:
          $ref: '#/components/schemas/SyncRecordType'
        revision:
          $ref: '#/components/schemas/Revision'

    Calibration:
      type: object
      additionalProperties: false
      required: [id, backgroundObjectId, revision, referencePoints, createdByProfileId, createdAt]
      description: |
        A background-image calibration revision. Recalibration always
        inserts a new row rather than updating one in place, so `revision`
        identifies this specific calibration attempt, not a mutable
        object's current state — mirrors `Calibration` in
        gardens-mapping/application/calibration-repository.ts. Not exposed
        by `SubmitMapCommand`'s own response today; introduced here because
        `GetSyncChanges` needs a real payload for `recordType: 'calibration'`
        upserts, per architecture/offline-synchronization.md's own
        requirement that a change "contains enough information to upsert...
        a local read-model record."

        P6-PLAN-02 added the calibration inputs (known distance, page
        aspect ratio, manual adjustment) and the derived transform and
        residuals; each is optional here only because a legacy P3-shaped
        row carries none of them — every row the reworked command writes
        carries them all.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        backgroundObjectId:
          $ref: '#/components/schemas/Uuid'
        revision:
          $ref: '#/components/schemas/Revision'
        referencePoints:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/CalibrationReferencePoint'
        knownDistance:
          $ref: '#/components/schemas/PlanKnownDistance'
        pageAspectRatio:
          type: number
          exclusiveMinimum: 0
        manualAdjustment:
          $ref: '#/components/schemas/ManualCalibrationAdjustment'
        transform:
          $ref: '#/components/schemas/PlanTransform'
        pointResidualsMetres:
          type: array
          maxItems: 32
          items:
            type: number
            minimum: 0
          description: Aligned index-for-index with `referencePoints`.
        residualErrorMetres:
          type: [number, 'null']
          description: Aggregate RMS over the point residuals; `null` below two control points, and on every legacy row.
        createdByProfileId:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    SyncGardenSnapshot:
      type: object
      additionalProperties: false
      required: [recordType, data]
      properties:
        recordType:
          type: string
          enum: [garden]
        data:
          $ref: '#/components/schemas/Garden'

    SyncGardenObjectSnapshot:
      type: object
      additionalProperties: false
      required: [recordType, data]
      properties:
        recordType:
          type: string
          enum: [gardenObject]
        data:
          $ref: '#/components/schemas/GardenObject'

    SyncCalibrationSnapshot:
      type: object
      additionalProperties: false
      required: [recordType, data]
      properties:
        recordType:
          type: string
          enum: [calibration]
        data:
          $ref: '#/components/schemas/Calibration'

    SyncPlantSnapshot:
      type: object
      additionalProperties: false
      required: [recordType, data]
      properties:
        recordType:
          type: string
          enum: [plant]
        data:
          $ref: '#/components/schemas/Plant'

    SyncObservationSnapshot:
      type: object
      additionalProperties: false
      required: [recordType, data]
      properties:
        recordType:
          type: string
          enum: [observation]
        data:
          $ref: '#/components/schemas/Observation'

    SyncTaskSnapshot:
      type: object
      additionalProperties: false
      required: [recordType, data]
      properties:
        recordType:
          type: string
          enum: [task]
        data:
          $ref: '#/components/schemas/Task'

    SyncRecordSnapshot:
      oneOf:
        - $ref: '#/components/schemas/SyncGardenSnapshot'
        - $ref: '#/components/schemas/SyncGardenObjectSnapshot'
        - $ref: '#/components/schemas/SyncCalibrationSnapshot'
        - $ref: '#/components/schemas/SyncPlantSnapshot'
        - $ref: '#/components/schemas/SyncObservationSnapshot'
        - $ref: '#/components/schemas/SyncTaskSnapshot'
      discriminator:
        propertyName: recordType
        # See Geometry's discriminator comment (above, in the Map section)
        # for why `mapping` to the actual wire values is required for
        # openapi-typescript to narrow real JSON by `recordType`.
        mapping:
          garden: '#/components/schemas/SyncGardenSnapshot'
          gardenObject: '#/components/schemas/SyncGardenObjectSnapshot'
          calibration: '#/components/schemas/SyncCalibrationSnapshot'
          plant: '#/components/schemas/SyncPlantSnapshot'
          observation: '#/components/schemas/SyncObservationSnapshot'
          task: '#/components/schemas/SyncTaskSnapshot'
      description: The full current representation of one record, used both for `GetSyncChanges` upserts and for a push `conflict` result's current server state.

    SyncChange:
      type: object
      additionalProperties: false
      required: [sequence, gardenId, recordId, recordType, operation, recordRevision, committedAt]
      description: |
        One row of `platform.sync_change`. `record` is present when
        `operation` is `'upsert'` and absent when `operation` is `'delete'`
        — a tombstone's identity, type, garden, revision, and sequence are
        already the sibling fields above; no further payload is needed to
        apply it, per architecture/offline-synchronization.md, section
        "17. Deletion and Tombstones".

        Source: services/api/src/platform/sync/sync-change-recorder.ts;
        services/api/src/platform/database/platform-schema.ts (`SyncChangeRow`).
      properties:
        sequence:
          type: integer
          format: int64
          description: Strictly increasing within a garden partition. The pull cursor's ordering key.
        gardenId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: '`null` only for a record with no owning garden; every change this service produces today always has one.'
        recordId:
          $ref: '#/components/schemas/Uuid'
        recordType:
          $ref: '#/components/schemas/SyncRecordType'
        operation:
          type: string
          enum: [upsert, delete]
        recordRevision:
          $ref: '#/components/schemas/Revision'
        committedAt:
          $ref: '#/components/schemas/Timestamp'
        record:
          $ref: '#/components/schemas/SyncRecordSnapshot'

    SyncChangesResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      description: |
        Unlike `GardenListResult`/`PlantListResult`, `nextCursor` is always
        present, including on an empty or final page — see `GetSyncChanges`'s
        own description for why a durable sync cursor cannot use this
        contract's ordinary "absent once caught up" list convention.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        nextCursor:
          type: string
          description: Opaque continuation token for the next `GetSyncChanges` call. Clients must not parse it.

    SyncCreateGardenCommand:
      type: object
      additionalProperties: false
      required: [commandType, request]
      description: The new garden's id is `SyncGardenOperationPayload.gardenId`, not a field here — client-generated, the same way `CreateMapObjectCommand.objectId` is.
      properties:
        commandType:
          type: string
          enum: [gardens.create]
        request:
          $ref: '#/components/schemas/CreateGardenRequest'

