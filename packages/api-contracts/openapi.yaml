  /gardens/{gardenId}/today:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getTodayRecommendations
      tags: [Recommendations]
      summary: Get the Today recommendation set
      description: |
        The garden's small prioritized set of actionable recommendations:
        candidates in `eligible`/`presented` whose validity window covers
        now, ordered by priority score descending — the score is re-derived
        server-side from each candidate's STORED priority factors as the
        clamped-to-[0,100] sum of their integer `contribution`s, so the
        stored factors alone reproduce and explain the rank — with sooner
        `windowEnd` first (nulls last) and candidate id as tie-breakers.

        This query records FIRST PRESENTATION as a deliberate side effect:
        an `eligible` candidate included in the response transitions to
        `presented` (stamping `presentedAt` and bumping `revision`) in the
        same transaction that read it, because inclusion in a returned
        Today response IS the presentation fact. The transition happens
        only on first inclusion, so repeating the request is safe — later
        reads find `presented` and write nothing. Candidates beyond the
        `limit` cap are not returned and not marked.

        Source: implementation-plan.md work package P7-BE-01;
        recommendations-and-ai.md section 6.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum items to return. Defaults to 10.
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
      responses:
        '200':
          description: The prioritized Today set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/seasonal-plan:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    get:
      operationId: getGardenSeasonalPlan
      tags: [SeasonalPlan]
      summary: Get the garden's seasonal plan
      description: |
        Every ACTIVE plant's full reviewed seasonal timing fact (all
        configured windows — sow indoors/outdoors, transplant, harvest,
        days-to-maturity, succession interval, rotation rest period — not
        only whichever window happens to be open right now, unlike the
        rule-fired Today view), plus the continuous bed-rotation status per
        placed plant with a known family — computed independently of
        whether `rotation.crop-rotation-caution` would currently fire.

        A plant whose taxon is unknown, or whose taxon has no reviewed
        seasonal fact for this garden's hemisphere, is still included with
        an explicit `noSeasonalData` marker — never silently omitted, so a
        client can distinguish "nothing configured" from "this plant does
        not exist". `hemisphere` is `null` when the garden has never been
        georeferenced, so the client can render an honest "we don't know
        your season" state instead of an empty list masquerading as
        "nothing to show".

        Authorized the same way `getGardenMap`/`listGardenContextFacts`
        already are (`viewGarden`) — no new capability.

        Source: tasks/todo.md, "P9D-SEASON-01 design decisions", "Stage 3 —
        P9D-SEASON-API-01"; implementation-plan.md work package
        P9D-SEASON-API-01.
      responses:
        '200':
          description: The garden's current seasonal plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonalPlanResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

