      properties:
        type:
          type: string
          enum: [replaceGeometry]
        objectId:
          $ref: '#/components/schemas/Uuid'
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        geometry:
          $ref: '#/components/schemas/Geometry'

    EditVertexCommand:
      type: object
      additionalProperties: false
      required: [type, objectId, expectedRevision, operation, ringIndex, vertexIndex]
      properties:
        type:
          type: string
          enum: [editVertex]
