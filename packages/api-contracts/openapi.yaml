        - $ref: '#/components/schemas/SyncRescheduleTaskCommand'
        - $ref: '#/components/schemas/SyncCompleteTaskCommand'
        - $ref: '#/components/schemas/SyncDismissTaskCommand'
        - $ref: '#/components/schemas/SyncSkipTaskCommand'
        - $ref: '#/components/schemas/SyncDeleteTaskCommand'
        - $ref: '#/components/schemas/SyncAttachTaskFileCommand'
      discriminator:
        propertyName: commandType
        mapping:
          tasks.createManualTask: '#/components/schemas/SyncCreateManualTaskCommand'
          tasks.editTask: '#/components/schemas/SyncEditTaskCommand'
          tasks.rescheduleTask: '#/components/schemas/SyncRescheduleTaskCommand'
          tasks.completeTask: '#/components/schemas/SyncCompleteTaskCommand'
          tasks.dismissTask: '#/components/schemas/SyncDismissTaskCommand'
          tasks.skipTask: '#/components/schemas/SyncSkipTaskCommand'
          tasks.deleteTask: '#/components/schemas/SyncDeleteTaskCommand'
          tasks.attachTaskFile: '#/components/schemas/SyncAttachTaskFileCommand'

    SyncGardenOperationPayload:
      type: object
      additionalProperties: false
      required: [recordType, gardenId, command]
      description: For every `command` here, `gardenId` names the target garden itself — for `gardens.create`, the client-generated id of the new garden.
      properties:
        recordType:
          type: string
          enum: [garden]
        gardenId:
          $ref: '#/components/schemas/Uuid'
        command:
          $ref: '#/components/schemas/SyncGardenCommand'

    SyncGardenObjectOperationPayload:
      type: object
      additionalProperties: false
      required: [recordType, gardenId, command]
      description: |
        Reuses `MapCommandPayload` — the same 13-command union
        `SubmitMapCommand` already accepts — unchanged, rather than
        redefining map commands a second time for sync. `gardenId` is
        explicit here (unlike `SubmitMapCommand`, which reads it from the
        URL path) because `PushSyncOperations` has no per-garden path
        segment: one batch can carry operations for more than one garden.
      properties:
        recordType:
          type: string
          enum: [gardenObject]
        gardenId:
          $ref: '#/components/schemas/Uuid'
        command:
          $ref: '#/components/schemas/MapCommandPayload'

    SyncPlantOperationPayload:
      type: object
      additionalProperties: false
      required: [recordType, gardenId, command]
      properties:
        recordType:
          type: string
          enum: [plant]
        gardenId:
          $ref: '#/components/schemas/Uuid'
        command:
          $ref: '#/components/schemas/SyncPlantCommand'

    SyncObservationOperationPayload:
      type: object
      additionalProperties: false
      required: [recordType, gardenId, command]
      properties:
        recordType:
          type: string
          enum: [observation]
        gardenId:
          $ref: '#/components/schemas/Uuid'
        command:
          $ref: '#/components/schemas/SyncObservationCommand'

    SyncTaskOperationPayload:
      type: object
      additionalProperties: false
      required: [recordType, gardenId, command]
      properties:
        recordType:
          type: string
          enum: [task]
        gardenId:
          $ref: '#/components/schemas/Uuid'
        command:
          $ref: '#/components/schemas/SyncTaskCommand'

    SyncOperationPayload:
      oneOf:
        - $ref: '#/components/schemas/SyncGardenOperationPayload'
        - $ref: '#/components/schemas/SyncGardenObjectOperationPayload'
        - $ref: '#/components/schemas/SyncPlantOperationPayload'
        - $ref: '#/components/schemas/SyncObservationOperationPayload'
        - $ref: '#/components/schemas/SyncTaskOperationPayload'
      discriminator:
        propertyName: recordType
        mapping:
          garden: '#/components/schemas/SyncGardenOperationPayload'
          gardenObject: '#/components/schemas/SyncGardenObjectOperationPayload'
          plant: '#/components/schemas/SyncPlantOperationPayload'
          observation: '#/components/schemas/SyncObservationOperationPayload'
          task: '#/components/schemas/SyncTaskOperationPayload'
      description: |
        The outbox operation's canonical payload — a `oneOf` grouped by
        target record family (`garden`, `gardenObject`/map commands,
        `plant`, `observation`, `task`: every record type Phase 4/5
        established that has a client-issuable command today), each family
        then discriminated again on its own `commandType`. Deliberately not
        one flat 24-branch `oneOf` on a single discriminator: `gardenObject`
        reuses `MapCommandPayload` wholesale, which already discriminates
        internally on `type`, not `commandType`, so a single shared
        discriminator property across every branch is not possible without
        modifying that existing schema.

        `media` is intentionally not a sixth family: media registration and
        upload have their own lifecycle (architecture/offline-synchronization.md,
        section "18. Media Coordination") and are declared per-operation via
        `SyncOperation.mediaPrerequisites`, not submitted as a sync command
        themselves.

    SyncMediaPrerequisite:
      type: object
      additionalProperties: false
      required: [mediaId]
      description: |
        Declares whether an operation may be accepted before its referenced
        media finishes uploading, per architecture/offline-synchronization.md,
        section "18. Media Coordination".
      properties:
        mediaId:
          $ref: '#/components/schemas/Uuid'
        allowPendingUpload:
          type: boolean
          default: false
          description: '`true` for something like a new observation that may sync with `mediaPending`; `false` (the default) for a command that requires verified source media and must stay `blockedByDependency` until it is.'

    SyncOperation:
      type: object
      additionalProperties: false
      required: [operationId, localSequence, payload]
      description: |
        One outbox operation on the wire. Per architecture/offline-synchronization.md,
        section "7. Outbox Operation", two of that section's local outbox
        fields never appear here: "Authenticated profile ID" (the server
        fills it from the authenticated caller, never a client claim — the
        same rule `SubmitMapCommand` documents for `actorProfileId`) and
        "Retry state and last error category" (purely local bookkeeping
        about the client's own retry history). "Target record IDs" and
        "Expected server revision" also aren't repeated here as generic
        fields — they live inside `payload`'s own typed command, the same
        way `MapCommandPayload`'s branches already carry their own
        `objectId`/`expectedRevision` rather than a generic pair at the
        `MapCommandRequest` level.
      properties:
        operationId:
          $ref: '#/components/schemas/Uuid'
          description: Client-generated. The idempotency key for this operation (section "9. Server Idempotency") — reusing it with an identical payload replays the stored outcome; reusing it with a different payload is `rejected`.
        commandVersion:
          type: integer
          minimum: 1
          description: This operation's own command payload version, when it differs from the batch's `operationPayloadVersion` — for example, an operation that has sat unsent in the outbox since before a payload-version bump the rest of this batch was authored under. Defaults to `operationPayloadVersion` when omitted.
        localSequence:
          type: integer
          format: int64
          minimum: 0
          description: This operation's position in the client's own local outbox, not its position within this batch — lets the server and telemetry distinguish "batch item 3" from "outbox item 4102" for backlog observability (section "23. Observability").
        dependsOnOperationIds:
          type: array
          maxItems: 20
          default: []
          items:
            $ref: '#/components/schemas/Uuid'
          description: Operation IDs — in this batch or an earlier one — that must be `accepted` or `duplicate` before this one may process. Makes ordering explicit per section "16. Ordering".
        mediaPrerequisites:
          type: array
          maxItems: 20
          default: []
          items:
            $ref: '#/components/schemas/SyncMediaPrerequisite'
        payload:
          $ref: '#/components/schemas/SyncOperationPayload'

    SyncPushRequest:
      type: object
      additionalProperties: false
      required: [clientInstallationId, protocolVersion, operationPayloadVersion, operations]
      description: |
        Profile is implicit from the authenticated caller, never a request
        field, the same rule every other mutation in this API follows.
        `protocolVersion` is the wire/envelope version (section
        "21. Protocol Versioning"); `operationPayloadVersion` is the default
        command-payload version this batch was authored under — see
        `SyncOperation.commandVersion` for why an individual operation can
        still override it.
      properties:
        clientInstallationId:
          $ref: '#/components/schemas/Uuid'
        protocolVersion:
          type: integer
          minimum: 1
        operationPayloadVersion:
          type: integer
          minimum: 1
        operations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/SyncOperation'

    SyncOperationError:
      type: object
      additionalProperties: false
      required: [code, message]
      description: Per-operation error detail for a `rejected` push result. Deliberately not the shared `Error` schema's `error` object reused by reference — that shape is the HTTP response envelope; this is one line item inside a `200` batch response, with no `correlationId` or `retryable` of its own.
      properties:
        code:
          type: string
          description: Stable dotted code, the same convention `Error.error.code` uses. A reused operation ID with a different payload uses `request.idempotency.key_reused`, the exact code `SharedErrorCode.IdempotencyKeyReused` already names.
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    SyncAcceptedOperationResult:
      type: object
      additionalProperties: false
      required: [outcome, operationId, recordRevisions]
      properties:
        outcome:
          type: string
          enum: [accepted]
        operationId:
          $ref: '#/components/schemas/Uuid'
        recordRevisions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SyncRecordReference'
          description: Every record this operation created or changed, at its new revision — more than one entry for a command like `map.joinLinework` that affects two objects at once.

    SyncDuplicateOperationResult:
      type: object
      additionalProperties: false
      required: [outcome, operationId, recordRevisions]
      description: |
        This exact operation ID, with an identical payload, was already
        `accepted` by a prior push — `recordRevisions` is the same value
        that original acceptance produced; no new mutation ran. A retry of
        an operation whose prior outcome was `rejected`, `conflict`,
        `blockedByDependency`, or `retryLater` simply returns that same
        outcome again, not `duplicate` — only a previously `accepted`
        operation, which had a lasting effect that must not repeat, needs
        this distinct label.
      properties:
        outcome:
          type: string
          enum: [duplicate]
        operationId:
          $ref: '#/components/schemas/Uuid'
        recordRevisions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SyncRecordReference'

    SyncConflictOperationResult:
      type: object
      additionalProperties: false
      required: [outcome, operationId, conflictCode, currentRecord]
      description: Per section "14.2 Same Mutable Object" — carries the current authorized representation, its current revision (inside `currentRecord`), and a stable conflict type. The original local command remains locally recoverable; this response does not discard it.
      properties:
        outcome:
          type: string
          enum: [conflict]
        operationId:
          $ref: '#/components/schemas/Uuid'
        conflictCode:
          type: string
          description: Stable machine-readable conflict type, localized client-side.
        currentRecord:
          $ref: '#/components/schemas/SyncRecordSnapshot'

    SyncRejectedOperationResult:
      type: object
      additionalProperties: false
      required: [outcome, operationId, error]
      properties:
        outcome:
          type: string
          enum: [rejected]
        operationId:
          $ref: '#/components/schemas/Uuid'
        error:
          $ref: '#/components/schemas/SyncOperationError'

    SyncBlockedByDependencyOperationResult:
      type: object
      additionalProperties: false
      required: [outcome, operationId, blockingOperationIds]
      properties:
        outcome:
          type: string
          enum: [blockedByDependency]
        operationId:
          $ref: '#/components/schemas/Uuid'
        blockingOperationIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Uuid'

    SyncRetryLaterOperationResult:
      type: object
      additionalProperties: false
      required: [outcome, operationId]
      description: A transient server-side condition, not a domain outcome — safe for the client to retry with the identical operation ID and payload, unlike `rejected`.
      properties:
        outcome:
          type: string
          enum: [retryLater]
        operationId:
          $ref: '#/components/schemas/Uuid'
        retryAfterSeconds:
          type: integer
          minimum: 0
        reason:
          type: string
          description: Short machine code for telemetry, for example `server.dependency_unavailable`.

    SyncPushOperationResult:
      oneOf:
        - $ref: '#/components/schemas/SyncAcceptedOperationResult'
        - $ref: '#/components/schemas/SyncDuplicateOperationResult'
        - $ref: '#/components/schemas/SyncConflictOperationResult'
        - $ref: '#/components/schemas/SyncRejectedOperationResult'
        - $ref: '#/components/schemas/SyncBlockedByDependencyOperationResult'
        - $ref: '#/components/schemas/SyncRetryLaterOperationResult'
      discriminator:
        propertyName: outcome
        mapping:
          accepted: '#/components/schemas/SyncAcceptedOperationResult'
          duplicate: '#/components/schemas/SyncDuplicateOperationResult'
          conflict: '#/components/schemas/SyncConflictOperationResult'
          rejected: '#/components/schemas/SyncRejectedOperationResult'
          blockedByDependency: '#/components/schemas/SyncBlockedByDependencyOperationResult'
          retryLater: '#/components/schemas/SyncRetryLaterOperationResult'
      description: The exact six outcomes architecture/offline-synchronization.md, section "8. Push Protocol" names, no more and no fewer.

    SyncPushResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncPushOperationResult'
          description: Same length and order as the request's `operations`.

    SyncUnknownOperationResult:
      type: object
      additionalProperties: false
      required: [outcome, operationId]
      description: No durable outcome is stored for this operation ID under this profile — never actually pushed, or its idempotency record has expired. The client's only recourse is a real `PushSyncOperations` call with the operation's full canonical payload.
      properties:
        outcome:
          type: string
          enum: [unknown]
        operationId:
          $ref: '#/components/schemas/Uuid'

    SyncOperationLookupResult:
      oneOf:
        - $ref: '#/components/schemas/SyncAcceptedOperationResult'
        - $ref: '#/components/schemas/SyncDuplicateOperationResult'
        - $ref: '#/components/schemas/SyncConflictOperationResult'
        - $ref: '#/components/schemas/SyncRejectedOperationResult'
        - $ref: '#/components/schemas/SyncBlockedByDependencyOperationResult'
        - $ref: '#/components/schemas/SyncRetryLaterOperationResult'
        - $ref: '#/components/schemas/SyncUnknownOperationResult'
      discriminator:
        propertyName: outcome
        mapping:
          accepted: '#/components/schemas/SyncAcceptedOperationResult'
          duplicate: '#/components/schemas/SyncDuplicateOperationResult'
          conflict: '#/components/schemas/SyncConflictOperationResult'
          rejected: '#/components/schemas/SyncRejectedOperationResult'
          blockedByDependency: '#/components/schemas/SyncBlockedByDependencyOperationResult'
          retryLater: '#/components/schemas/SyncRetryLaterOperationResult'
          unknown: '#/components/schemas/SyncUnknownOperationResult'
      description: "`AcknowledgeSyncOperations`'s result: the same six push outcomes, reusing those exact schemas, plus `unknown` for an operation ID the server has no stored result for."

    SyncAcknowledgeRequest:
      type: object
      additionalProperties: false
      required: [clientInstallationId, operationIds]
      properties:
        clientInstallationId:
          $ref: '#/components/schemas/Uuid'
        operationIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Uuid'
          description: Operation IDs the client believes it already pushed and wants the durable outcome of, without resending their payloads.

    SyncAcknowledgeResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperationLookupResult'
          description: Same length and order as the request's `operationIds`.

    SyncClientPlatform:
      type: string
      enum: [ios, web]
      description: The two application platforms this API serves, per architecture/api-design.md's own opening line ("the native Apple and web applications").

    SyncClientRegistrationRequest:
      type: object
      additionalProperties: false
      required: [platform, appVersion, protocolVersion]
      properties:
        platform:
          $ref: '#/components/schemas/SyncClientPlatform'
        appVersion:
          type: string
          description: Build version of the calling client, as free text — the same untyped convention `LivenessResult.version` already uses.
        protocolVersion:
          type: integer
          minimum: 1
          description: The maximum sync protocol version this installation currently supports.

    SyncClientInstallation:
      type: object
      additionalProperties: false
      required: [id, platform, appVersion, protocolVersion, registeredAt, lastSeenAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        platform:
          $ref: '#/components/schemas/SyncClientPlatform'
        appVersion:
          type: string
        protocolVersion:
          type: integer
          minimum: 1
        registeredAt:
          $ref: '#/components/schemas/Timestamp'
        lastSeenAt:
          $ref: '#/components/schemas/Timestamp'
          description: Set to the current time on every successful register-or-refresh call.

    ExportScope:
      type: string
      enum: [account, garden]
      description: What one export request covers — see `requestExport`'s own scope rules.

    ExportRequestState:
      type: string
      enum: [requested, running, completed, failed]
      description: |
        The export request's server-owned state machine
        (architecture/data-export-and-deletion.md, section 5). `requested`
        — recorded, generation not yet begun. `running` — the checkpointed
        generation job has begun (a retried attempt resumes from recorded
        checkpoints rather than restarting). `completed` — the package is
        written, checksummed, and downloadable until `expiresAt`. `failed`
        — generation concluded without a package; a failed export never
        exposes a partial object (section 16).

    CreateExportRequest:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope:
          $ref: '#/components/schemas/ExportScope'
        gardenId:
          $ref: '#/components/schemas/Uuid'
          description: Required exactly when `scope` is `garden`; forbidden for `account`.
        includeMedia:
          type: boolean
          default: true
          description: Whether entitled original media files are packaged. Media metadata and checksums are always included.

    ExportRequest:
      type: object
      additionalProperties: false
      required:
        [
          id,
          scope,
          gardenId,
          includeMedia,
          formatVersion,
          state,
          boundaryAt,
          outputChecksumSha256,
          failureCode,
          expiresAt,
          completedAt,
          createdAt,
          updatedAt,
        ]
      description: |
        One durable export request. `boundaryAt` is the recorded
        consistency boundary: every structured record in the package was
        read in one repeatable-read snapshot taken at that instant, so
        changes after it are excluded and disclosed in the package
        manifest (architecture/data-export-and-deletion.md, section 7).
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        scope:
          $ref: '#/components/schemas/ExportScope'
        gardenId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The exported garden for `garden` scope; `null` for `account` scope.
        includeMedia:
          type: boolean
        formatVersion:
          type: string
          minLength: 1
          description: The package layout's schema version, stamped into the package's own `export.json`.
        state:
          $ref: '#/components/schemas/ExportRequestState'
        boundaryAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: The consistency boundary, once the snapshot has been taken and checkpointed; `null` before that.
        outputChecksumSha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: The completed ZIP package's SHA-256; `null` until `completed`.
        failureCode:
          type: [string, 'null']
          description: A stable machine reason once `failed`; `null` otherwise.
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When the package (and its download) expires — the 7-day `export_package` retention deadline, set at completion; `null` until `completed`.
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    AccountDeletionState:
      type: string
      enum: [recoveryWindow, purging]
      description: |
        `recoveryWindow` — the deletion is pending and fully reversible
        through `restoreAccount` until `recoveryDeadlineAt`.

        `purging` — the deletion sweep has claimed the account and the
        irreversible purge is running; recovery is refused from here on
        (architecture/data-export-and-deletion.md, section 16: "A deletion
        request cannot return to active accidentally after purge begins").
        A finished purge leaves no readable account at all, so no third
        value exists.

    AccountDeletionGardenResolution:
      type: string
      enum: [gardenDeletionRequested, ownershipRetainedByCoOwner, membershipRevoked]
      description: |
        How one garden the caller had access to was resolved by the account
        deletion (architecture/data-export-and-deletion.md, section 11,
        "Resolves owned shared gardens by transfer or deletion policy").

        - `gardenDeletionRequested` — the caller was the only owner; the
          garden entered its own deletion with the account's deadline.
        - `ownershipRetainedByCoOwner` — another active owner remains; the
          garden survives and only the caller's membership was revoked.
        - `membershipRevoked` — the caller was an editor or viewer; the
          garden survives untouched.

    AccountDeletionGarden:
      type: object
      additionalProperties: false
      required: [gardenId, resolution]
      properties:
        gardenId:
          $ref: '#/components/schemas/Uuid'
        resolution:
          $ref: '#/components/schemas/AccountDeletionGardenResolution'

    AccountDeletion:
      type: object
      additionalProperties: false
      required: [profileId, state, requestedAt, recoveryDeadlineAt, gardens]
      description: |
        The caller's own pending account deletion (P8-DELETE-01). Contains
        no personal data beyond identifiers the caller already holds — it is
        a status resource, not a copy of what is being deleted.
      properties:
        profileId:
          $ref: '#/components/schemas/Uuid'
        state:
          $ref: '#/components/schemas/AccountDeletionState'
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        recoveryDeadlineAt:
          $ref: '#/components/schemas/Timestamp'
        gardens:
          type: array
          description: How each garden the caller had access to at request time was resolved.
          items:
            $ref: '#/components/schemas/AccountDeletionGarden'

    NotificationType:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        The notification's server-owned type vocabulary, deliberately open
        (a plain string, not an enum) so a new type never breaks an
        already-shipped client — an unknown type must render through the
        client's generic fallback (architecture/notifications.md, section
        "16. Testing", "Locale fallback"). Current vocabulary:

        - `care_recommendation` — a new care recommendation candidate was
          generated for a garden the recipient is a member of.
        - `export_ready` — the recipient's own requested data-export
          package completed and is downloadable until it expires
          (P8-EXPORT-01; in-app channel only).

    NotificationPriority:
      type: string
      enum: [normal, high]
      description: |
        Delivery priority derived by the notification policy from the
        source's own urgency (`urgent`/`high` map to `high`). Two values,
        matching what push transports actually distinguish.

    NotificationDeepLink:
      oneOf:
        - $ref: '#/components/schemas/GardenTodayDeepLink'
        - $ref: '#/components/schemas/ExportReadyDeepLink'
      discriminator:
        propertyName: kind
        mapping:
          gardenToday: '#/components/schemas/GardenTodayDeepLink'
          exportReady: '#/components/schemas/ExportReadyDeepLink'
      description: |
        A stable application route reference — resource identifiers only,
        never bearer access; the client authenticates and authorizes after
        opening, and opens a safe fallback when the target is unavailable
        rather than revealing prior existence. `kind` names the route
        target; clients resolve it to their own navigation. New kinds
        arrive as new object variants and an unknown kind must fall back
        to a safe default screen.

        Source: architecture/notifications.md, section "11. Deep Links".

    GardenTodayDeepLink:
      type: object
      additionalProperties: false
      required: [kind, gardenId, recommendationCandidateId]
      properties:
        kind:
          type: string
          enum: [gardenToday]
          description: The garden's Today surface, highlighting the referenced recommendation when it is still presentable.
        gardenId:
          $ref: '#/components/schemas/Uuid'
        recommendationCandidateId:
          $ref: '#/components/schemas/Uuid'

    ExportReadyDeepLink:
      type: object
      additionalProperties: false
      required: [kind, exportRequestId]
      properties:
        kind:
          type: string
          enum: [exportReady]
          description: The recipient's own export request — its state and, while unexpired, its download (P8-EXPORT-01).
        exportRequestId:
          $ref: '#/components/schemas/Uuid'

    Notification:
      type: object
      additionalProperties: false
      required:
        [
          id,
          notificationType,
          priority,
          gardenId,
          recommendationCandidateId,
          templateKey,
          parameters,
          deepLink,
          readAt,
          dismissedAt,
          expiresAt,
          createdAt,
        ]
      description: |
        One durable inbox entry. Carries a stable template key plus
        structured parameters, never rendered text — the client renders in
        the recipient's locale as late as practical
        (architecture/notifications.md, section "8. Localization"), falling
        back generically for an unknown `templateKey`.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        priority:
          $ref: '#/components/schemas/NotificationPriority'
        gardenId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The garden this notification concerns; `null` for account-level entries (an `export_ready` entry for an account-wide export).
        recommendationCandidateId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The recommendation candidate this notification is about, for `care_recommendation` entries — the freshness linkage the delivery pipeline rechecks before any push attempt.
        templateKey:
          type: string
          minLength: 1
          description: Stable, versioned rendering key, e.g. `care_recommendation.created.v1`.
        parameters:
          type: object
          description: Structured template parameters — identifiers and small facts only, never rendered text, secrets, or signed URLs.
        deepLink:
          $ref: '#/components/schemas/NotificationDeepLink'
        readAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        dismissedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: When this entry stops being actionable — the source recommendation's own validity-window end where it has one.
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    NotificationListResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type: string
          description: Present only when another page may exist.

    NotificationQuietHours:
      type: object
      additionalProperties: false
      required: [startMinute, endMinute, timeZone]
      description: |
        A daily do-not-push window in the recipient's own local time,
        expressed as minutes after local midnight. The window may wrap
        midnight (`startMinute` greater than `endMinute`, e.g. 1320 to 420
        for 22:00-07:00); `startMinute` equal to `endMinute` is rejected —
        an always-quiet day is expressed by disabling the push channel,
        not by a degenerate window. Evaluated with real time-zone rules,
        daylight-saving transitions included.
      properties:
        startMinute:
          type: integer
          minimum: 0
          maximum: 1439
        endMinute:
          type: integer
          minimum: 0
          maximum: 1439
        timeZone:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
              description: An IANA time-zone identifier, e.g. `Europe/Berlin`.
            - type: 'null'
          description: "`null` means the profile's own time zone applies."

    NotificationPreferenceEntry:
      type: object
      additionalProperties: false
      required: [notificationType, gardenId, inAppEnabled, pushEnabled]
      description: |
        One explicit per-type toggle row. `gardenId: null` is the caller's
        global setting for the type; a non-null `gardenId` overrides the
        global setting for that one garden. A type/garden combination with
        no entry defaults to every channel enabled.
      properties:
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        gardenId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        inAppEnabled:
          type: boolean
        pushEnabled:
          type: boolean

    NotificationPreferencesDocument:
      type: object
      additionalProperties: false
      required: [revision, quietHours, entries]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: "`0` for a caller who has never written preferences. Feeds `updateNotificationPreferences's` `If-Match`."
        quietHours:
          oneOf:
            - $ref: '#/components/schemas/NotificationQuietHours'
            - type: 'null'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreferenceEntry'

    UpdateNotificationPreferencesRequest:
      type: object
      additionalProperties: false
      required: [quietHours, entries]
      description: |
        The whole replacement document, stated explicitly: `quietHours:
        null` clears quiet hours, and an entry absent from `entries` is
        removed (reverting that type/garden combination to the default).
        At most one entry per type/garden combination.
      properties:
        quietHours:
          oneOf:
            - $ref: '#/components/schemas/NotificationQuietHours'
            - type: 'null'
        entries:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/NotificationPreferenceEntry'

    NotificationDevicePlatform:
      type: string
      enum: [ios, web]
      description: The two application platforms this API serves — the `SyncClientPlatform` vocabulary, repeated here because a device channel and a sync installation are separate registrations with separate lifecycles.

    RegisterNotificationDeviceRequest:
      type: object
      additionalProperties: false
      required: [platform, fcmToken]
      properties:
        platform:
          $ref: '#/components/schemas/NotificationDevicePlatform'
        fcmToken:
          type: string
          minLength: 1
          maxLength: 4096
          description: The installation's current FCM registration token. A secret — stored for delivery only, never echoed back, never logged.

    NotificationDevice:
      type: object
      additionalProperties: false
      required: [installationId, platform, status, lastSeenAt, registeredAt]
      description: |
        One registered push channel — the caller's own device record,
        keyed by the client-minted installation id. Deliberately excludes
        the token: tokens are secrets (architecture/notifications.md,
        section "6. Device Tokens").
      properties:
        installationId:
          $ref: '#/components/schemas/Uuid'
        platform:
          $ref: '#/components/schemas/NotificationDevicePlatform'
        status:
          type: string
          enum: [active, disabled]
          description: Always `active` in a registration response (registering reactivates); `disabled` records a provider invalid-token verdict until the next refresh.
        lastSeenAt:
          $ref: '#/components/schemas/Timestamp'
          description: Set to the current time on every successful register-or-refresh call.
        registeredAt:
          $ref: '#/components/schemas/Timestamp'

  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Authenticated but not authorized for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: |
        Not found, or existence intentionally concealed because the actor is not
        authorized to learn that the resource exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: A domain or synchronization conflict prevented the command.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PreconditionFailed:
      description: The supplied revision precondition did not match the current revision.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnprocessableEntity:
      description: The request is structurally valid but violates a domain rule (for example, the last-owner invariant).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TooManyRequests:
      description: A quota or rate limit was exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: Unexpected internal failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServiceUnavailable:
      description: |
        A required external dependency (for example the transactional email
        provider) is temporarily unavailable or did not respond in time. The
        request was not applied and may be retried.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - firebaseIdToken: []
  - sessionCookie: []
