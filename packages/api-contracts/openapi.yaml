          localAnchor,
          geographicAnchor,
          rotationDegrees,
          scaleCorrection,
          provenance,
          method,
          revision,
        ]
      properties:
        localAnchor:
          $ref: '#/components/schemas/Position'
        geographicAnchor:
          $ref: '#/components/schemas/Position'
          description: Longitude, latitude — WGS84.
        rotationDegrees:
          type: number
        scaleCorrection:
          type: number
          exclusiveMinimum: 0
        accuracyMetres:
          type: number
          minimum: 0
        provenance:
          $ref: '#/components/schemas/ProvenanceKind'
        method:
