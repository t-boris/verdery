          $ref: '#/components/schemas/Uuid'

    post:
      operationId: transitionPlantLifecycleStage
      tags: [Plants]
      summary: Transition a plant's lifecycle stage
      description: |
        Sets `lifecycleStage` to any of the eight stages; no ordering is
        enforced, and transitioning to the stage already held is accepted as
        a legitimate, if inert, command.

        Source: implementation-plan.md work packages P4-BE-01, P4-CONTRACT-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionPlantLifecycleStageRequest'
      responses:
        '200':
          description: The plant at its new lifecycle stage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /gardens/{gardenId}/plants/{plantId}/status:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: plantId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: setPlantStatus
      tags: [Plants]
      summary: Set a plant's status
      description: |
        Sets `status`, the axis orthogonal to `lifecycleStage`. There is no
        hard-delete command for a plant — removing one from active inventory
        is a transition to `'removed'` or `'dead'` here.

        Source: implementation-plan.md work packages P4-BE-01, P4-CONTRACT-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPlantStatusRequest'
      responses:
        '200':
          description: The plant at its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /gardens/{gardenId}/plants/{plantId}/move:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: plantId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: movePlant
      tags: [Plants]
      summary: Move a plant to a different map placement
      description: |
        Updates the plant's placement fields only. Both, when given, must
        reference an active map object in the plant's own garden — the
        garden itself never changes; there is no "move to a different
        garden" command.

        Source: implementation-plan.md work packages P4-BE-01, P4-CONTRACT-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovePlantRequest'
      responses:
        '200':
          description: The plant at its new placement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /gardens/{gardenId}/taxonomy-references:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: query
        in: query
        required: false
        description: Case-insensitive match against scientific, common, or variety name. Omit to list the catalog, most recent first.
        schema:
          type: string
          maxLength: 200
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20

    get:
      operationId: searchTaxonomyReferences
      tags: [Plants]
      summary: Search the taxonomy reference catalog
      description: |
        Reads `plants_inventory.taxonomy_reference`, the read-only species
        catalog `AddPlant` callers pick a `taxonomyReferenceId` from. Not
        scoped to `gardenId` and carries no authorization check of its own —
        the catalog is not garden-owned data, the same way a product catalog
        is not owned by any one customer, so any authenticated caller may
        search it; `gardenId` is present only for URL consistency with every
        other route under this garden and is validated for shape but
        otherwise unused. Consequently this operation never returns `403` or
        a garden-related `404`.

        Source: implementation-plan.md work package P4-CONTRACT-01.
      responses:
        '200':
          description: Matching taxonomy references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyReferenceListResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /gardens/{gardenId}/plant-candidates:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'

    post:
      operationId: addCandidate
      tags: [PlantCandidates]
      summary: Add a plant candidate
      description: |
        Adds a plant being CONSIDERED for the garden — excluded from
        inventory counts, current-care tasks, and "what grows here" claims
        by construction (a separate table, never a status value on
        `Plant`). See ADR-0016 section 1.

        Source: implementation-plan.md work package P11-DATA-01, P11-API-01.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCandidateRequest'
      responses:
        '201':
          description: The created candidate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantCandidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    get:
      operationId: listCandidates
      tags: [PlantCandidates]
      summary: Search a garden's plant candidates
      description: |
        Trigram-fuzzy match against `displayName` when `query` is given,
        combined with optional structured filters (`status`, `priority`,
        `identified`), cursor-paginated the same way `searchPlants`
        paginates. Ranked most-similar first when `query` is given, most
        recently created first otherwise (P11-SEARCH-01, closing the gap
        this operation's own description used to name: "full-text/relevance
        search over candidates is a separate, later capability").

        Source: implementation-plan.md work package P11-API-01, P11-SEARCH-01.
      parameters:
        - name: query
          in: query
          required: false
          description: Trigram-fuzzy match against displayName. Omit to list every candidate matching the other filters.
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          description: Comma-separated statuses to include. Omit to include every status.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PlantCandidateStatus'
        - name: priority
          in: query
          required: false
          description: Comma-separated priorities to include. Omit to include every priority (including candidates with no priority set).
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PlantCandidatePriority'
        - name: identified
          in: query
          required: false
          description: |
            `true` restricts to candidates with a resolved
            `taxonomyReferenceId`; `false` restricts to those without one.
            Omit for no restriction.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantCandidateListResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /gardens/{gardenId}/plant-candidates/{candidateId}:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: candidateId
