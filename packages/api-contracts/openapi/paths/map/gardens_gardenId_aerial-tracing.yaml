parameters:
  - name: gardenId
    in: path
    required: true
    schema:
      $ref: '../../components/schemas/shared.yaml#/Uuid'

post:
  operationId: traceGardenFromAerial
  tags: [Map]
  summary: Detect a property and its visible objects from aerial imagery
  description: |
    Requires exactly one saved lot, normally produced by aligning an uploaded
    plat, centers a fixed-size USGS NAIP image on that lot, and returns reviewable
    structure, driveway, walk, parking, fence, water and tree proposals inside it.
    The aerial reader never creates or replaces the lot boundary. Nothing is
    written until a person accepts an individual proposal.
  responses:
    '200':
      description: Reviewable aerial tracing proposals.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/map-objects.yaml#/AerialTracingResult'
    '401':
      $ref: '../../components/responses.yaml#/Unauthorized'
    '403':
      $ref: '../../components/responses.yaml#/Forbidden'
    '422':
      $ref: '../../components/responses.yaml#/UnprocessableEntity'
    '503':
      $ref: '../../components/responses.yaml#/ServiceUnavailable'
