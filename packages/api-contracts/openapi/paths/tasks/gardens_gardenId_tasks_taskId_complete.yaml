parameters:
  - name: gardenId
    in: path
    required: true
    schema:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
  - name: taskId
    in: path
    required: true
    schema:
      $ref: '../../components/schemas/shared.yaml#/Uuid'

post:
  operationId: completeTask
  tags: [Tasks]
  summary: Complete a task
  description: |
    Transitions the task to `'completed'` and stamps `completedAt`.
    Terminal: only legal while `'planned'` or `'suggested'`. Never
    records an observation on the caller's behalf — that is a separate
    `RecordObservation` call the caller makes on its own if it wants one.
    `completionNote` is accepted for interface completeness but has no
    storage target this pass; it still binds the idempotency fingerprint.

    Source: implementation-plan.md work packages P4-BE-03, P4-CONTRACT-01.
  parameters:
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    - $ref: '../../components/parameters.yaml#/IfMatch'
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/tasks.yaml#/CompleteTaskRequest'
  responses:
    '200':
      description: The completed task.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/tasks.yaml#/Task'
    '400':
      $ref: '../../components/responses.yaml#/BadRequest'
    '401':
      $ref: '../../components/responses.yaml#/Unauthorized'
    '403':
      $ref: '../../components/responses.yaml#/Forbidden'
    '404':
      $ref: '../../components/responses.yaml#/NotFound'
    '409':
      $ref: '../../components/responses.yaml#/Conflict'
    '412':
      $ref: '../../components/responses.yaml#/PreconditionFailed'
