parameters:
  - name: gardenId
    in: path
    required: true
    schema:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
  - name: taskId
    in: path
    required: true
    schema:
      $ref: '../../components/schemas/shared.yaml#/Uuid'

post:
  operationId: rescheduleTask
  tags: [Tasks]
  summary: Reschedule a task
  description: |
    Updates `dueDate`/`timeWindow` only, sharing `EditTask`'s underlying
    update and the same `'planned'`/`'suggested'`-only precondition, kept
    as a distinct command because rescheduling is a distinct first-class
    user action.

    Source: implementation-plan.md work packages P4-BE-03, P4-CONTRACT-01.
  parameters:
    - $ref: '../../components/parameters.yaml#/IdempotencyKey'
    - $ref: '../../components/parameters.yaml#/IfMatch'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/tasks.yaml#/RescheduleTaskRequest'
  responses:
    '200':
      description: The rescheduled task.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/tasks.yaml#/Task'
    '400':
      $ref: '../../components/responses.yaml#/BadRequest'
    '401':
      $ref: '../../components/responses.yaml#/Unauthorized'
    '403':
      $ref: '../../components/responses.yaml#/Forbidden'
    '404':
      $ref: '../../components/responses.yaml#/NotFound'
    '409':
      $ref: '../../components/responses.yaml#/Conflict'
    '412':
      $ref: '../../components/responses.yaml#/PreconditionFailed'
