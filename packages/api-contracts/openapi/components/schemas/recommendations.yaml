# ------------------------------------------------------------------
# Recommendations and the Today view (P7-BE-01).
#
# Candidates are generated exclusively by the server-side rule engine
# (P7-RULE-01/P7-ASYNC-01); this tag reads and acts on them. Target
# kind and urgency deliberately reuse the Task vocabularies
# (`TaskTargetKind`, `TaskUrgency`): the underlying columns share one
# P0-PROD-03 glossary by design — a recommendation a user acts on may
# become a suggested task — so the contract shares the schemas rather
# than translating between identical enums.
#
# Source: architecture/recommendations-and-ai.md;
# technical-specification.md FR-3, FR-24, FR-25.
# ------------------------------------------------------------------
RecommendationState:
  type: string
  enum: [generated, eligible, presented, completed, postponed, rejected, expired, superseded]
  description: |
    Section 6's candidate lifecycle. Responses here only ever carry
    `presented` (Today items are marked presented on first inclusion)
    or the state a command produced (`completed`, `postponed`,
    `rejected`); the full vocabulary is declared so clients can render
    any candidate a future surface exposes.

RecommendationSafetyTier:
  type: string
  enum: [ordinary_care, elevated_risk]
  description: |
    Section 13's tiers, minus `restricted`: a restricted-tier candidate
    is physically impossible (database CHECK + engine type), so the
    contract does not pretend one could appear.

RecommendationEvidenceKind:
  type: string
  enum:
    [
      plant_identity,
      garden_context,
      weather,
      soil_moisture,
      observation,
      task,
      lifecycle_stage,
      geometry_exposure,
      user_preference,
    ]
  description: Section 4's structured-input list as the closed evidence vocabulary.

RecommendationPriorityFactorKind:
  type: string
  enum:
    [
      urgency_window,
      plant_impact,
      confidence,
      weather_opportunity_or_risk,
      user_effort_and_availability,
      task_overlap,
      safety_constraint,
      seasonal_constraint,
    ]
  description: Section 7's priority-input list as the closed factor vocabulary.

RecommendationPriorityFactor:
  type: object
  additionalProperties: false
  required: [kind, contribution, basis]
  description: |
    One stored, explainable priority input: the candidate's score is
    the clamped-to-[0,100] sum of these integer contributions — the
    factors alone reproduce the rank. `basis` names the facts the
    contribution derives from (uncertainty signals such as low
    confidence or a stale-weather label live here and in the evidence
    values).
  properties:
    kind:
      $ref: '#/RecommendationPriorityFactorKind'
    contribution:
      type: integer
      minimum: -100
      maximum: 100
    basis:
      type: object
      additionalProperties: true

RecommendationEvidence:
  type: object
  additionalProperties: false
  required:
    [
      id,
      kind,
      sourceObservationId,
      sourceTaskId,
      sourcePlantId,
      sourceWeatherRecordId,
      factKey,
      factValue,
    ]
  description: |
    One structured fact the recommendation rests on — FR-24's
    "Evidence used". Reference kinds carry exactly their own source id;
    context kinds carry none. `factValue` is the generation-time value
    snapshot, `null` when the referenced row itself is the value.
  properties:
    id:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    kind:
      $ref: '#/RecommendationEvidenceKind'
    sourceObservationId:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Uuid'
        - type: 'null'
    sourceTaskId:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Uuid'
        - type: 'null'
    sourcePlantId:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Uuid'
        - type: 'null'
    sourceWeatherRecordId:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Uuid'
        - type: 'null'
    factKey:
      type: string
      minLength: 1
      maxLength: 200
    factValue: {}

Recommendation:
  type: object
  additionalProperties: false
  required:
    [
      id,
      gardenId,
      ruleKey,
      ruleVersion,
      careCategory,
      safetyTier,
      state,
      urgency,
      targetKind,
      targetGardenAreaMapObjectId,
      targetPlantId,
      windowStart,
      windowEnd,
      explanation,
      supersedesCandidateId,
      presentedAt,
      revision,
      createdAt,
      updatedAt,
    ]
  description: |
    The command-response summary of one recommendation candidate.
    `explanation` is the deterministic reason rendered and stored at
    generation time — never re-rendered against current facts.
    `revision` feeds the next command's `If-Match`.
  properties:
    id:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    gardenId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    ruleKey:
      type: string
      minLength: 1
    ruleVersion:
      type: integer
      minimum: 1
    careCategory:
      type: string
      minLength: 1
      maxLength: 100
    safetyTier:
      $ref: '#/RecommendationSafetyTier'
    state:
      $ref: '#/RecommendationState'
    urgency:
      $ref: '../../components/schemas/tasks.yaml#/TaskUrgency'
    targetKind:
      $ref: '../../components/schemas/tasks.yaml#/TaskTargetKind'
    targetGardenAreaMapObjectId:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Uuid'
        - type: 'null'
    targetPlantId:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Uuid'
        - type: 'null'
    windowStart:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Timestamp'
        - type: 'null'
    windowEnd:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Timestamp'
        - type: 'null'
    explanation:
      type: string
      minLength: 1
    supersedesCandidateId:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Uuid'
        - type: 'null'
      description: The prior candidate this one replaced or re-surfaced, when any — the walkable supersession/re-surfacing chain.
    presentedAt:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Timestamp'
        - type: 'null'
    revision:
      $ref: '../../components/schemas/shared.yaml#/Revision'
    createdAt:
      $ref: '../../components/schemas/shared.yaml#/Timestamp'
    updatedAt:
      $ref: '../../components/schemas/shared.yaml#/Timestamp'

TodayRecommendation:
  type: object
  additionalProperties: false
  required:
    [
      id,
      gardenId,
      ruleKey,
      ruleVersion,
      careCategory,
      safetyTier,
      state,
      urgency,
      targetKind,
      targetGardenAreaMapObjectId,
      targetPlantId,
      windowStart,
      windowEnd,
      explanation,
      supersedesCandidateId,
      presentedAt,
      revision,
      createdAt,
      updatedAt,
      actionTitle,
      explanationSource,
      embellishedExplanation,
      priorityScore,
      priorityFactors,
      evidence,
      targetDisplayName,
    ]
  description: |
    One Today item: every `Recommendation` field (declared flat, not
    via `allOf`, because both schemas forbid additional properties)
    plus everything the view alone renders — FR-24's proposed action,
    the explanation source with any served AI embellishment, the
    re-derived priority score with its stored factors, the
    structured evidence, and the target's current display name.
  properties:
    id:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    gardenId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    ruleKey:
      type: string
      minLength: 1
    ruleVersion:
      type: integer
      minimum: 1
    careCategory:
      type: string
      minLength: 1
      maxLength: 100
    safetyTier:
      $ref: '#/RecommendationSafetyTier'
    state:
      $ref: '#/RecommendationState'
    urgency:
      $ref: '../../components/schemas/tasks.yaml#/TaskUrgency'
    targetKind:
      $ref: '../../components/schemas/tasks.yaml#/TaskTargetKind'
    targetGardenAreaMapObjectId:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Uuid'
        - type: 'null'
    targetPlantId:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Uuid'
        - type: 'null'
    windowStart:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Timestamp'
        - type: 'null'
    windowEnd:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Timestamp'
        - type: 'null'
    explanation:
      type: string
      minLength: 1
    supersedesCandidateId:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Uuid'
        - type: 'null'
    presentedAt:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Timestamp'
        - type: 'null'
    revision:
      $ref: '../../components/schemas/shared.yaml#/Revision'
    createdAt:
      $ref: '../../components/schemas/shared.yaml#/Timestamp'
    updatedAt:
      $ref: '../../components/schemas/shared.yaml#/Timestamp'
    actionTitle:
      type: string
      minLength: 1
      description: The rule version's suggested action — also the title a conversion gives the task.
    explanationSource:
      type: string
      enum: [deterministic, ai_embellished]
      description: |
        Which text explains this item: `ai_embellished` exactly when
        `embellishedExplanation` is present, `deterministic`
        otherwise — including whenever the server-side AI explanation
        switch is off, which restores the pure deterministic response
        wholesale. `explanation` is ALWAYS the deterministic reason
        regardless of this flag; a served embellishment is an
        additional rendering that only rephrases it against the same
        stored evidence, never a replacement and never new advice.
    embellishedExplanation:
      type: [string, 'null']
      description: |
        The validated AI rephrasing of `explanation`, when one exists
        and serving is enabled; `null` otherwise. Clients may show it
        in place of `explanation` for readability but must keep the
        deterministic text available — it is the authoritative
        reason.
    priorityScore:
      type: integer
      minimum: 0
      maximum: 100
    priorityFactors:
      type: array
      items:
        $ref: '#/RecommendationPriorityFactor'
    evidence:
      type: array
      minItems: 1
      items:
        $ref: '#/RecommendationEvidence'
    targetDisplayName:
      type: [string, 'null']
      description: |
        The plant's current display name for plant targets; `null`
        for garden targets (the client knows its garden) and for
        garden-area targets, which no launch rule produces.

TodayResult:
  type: object
  additionalProperties: false
  required: [gardenId, generatedAt, items]
  properties:
    gardenId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    generatedAt:
      $ref: '../../components/schemas/shared.yaml#/Timestamp'
    items:
      type: array
      items:
        $ref: '#/TodayRecommendation'

PostponeRecommendationRequest:
  type: object
  additionalProperties: false
  description: |
    `postponedUntil` is the user's optional re-surfacing horizon. No
    default is applied when absent or `null` — the engine falls back
    to the rule's own recurrence interval.
  properties:
    postponedUntil:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Timestamp'
        - type: 'null'

ConvertRecommendationToTaskResult:
  type: object
  additionalProperties: false
  required: [recommendation, task]
  properties:
    recommendation:
      $ref: '#/Recommendation'
    task:
      $ref: '../../components/schemas/tasks.yaml#/Task'
