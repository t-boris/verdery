      tasks.editTask: '#/SyncEditTaskCommand'
      tasks.rescheduleTask: '#/SyncRescheduleTaskCommand'
      tasks.completeTask: '#/SyncCompleteTaskCommand'
      tasks.dismissTask: '#/SyncDismissTaskCommand'
      tasks.skipTask: '#/SyncSkipTaskCommand'
      tasks.deleteTask: '#/SyncDeleteTaskCommand'
      tasks.attachTaskFile: '#/SyncAttachTaskFileCommand'
