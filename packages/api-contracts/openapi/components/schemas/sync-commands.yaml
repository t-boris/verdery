    plantId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    plantPhotoId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
      description: An existing photo of this plant.

SyncConfirmPlantIdentificationCommand:
