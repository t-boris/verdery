SyncCreateGardenCommand:
  type: object
  additionalProperties: false
  required: [commandType, request]
  description: The new garden's id is `SyncGardenOperationPayload.gardenId`, not a field here — client-generated, the same way `CreateMapObjectCommand.objectId` is.
  properties:
    commandType:
      type: string
      enum: [gardens.create]
    request:
      $ref: '../../components/schemas/gardens.yaml#/CreateGardenRequest'

SyncRenameGardenCommand:
  type: object
  additionalProperties: false
  required: [commandType, expectedRevision, request]
  properties:
    commandType:
      type: string
      enum: [gardens.rename]
    expectedRevision:
      $ref: '../../components/schemas/shared.yaml#/Revision'
    request:
      $ref: '../../components/schemas/gardens.yaml#/RenameGardenRequest'

SyncArchiveGardenCommand:
  type: object
  additionalProperties: false
  required: [commandType, expectedRevision]
  properties:
    commandType:
      type: string
      enum: [gardens.archive]
    expectedRevision:
      $ref: '../../components/schemas/shared.yaml#/Revision'

SyncRequestGardenDeletionCommand:
  type: object
  additionalProperties: false
  required: [commandType, expectedRevision]
  properties:
    commandType:
      type: string
      enum: [gardens.delete_request]
    expectedRevision:
      $ref: '../../components/schemas/shared.yaml#/Revision'

SyncGardenCommand:
  oneOf:
    - $ref: '#/SyncCreateGardenCommand'
    - $ref: '#/SyncRenameGardenCommand'
    - $ref: '#/SyncArchiveGardenCommand'
    - $ref: '#/SyncRequestGardenDeletionCommand'
  discriminator:
    propertyName: commandType
    # See Geometry's discriminator comment for why `mapping` to the
    # actual wire values is required.
    mapping:
      gardens.create: '#/SyncCreateGardenCommand'
      gardens.rename: '#/SyncRenameGardenCommand'
      gardens.archive: '#/SyncArchiveGardenCommand'
      gardens.delete_request: '#/SyncRequestGardenDeletionCommand'
  description: |
    `commandType` values match this codebase's own internal `OPERATION`
    idempotency-operation constants (for example `gardens-mapping/application/rename-garden.ts`'s
    `'gardens.rename'`) exactly, rather than inventing a parallel naming
    scheme, across every command family below.

SyncAddPlantCommand:
  type: object
  additionalProperties: false
  required: [commandType, plantId, request]
  description: '`plantId` is client-generated, carried here because `AddPlantRequest` itself has no id field — REST creation assigns one server-side, but offline optimistic creation needs a stable id up front.'
  properties:
    commandType:
      type: string
      enum: [plants.addPlant]
    plantId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    request:
      $ref: '../../components/schemas/plants.yaml#/AddPlantRequest'

SyncAddPlantFromPhotoCommand:
  type: object
  additionalProperties: false
  required: [commandType, plantId, request]
  properties:
    commandType:
      type: string
      enum: [plants.addPlantFromPhoto]
    plantId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    request:
      $ref: '../../components/schemas/plants.yaml#/AddPlantFromPhotoRequest'

SyncUpdatePlantDetailsCommand:
