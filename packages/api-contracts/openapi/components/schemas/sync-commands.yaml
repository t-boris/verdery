      enum: [plants.movePlant]
    plantId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    expectedRevision:
      $ref: '../../components/schemas/shared.yaml#/Revision'
    request:
      $ref: '../../components/schemas/plants.yaml#/MovePlantRequest'

SyncPlantCommand:
  oneOf:
    - $ref: '#/SyncAddPlantCommand'
    - $ref: '#/SyncAddPlantFromPhotoCommand'
    - $ref: '#/SyncUpdatePlantDetailsCommand'
    - $ref: '#/SyncAttachPlantPhotoCommand'
    - $ref: '#/SyncSetPrimaryPlantPhotoCommand'
    - $ref: '#/SyncConfirmPlantIdentificationCommand'
    - $ref: '#/SyncTransitionPlantLifecycleStageCommand'
    - $ref: '#/SyncSetPlantStatusCommand'
    - $ref: '#/SyncMovePlantCommand'
  discriminator:
    propertyName: commandType
    mapping:
      plants.addPlant: '#/SyncAddPlantCommand'
      plants.addPlantFromPhoto: '#/SyncAddPlantFromPhotoCommand'
      plants.updateDetails: '#/SyncUpdatePlantDetailsCommand'
      plants.attachPlantPhoto: '#/SyncAttachPlantPhotoCommand'
      plants.setPrimaryPlantPhoto: '#/SyncSetPrimaryPlantPhotoCommand'
      plants.confirmIdentification: '#/SyncConfirmPlantIdentificationCommand'
      plants.transitionLifecycleStage: '#/SyncTransitionPlantLifecycleStageCommand'
      plants.setStatus: '#/SyncSetPlantStatusCommand'
      plants.movePlant: '#/SyncMovePlantCommand'

SyncRecordObservationCommand:
  type: object
  additionalProperties: false
  required: [commandType, observationId, request]
  description: '`observationId` is client-generated, the same reasoning as `SyncAddPlantCommand.plantId`.'
  properties:
    commandType:
      type: string
      enum: [observations.record]
    observationId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    request:
      $ref: '../../components/schemas/observations.yaml#/RecordObservationRequest'

SyncCorrectObservationCommand:
  type: object
  additionalProperties: false
  required: [commandType, correctedObservationId, observationId, request]
  description: |
    A correction inserts a new observation row rather than editing the
    original, so this command has two distinct ids: `correctedObservationId`
    (existing, the one being corrected) and `observationId` (new,
    client-generated, the correction row itself) — mirrors
    `CorrectObservation`'s own path parameter versus response identity.
    No `expectedRevision`: observations carry no revision, matching
    `CorrectObservation` having no `If-Match`.
  properties:
    commandType:
      type: string
      enum: [observations.correct]
    correctedObservationId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    observationId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    request:
      $ref: '../../components/schemas/observations.yaml#/CorrectObservationRequest'

SyncObservationCommand:
  oneOf:
    - $ref: '#/SyncRecordObservationCommand'
    - $ref: '#/SyncCorrectObservationCommand'
  discriminator:
    propertyName: commandType
    mapping:
      observations.record: '#/SyncRecordObservationCommand'
      observations.correct: '#/SyncCorrectObservationCommand'

