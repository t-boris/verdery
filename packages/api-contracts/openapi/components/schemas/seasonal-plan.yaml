# ------------------------------------------------------------------
# Seasonal plan (P9D-SEASON-API-01).
#
# A garden-wide, forward-looking structured read, independent of the
# rule-fired Today/Recommendations pipeline above — see the
# `SeasonalPlan` tag description and `getGardenSeasonalPlan`'s own
# operation description for what this returns and why.
# ------------------------------------------------------------------
Hemisphere:
  type: string
  enum: [northern, southern]
  description: |
    Derived from a garden's current georeference latitude sign
    (`deriveHemisphere`, tasks-recommendations/domain/garden-facts.ts) —
    never guessed. Absent from `SeasonalPlanResult.hemisphere` (`null`
    instead) exactly when the garden has never been georeferenced.

SeasonalPlanTaxonomyTiming:
  type: object
  additionalProperties: false
  required:
    [
      sowIndoorsStartMonth,
      sowIndoorsEndMonth,
      sowOutdoorsStartMonth,
      sowOutdoorsEndMonth,
      transplantStartMonth,
      transplantEndMonth,
      harvestStartMonth,
      harvestEndMonth,
      daysToMaturityMin,
      daysToMaturityMax,
      successionIntervalDays,
      rotationRestSeasons,
    ]
  description: |
    Every timing/duration column a reviewed `taxonomy_seasonal_fact` row
    carries. Every field is independently nullable — a crop with no
    transplant stage, or no known succession benefit, is a fully
    legitimate fact with those fields `null`; never a fabricated window.
  properties:
    sowIndoorsStartMonth:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 12
        - type: 'null'
    sowIndoorsEndMonth:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 12
        - type: 'null'
    sowOutdoorsStartMonth:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 12
        - type: 'null'
    sowOutdoorsEndMonth:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 12
        - type: 'null'
    transplantStartMonth:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 12
        - type: 'null'
    transplantEndMonth:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 12
        - type: 'null'
    harvestStartMonth:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 12
        - type: 'null'
    harvestEndMonth:
      oneOf:
        - type: integer
          minimum: 1
          maximum: 12
        - type: 'null'
    daysToMaturityMin:
      oneOf:
        - type: integer
          minimum: 1
        - type: 'null'
    daysToMaturityMax:
      oneOf:
        - type: integer
          minimum: 1
        - type: 'null'
    successionIntervalDays:
      oneOf:
        - type: integer
          minimum: 1
        - type: 'null'
      description: 'Null = no succession benefit for this crop.'
    rotationRestSeasons:
      oneOf:
        - type: integer
          minimum: 1
        - type: 'null'
      description: 'Null = no known family-conflict rest period.'

SeasonalPlanTaxonomyStatusReviewed:
  type: object
  additionalProperties: false
  required: [status, timing]
  properties:
    status:
      type: string
      enum: [reviewed]
    timing:
      $ref: '#/SeasonalPlanTaxonomyTiming'

SeasonalPlanTaxonomyStatusMissing:
  type: object
  additionalProperties: false
  required: [status]
  description: |
    The explicit "no seasonal data" marker — present whether the
    plant's taxon is entirely unknown or simply has no
    `horticulturally_reviewed` fact for this garden's hemisphere; both
    collapse to this one honest outcome rather than a silently omitted
    plant.
  properties:
    status:
      type: string
      enum: [noSeasonalData]

SeasonalPlanTaxonomyStatus:
  oneOf:
    - $ref: '#/SeasonalPlanTaxonomyStatusReviewed'
    - $ref: '#/SeasonalPlanTaxonomyStatusMissing'
  discriminator:
    propertyName: status
    # Without explicit mapping, openapi-typescript sets each branch's
    # discriminator literal to the referenced schema's own *name*
    # instead of the real wire value — see `Geometry`'s identical note
    # above.
    mapping:
      reviewed: '#/SeasonalPlanTaxonomyStatusReviewed'
      noSeasonalData: '#/SeasonalPlanTaxonomyStatusMissing'

SeasonalPlanPlantEntry:
  type: object
  additionalProperties: false
  required: [plantId, taxonomyReferenceId, seasonalFact]
  properties:
    plantId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    taxonomyReferenceId:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/CatalogUuid'
        - type: 'null'
    seasonalFact:
      $ref: '#/SeasonalPlanTaxonomyStatus'

SeasonalPlanRotationStatusEntry:
  type: object
  additionalProperties: false
  required:
    [
      plantId,
      gardenAreaMapObjectId,
      family,
      priorFamily,
      priorOccupancyEndedAt,
      elapsedDays,
      rotationRestSeasons,
      restPeriodThresholdDays,
      withinRestPeriod,
    ]
  description: |
    One placed plant's continuous bed-rotation state — computed
    independently of `rotation.crop-rotation-caution`'s own re-fire
    cadence. Present for every plant with a known bed placement AND a
    known own family, including "no known conflict" (`priorFamily`
    `null`) and "no configured rest period" (`rotationRestSeasons`
    `null`) outcomes — never limited to plants that would currently
    justify a fired recommendation.
  properties:
    plantId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    gardenAreaMapObjectId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    family:
      type: string
      minLength: 1
    priorFamily:
      oneOf:
        - type: string
          minLength: 1
        - type: 'null'
      description: "Null = no departed occupant is known within the lookback window, or the departed occupant's own family is unknown."
    priorOccupancyEndedAt:
      oneOf:
        - $ref: '../../components/schemas/shared.yaml#/Timestamp'
        - type: 'null'
    elapsedDays:
      oneOf:
        - type: integer
          minimum: 0
        - type: 'null'
      description: 'Null exactly when priorOccupancyEndedAt is null.'
    rotationRestSeasons:
      oneOf:
        - type: integer
          minimum: 1
        - type: 'null'
      description: 'Null = this taxon has no reviewed seasonal fact for this hemisphere, or the fact configures no rest period.'
    restPeriodThresholdDays:
      oneOf:
        - type: integer
          minimum: 1
        - type: 'null'
      description: 'rotationRestSeasons converted to elapsed days. Null exactly when rotationRestSeasons is null.'
    withinRestPeriod:
      type: boolean
      description: 'True only when priorFamily matches family AND a threshold is configured AND elapsedDays is still below it.'

SeasonalPlanResult:
  type: object
  additionalProperties: false
  required: [gardenId, hemisphere, plants, rotationStatus]
  properties:
    gardenId:
      $ref: '../../components/schemas/shared.yaml#/Uuid'
    hemisphere:
      oneOf:
        - $ref: '#/Hemisphere'
        - type: 'null'
      description: 'Null exactly when the garden has never been georeferenced — the explicit "we don''t know your season" signal.'
    plants:
      type: array
      items:
        $ref: '#/SeasonalPlanPlantEntry'
    rotationStatus:
      type: array
      items:
        $ref: '#/SeasonalPlanRotationStatusEntry'
