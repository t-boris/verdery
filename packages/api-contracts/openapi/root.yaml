openapi: 3.1.0

info:
  title: Verdery API
  version: 1.0.0
  summary: Garden mapping, care records, and recommendations
  description: |
    The external contract shared by the native Apple and web applications.

    This document is the machine-readable source of truth for paths, schemas,
    error envelopes, pagination, idempotency, and concurrency headers. Generated
    clients are wrapped by handwritten application gateways and are never edited
    by hand.

    Conventions:

    - Paths use plural lowercase nouns; JSON fields use `camelCase`.
    - Identifiers are opaque UUIDv7 strings.
    - Timestamps are RFC 3339 in UTC.
    - Measurements are SI with explicit unit metadata where ambiguity exists.
    - Geometry always travels inside an envelope naming its coordinate space,
      because GeoJSON alone cannot say whether coordinates are local metres or
      longitude and latitude.

    Source: architecture/api-design.md.
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary

servers:
  - url: /v1
    description: Version 1

tags:
  - name: Operations
    description: Service health and readiness, used by infrastructure rather than by end users.
  - name: Gardens
    description: Garden lifecycle — list, create, view, rename, archive, and request deletion.
  - name: Authentication
    description: Web session exchange for the browser client. Native clients use a Firebase ID token directly and never call these.
  - name: Map
    description: The canonical 2D garden map — objects, their categories and geometry, and the single revision-aware command endpoint that mutates them.
  - name: GardenContext
    description: Reviewed or declared facts about a garden's physical growing environment — sun exposure, soil type, drainage, irrigation method, growing context (open ground / container / greenhouse), and microclimate — each with its own source and quality (FR-22).
  - name: Plants
    description: Plant inventory within a garden — placement on the map, photos, taxonomy identification, lifecycle stage, and status.
  - name: PlantCandidates
    description: Plants being CONSIDERED for a garden — excluded from inventory counts, current-care tasks, and "what grows here" claims by construction. Covers candidate CRUD, explicit revision-aware conversion into an actual plant, and garden-specific suitability assessment (matches, cautions, blockers, unknowns, assumptions — never a positive match from missing context).
  - name: PlantCatalog
    description: Shared, source-attributed plant knowledge — not garden-owned data. Today covers a taxon's materialized knowledge profile (resolved, cited facts); catalog search and filtering land with P11-SEARCH-01.
  - name: Observations
    description: The append-only garden and plant observation history, including per-photo image-analysis results and immutable corrections.
  - name: Tasks
    description: Garden care tasks — manual creation, scheduling, completion, and file attachments.
  - name: Recommendations
    description: The Today view's prioritized, explainable recommendation set and its controls — completion, postponement, dismissal, relevance feedback, and conversion into a task. Candidates are generated exclusively by the server-side rule engine; these operations read and act on them, never create them.
  - name: SeasonalPlan
    description: A garden-wide, forward-looking read of every reviewed seasonal timing fact for the garden's own plants (every configured window, not only whichever one happens to be open right now) plus the continuous bed-rotation status per placed plant with a known family — distinct from the rule-fired Today/Recommendations set above, which only ever surfaces a candidate within its own narrow eligibility window.
  - name: Media
    description: Garden-scoped media upload registration, backend-authorized resumable upload sessions, client-triggered completion verification, status, and short-lived authorized download access.
  - name: Synchronization
    description: The native offline outbox protocol — client installation registration, bounded batched push of client commands, resumable pull of the server change log, and cheap re-acknowledgement of already-submitted operations.
  - name: Notifications
    description: The per-user in-app notification inbox — the durable user-facing record of eligible notifications, with read state, dismissal, expiration, and stable deep links — plus the caller's own notification preferences (per-type and per-channel toggles with optional per-garden overrides, quiet hours, and time zone). Intents are created exclusively by the server-side notification policy from domain events; these operations read and annotate them, never create them.
  - name: Account
    description: The caller's own account lifecycle — requesting deletion of the account and everything it solely owns, inspecting the resulting 30-day recovery window and its per-garden resolution, and withdrawing the request before the deadline. These are the only operations reachable while an account is inside its recovery window; every other endpoint refuses a non-active account.
  - name: Exports
    description: Portable data export — request an asynchronous account-wide or garden-scoped export package (ZIP with JSON, GeoJSON, CSV, entitled media, checksums, and a README), poll its state, and obtain a short-lived signed download URL while the package is within its 7-day expiry window. Generation is asynchronous and checkpointed; completion is announced through the in-app notification inbox.
  - name: Collaboration
    description: Operational garden membership and invitations — issue and revoke editor/viewer invitations, accept one as the invited profile, list a garden's member roster, and change or remove a non-owner member's role. Owner promotion, demotion, and ownership transfer (P9A-OWNER-01) are the same tag's recent-auth-gated operations for the owner set itself — promote an active member to co-owner, demote a co-owner back to editor/viewer while at least one other owner remains, and REQUEST transfer of ownership outright to another active member. A requested transfer stays pending until its named recipient accepts or declines it, or its initiator cancels it — ownership only actually moves on acceptance. This tag also carries the two garden-scoped READS onto the professional-service domain (`GET /gardens/{gardenId}/assignments`, `GET /gardens/{gardenId}/engagements`) — they are garden-scoped resources, authorized the same way every other garden read in this tag is, even though the rows they read belong to the `Organizations` tag's own domain.
  - name: Organizations
    description: |
      The professional-service domain (P9B-API-01) — lightweight service
      organizations, their membership, the explicit garden assignment that is
      the ONLY mechanism through which organization membership becomes garden
      access, and client engagement lifecycle. Distinct from `Collaboration`
      deliberately: these resources are organization- and engagement-scoped,
      not garden-scoped, and the single most important invariant this tag's
      own endpoints protect is ADR-0012's own sentence — "Organization
      membership alone grants no garden access. A professional must also have
      an active garden assignment or operational garden membership." No
      endpoint under this tag ever resolves garden access from
      `organization_membership` alone.

      Source: architecture/decisions/ADR-0012-separate-team-and-client-sharing.md;
      architecture/collaboration-and-client-sharing.md, sections
      "7. Service Organizations and Assignments", "8. Client Engagement".
  - name: Publications
    description: |
      The client-publication domain (P9C-PUBLISH-01) — the separate publisher
      capability, and the `internal_draft -> ready_for_client -> published ->
      withdrawn` `client_update` workflow. Distinct from `Organizations`
      deliberately: publisher access is its own capability, explicitly
      granted per engagement, never implied by `manageEngagement`,
      `manageGarden`, or organization/garden role alone (ADR-0012,
      "Publication Boundary": "Owner, editor, or professional status alone
      does not grant publication access"). Task completion never publishes
      automatically — every operation under this tag is a distinct,
      publisher-initiated step.

      Source: architecture/decisions/ADR-0012-separate-team-and-client-sharing.md,
      section "Publication Boundary";
      architecture/collaboration-and-client-sharing.md, sections
      "4.4 Publisher", "10. Publication Workflow", "11. Publication Contents".
  - name: ClientAccess
    description: |
      Email-bound, expiring client invitations and the resulting client
      access grant (P9C-INVITE-01) — architecture/collaboration-and-client-
      sharing.md section 9's six-step flow, end to end. Distinct from
      `Organizations`/`Publications` deliberately: creating and revoking a
      client invitation is gated by the SAME dual capability that
      administers the engagement record (`manageEngagement`/`manageGarden`,
      unlike publisher access, which ADR-0012 names as a genuinely separate
      capability), while accepting one is the CLIENT's own action, gated by
      nothing but the token itself plus a matching verified email — no
      organization or garden authorization applies to that one operation, the
      same posture the `Collaboration` tag's own `acceptInvitation` already
      takes for the operational case. No anonymous public links: every
      invitation is bound to a specific email address, checked against a real
      verified Firebase claim at acceptance.

      Source: implementation-plan.md work package P9C-INVITE-01;
      architecture/collaboration-and-client-sharing.md, section
      "9. Client Invitation and Session".
  - name: ClientPortal
    description: |
      The publication-only client portal read surface (P9C-API-01) — the
      third access plane collaboration-and-client-sharing.md section 2
      names (operational garden / professional workspace / client
      publication), deliberately separate from `Collaboration`/
      `Organizations`/`Publications`/`ClientAccess`: every operation under
      this tag is reachable ONLY through the caller's own CURRENT client
      profile and ACTIVE `client_access_grant`, never through an
      operational garden, organization, or engagement id supplied as
      ambient authority (section 13's own sentence: "Operational
      identifiers are not accepted as authority by client routes. A
      client-facing garden handle may map internally to an engagement and
      garden, but authorization always starts from the current client
      profile and active access grant").

      `clientGardenId` is, concretely, the same value as the underlying
      `client_engagement.id` — but every operation below re-resolves and
      re-authorizes it fresh, from the caller's own active grant, on every
      call; it is never trusted as a bare lookup key the way an
      operational `engagementId` path parameter is in `Organizations`/
      `Publications`. A request naming a `clientGardenId`/`publicationId`
      the caller holds no active grant for receives the IDENTICAL
      concealed `404` a genuinely nonexistent id would — this tag has no
      operation that distinguishes "wrong" from "nonexistent", the
      completion evidence P9C-API-01 names in its own work-package row:
      "Client cannot enumerate operational records or other engagements."

      Read-only in this initial release (section 14: "deliberately
      read-only in the initial release"). `getClientExportManifest`
      (P9C-EXPORT-01) is the one exception to "publication-only": it also
      discloses the accepted garden model (current map objects and plants),
      because section 18 makes that, alongside published deliverables,
      client-exportable by the default residential stewardship policy. It is
      still a plain synchronous read — no request/poll/download job, unlike
      the operational `Exports` tag — because a client export never carries
      operational history or unentitled media, only the same bounded content
      every other operation under this tag already reads.

      Source: implementation-plan.md work packages P9C-API-01, P9C-EXPORT-01;
      architecture/collaboration-and-client-sharing.md, sections
      "2. Core Boundary", "12. Garden Timeline and Time Machine",
      "13. API Surfaces", "18. Data Stewardship, Export, and Engagement End".

