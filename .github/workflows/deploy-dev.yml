name: Deploy to development

# Runs after CI succeeds on master, and can be triggered manually. There is no
# separate "deploy" trigger a human uses that CI does not also use — the same
# `deploy-api.sh` script runs the deployment either way.
#
# Source: implementation-plan.md work package P1-PLAT-03
# ("Keyless development deployment" completion evidence);
# architecture/environments-and-delivery.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: deploy-development
  # A deploy in progress must finish before a newer one starts, so two
  # concurrent runs can never race to update the same Cloud Run revision.
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate, and deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    # Binds this job to the GitHub Environment the workload identity provider
    # requires. Without `environment:` here, the OIDC token GitHub issues
    # carries no `environment` claim, and the identity binding created by
    # infrastructure/gcloud/scripts/06-workload-identity-federation.sh denies
    # every request from this job — this is not optional configuration.
    environment: development

    permissions:
      contents: read
      # Required by google-github-actions/auth to mint short-lived Google
      # credentials from the GitHub OIDC token. No other write permission is
      # granted; this job cannot push code, open issues, or modify the repo.
      id-token: write

    env:
      PROJECT_ID: verdery-dev
      REGION: us-central1
      REPOSITORY: verdery
      SERVICE_ACCOUNT: verdery-dev-deployer@verdery-dev.iam.gserviceaccount.com
      WORKLOAD_IDENTITY_PROVIDER: projects/417008876420/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Logs in directly with the access token `auth` already minted, rather
      # than `gcloud auth configure-docker`'s credential helper, which
      # re-derives its own token by re-running the impersonation chain on
      # every `docker push`. That indirection was never necessary here and
      # only added a second place the workload identity binding had to be
      # correct. (The binding itself did have a real bug, found and fixed
      # separately: GitHub's actual `sub` claim embeds numeric owner/
      # repository IDs this repository's provider attribute-condition did
      # not anticipate — see infrastructure/gcloud/scripts/
      # 06-workload-identity-federation.sh for the fix, a principalSet
      # binding on the `environment` attribute instead of an exact `subject`
      # string.)
      - name: Log in to Artifact Registry
        run: |
          echo '${{ steps.auth.outputs.access_token }}' | \
            docker login -u oauth2accesstoken --password-stdin "https://${REGION}-docker.pkg.dev"

      # A target platform is unnecessary: this runner is already linux/amd64,
      # unlike a local build from Apple silicon (see
      # infrastructure/gcloud/README.md), so there is nothing to cross-compile.
      - name: Build and push the API image
        id: image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/api:${GITHUB_SHA}"
          docker build -f services/api/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      # Runs as a Cloud Run Job with Direct VPC egress rather than from this
      # runner directly: Cloud SQL has no public IP by design (ADR-0007), and a
      # GitHub-hosted runner has no network path to a private VPC IP.
      #
      # Source: infrastructure/gcloud/scripts/07-iam-database-bootstrap.sh.
      - name: Run database migrations
        run: |
          infrastructure/gcloud/scripts/deploy-migration-job.sh dev "${{ steps.image.outputs.image }}"
          gcloud run jobs execute verdery-api-dev-migrate \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait

      - name: Deploy to Cloud Run
        run: infrastructure/gcloud/scripts/deploy-api.sh dev "${{ steps.image.outputs.image }}"

      - name: Verify the deployment answers a real request
        run: |
          SERVICE_URL=$(gcloud run services describe verdery-api-dev \
            --project="${PROJECT_ID}" --region="${REGION}" --format="value(status.url)")
          curl --fail --silent --show-error "${SERVICE_URL}/v1/health/ready"

      # The workers service: the transactional-outbox relay plus the media
      # validation target Cloud Tasks delivers to. Deployed after the API is
      # verified healthy, because deploy-workers.sh reads the API's live URL to
      # build its own result-callback target and a worker that cannot call back
      # can never finish a job.
      #
      # min-instances comes from VERDERY_WORKER_MIN_INSTANCES in dev.env rather
      # than being hardcoded, so an environment deliberately put to sleep with
      # dev-down.sh is not silently woken by the next push to master.
      - name: Build and push the workers image
        id: workers_image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/workers:${GITHUB_SHA}"
          docker build -f services/workers/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Deploy the workers service
        run: infrastructure/gcloud/scripts/deploy-workers.sh dev "${{ steps.workers_image.outputs.image }}"

      # The web client. NEXT_PUBLIC_* values are baked at BUILD time (that is
      # what the prefix means) from the committed, non-secret .env.example
      # values plus the live API origin — see apps/web/Dockerfile's own header.
      # Deployed only after the API verified healthy above, so a broken API
      # deploy never ships a web build pointing at it.
      - name: Build and push the web image
        id: web_image
        run: |
          API_ORIGIN=$(gcloud run services describe verdery-api-dev \
            --project="${PROJECT_ID}" --region="${REGION}" --format="value(status.url)")
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/web:${GITHUB_SHA}"
          docker build -f apps/web/Dockerfile -t "${IMAGE}" \
            --build-arg NEXT_PUBLIC_API_ORIGIN=same-origin \
            --build-arg API_PROXY_ORIGIN="${API_ORIGIN}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyCpCHmqYIRCBHChWqEYsLSZwz7EKjnWBoU \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=verdery-dev.firebaseapp.com \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=verdery-dev \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=verdery-dev.firebasestorage.app \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=417008876420 \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=1:417008876420:web:f41b91b1e56ec5ab217bd1 \
            --build-arg NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY=6LfS618tAAAAAMMgqPSYDBKUEMdZ9xKQJGdv3Ehm \
            .
          docker push "${IMAGE}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Deploy the web client to Cloud Run
        run: infrastructure/gcloud/scripts/deploy-web.sh dev "${{ steps.web_image.outputs.image }}"

      - name: Verify the web deployment serves a page
        run: |
          WEB_URL=$(gcloud run services describe verdery-web-dev \
            --project="${PROJECT_ID}" --region="${REGION}" --format="value(status.url)")
          curl --fail --silent --show-error --output /dev/null "${WEB_URL}/auth/sign-in"
